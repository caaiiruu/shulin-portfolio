name: Temporary Style B Proof QA Contract Patch

on:
  push:
    branches: [migration/style-b-domain-work-v1]
    paths:
      - .github/workflows/tmp-style-b-proof-qa-contract.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: migration/style-b-domain-work-v1
      - name: Patch Human contract for proof quality
        run: |
          echo '' | base64 -d >/tmp/patch.py
          python /tmp/patch.py
      - name: Commit QA contract update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/style-b-domain-work-qa.yml
          git diff --cached --check
          git commit -m "Align Style B QA with proof quality contract"
          git push origin HEAD:migration/style-b-domain-work-v1
