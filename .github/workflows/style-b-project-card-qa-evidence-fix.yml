name: Style B ProjectCard Evidence QA Fix

on:
  push:
    branches:
      - integration/style-b-project-card-webp-v1
    paths:
      - '.github/workflows/style-b-project-card-qa-evidence-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/style-b-project-card-webp-v1
          fetch-depth: 0
      - name: Patch evidence QA only
        run: python3 .github/scripts/style-b-project-card-qa-evidence-fix.py
      - name: Commit QA evidence fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/style-b-project-card-final-qa.yml
          git diff --check --cached
          git commit -m 'Strengthen ProjectCard visual evidence QA'
          git push origin HEAD:integration/style-b-project-card-webp-v1
