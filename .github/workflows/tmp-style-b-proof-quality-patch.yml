name: Temporary Style B Proof Quality Patch

on:
  push:
    branches: [migration/style-b-domain-work-v1]
    paths: [.github/workflows/tmp-style-b-proof-quality-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: migration/style-b-domain-work-v1
      - name: Apply recruiter proof quality contract
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          proof_helpers = r'''  const proofTier = (value, rawLabel) => {
    const label = String(rawLabel || '').trim();
    const text = `${label} ${value}`.toLowerCase();
    const forbidden = /timeline|duration|delivery\s*(?:period|timeline|time)|project\s*(?:period|timeline)|schedule|時程|週期|交付(?:期間|時程|週期)/i;
    if (forbidden.test(label)) return 0;
    const impact = /success|conversion|completion|adoption|active|usage|nps|satisfaction|retention|redemption|digital\s*share|share|rate|faster|speed|efficien|reduc|decreas|increas|improv|saved|accuracy|quality|error|drop|lift|growth|uptake|成功|轉換|完成率|採用|活躍|使用率|滿意|留存|兌換|佔比|比例|更快|效率|降低|減少|提升|增加|節省|準確|品質|錯誤/i;
    if (impact.test(text)) return 2;
    const scale = /user|transaction|store|market|countr|gateway|bank|operator|device|platform|channel|region|location|merchant|customer|account|order|booking|service|system|terminal|branch|workflow|decision\s*model|門市|使用者|用戶|交易|市場|國家|銀行|裝置|平台|通路|地區|商戶|客戶|帳戶|訂單|預訂|服務|系統|據點|工作流|決策模型/i;
    if (scale.test(text)) return 1;
    return 0;
  };

  const selectProofMetrics = (sources, limit) => {
    const candidates = [];
    const seen = new Set();
    let order = 0;
    for (const source of sources) {
      if (!Array.isArray(source)) continue;
      for (const item of source) {
        if (!item || typeof item !== 'object') continue;
        const value = firstText(item.value, item.metric, item.amount);
        const rawLabel = firstText(item.label, item.name, item.description);
        const label = conciseMetricLabel(rawLabel);
        const tier = proofTier(value, rawLabel);
        if (!value || !label || tier === 0) continue;
        const fingerprint = `${value}|${label}`;
        if (seen.has(fingerprint)) continue;
        seen.add(fingerprint);
        candidates.push({ value, label, tier, order: order++ });
      }
    }
    return candidates
      .sort((a, b) => b.tier - a.tier || a.order - b.order)
      .slice(0, limit)
      .map(({ value, label }) => ({ value, label }));
  };
'''

          work = Path('public/site/assets/js/work.js')
          text = work.read_text()
          pattern = re.compile(r"  const evidenceRows = \(raw, adapted, count\) => \{.*?\n  \};\n\n  const tintPalette", re.S)
          replacement = proof_helpers + r'''  const evidenceRows = (raw, adapted, count) => selectProofMetrics([
    raw?.cardMetrics, raw?.card_metrics, raw?.primaryMetrics, raw?.primary_metrics, raw?.metrics,
    raw?.impactEvidence?.primaryMetrics, raw?.impactEvidence?.primary_metrics,
    raw?.impact_evidence?.primaryMetrics, raw?.impact_evidence?.primary_metrics,
    raw?.impactEvidence?.supportingMetrics, raw?.impactEvidence?.supporting_metrics,
    raw?.impact_evidence?.supportingMetrics, raw?.impact_evidence?.supporting_metrics,
    adapted?.cardMetrics, adapted?.card_metrics, adapted?.primaryMetrics, adapted?.primary_metrics, adapted?.metrics,
    adapted?.impactEvidence?.primaryMetrics, adapted?.impactEvidence?.primary_metrics,
    adapted?.impact_evidence?.primaryMetrics, adapted?.impact_evidence?.primary_metrics,
    adapted?.impactEvidence?.supportingMetrics, adapted?.impactEvidence?.supporting_metrics,
    adapted?.impact_evidence?.supportingMetrics, adapted?.impact_evidence?.supporting_metrics
  ], count);

  const tintPalette'''
          text2, n = pattern.subn(replacement, text, count=1)
          if n != 1:
            raise SystemExit(f'work evidenceRows replacement count={n}')
          work.write_text(text2)

          domain = Path('public/site/assets/js/domain-experience.js')
          text = domain.read_text()
          pattern = re.compile(r"  const collectMetrics = \(project\) => \{.*?\n  \};\n\n  const tintPalette", re.S)
          replacement = proof_helpers + r'''  const collectMetrics = (project) => selectProofMetrics([
    project?.cardMetrics, project?.card_metrics, project?.primaryMetrics, project?.primary_metrics, project?.metrics,
    project?.impactEvidence?.primaryMetrics, project?.impactEvidence?.primary_metrics,
    project?.impact_evidence?.primaryMetrics, project?.impact_evidence?.primary_metrics,
    project?.publicContent?.impactEvidence?.primaryMetrics, project?.publicContent?.impact_evidence?.primary_metrics,
    project?.supportingMetrics, project?.supporting_metrics,
    project?.impactEvidence?.supportingMetrics, project?.impactEvidence?.supporting_metrics,
    project?.impact_evidence?.supportingMetrics, project?.impact_evidence?.supporting_metrics,
    project?.publicContent?.impactEvidence?.supportingMetrics, project?.publicContent?.impact_evidence?.supporting_metrics
  ], 3);

  const tintPalette'''
          text2, n = pattern.subn(replacement, text, count=1)
          if n != 1:
            raise SystemExit(f'domain collectMetrics replacement count={n}')
          old = "    metricList.dataset.metricCount = String(metrics.length);"
          new = "    metricList.dataset.metricCount = String(metrics.length);\n    metricList.style.gridTemplateColumns = `repeat(${Math.max(metrics.length, 1)}, minmax(0, 1fr))`;"
          if old not in text2:
            raise SystemExit('domain metric layout anchor missing')
          text2 = text2.replace(old, new, 1)
          domain.write_text(text2)
          PY

          git diff --check
          git diff -- public/site/assets/js/work.js public/site/assets/js/domain-experience.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/site/assets/js/work.js public/site/assets/js/domain-experience.js
          git commit -m "Prioritize recruiter-facing proof metrics"
          git push origin HEAD:migration/style-b-domain-work-v1
