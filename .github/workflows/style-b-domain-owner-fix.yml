name: Style B Domain Owner Fix

on:
  push:
    branches:
      - integration/style-b-project-card-webp-v1
    paths:
      - '.github/workflows/style-b-domain-owner-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/style-b-project-card-webp-v1
          fetch-depth: 0
      - name: Apply Domain owner repair
        run: python3 .github/scripts/style-b-domain-owner-fix.py
      - name: Commit Domain owner repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/site/assets/js/home.js
          git diff --check --cached
          git commit -m 'Remove Home Domain ProjectCard renderer'
          git push origin HEAD:integration/style-b-project-card-webp-v1
