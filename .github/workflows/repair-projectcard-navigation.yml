name: Repair ProjectCard Navigation

on:
  push:
    branches:
      - integration/style-b-project-card-webp-v1
    paths:
      - '.github/workflows/repair-projectcard-navigation.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/style-b-project-card-webp-v1
          fetch-depth: 0
      - name: Apply navigation repair
        run: python3 .github/scripts/repair-projectcard-navigation.py
      - name: Validate patched runtime
        run: |
          git diff --check
          node --check public/site/assets/js/work.js
          node --check public/site/assets/js/domain-experience.js
      - name: Commit runtime repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/site/assets/js/work.js public/site/assets/js/domain-experience.js
          git commit -m 'Restore ProjectCard detail navigation ownership'
          git push origin HEAD:integration/style-b-project-card-webp-v1
