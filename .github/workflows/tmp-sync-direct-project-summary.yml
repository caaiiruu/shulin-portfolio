name: Temporary Direct Project Summary Sync

on:
  push:
    branches: [migration/style-b-domain-work-v1]

permissions:
  contents: write

jobs:
  sync-direct-project-summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/style-b-domain-work-v1
          fetch-depth: 0
      - name: Sync direct project route summary through Style B Work owner
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/site/assets/js/work.js')
          text=p.read_text()
          marker="""  const visibleProjectTitle = (value) => {\n    let text = String(value || '').trim();\n    const prefixes = DATA.implementationContracts?.recruiterFirstPresentation?.hero?.forbiddenVisiblePrefixes;\n    for (const prefix of Array.isArray(prefixes) ? prefixes : []) {\n      if (prefix && text.startsWith(prefix)) { text = text.slice(prefix.length).trimStart(); break; }\n    }\n    return text;\n  };"""
          replacement=marker+"""\n  const syncDirectProjectSummary = () => {\n    const summary = document.querySelector('.direct-project-summary[data-project-route-summary]');\n    if (!summary) return;\n    const projectId = summary.dataset.projectRouteSummary || '';\n    const project = DATA.projects?.[projectId];\n    if (!project) return;\n    const company = summary.querySelector(':scope > p');\n    const title = summary.querySelector(':scope > h1');\n    if (company) company.textContent = firstText(project.company);\n    if (title) title.textContent = visibleProjectTitle(firstText(\n      language() === 'zh' ? project.transformation_zh : project.transformation,\n      project.transformation,\n      project.title,\n      projectId\n    ));\n  };\n  syncDirectProjectSummary();\n  document.addEventListener('portfolio:language', syncDirectProjectSummary);"""
          if replacement in text:
              print('Already synced')
              raise SystemExit(0)
          count=text.count(marker)
          if count!=1:
              raise SystemExit(f'Expected one visibleProjectTitle marker, got {count}')
          p.write_text(text.replace(marker,replacement,1))
          PY
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/site/assets/js/work.js
          git commit -m "Sync direct project route titles with Style B cards"
          git push origin HEAD:migration/style-b-domain-work-v1
