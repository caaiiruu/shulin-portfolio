name: Temporary Style B Proof Quality Patch V2

on:
  push:
    branches: [migration/style-b-domain-work-v1]
    paths: [.github/workflows/tmp-style-b-proof-quality-patch-v2.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: migration/style-b-domain-work-v1
      - name: Apply scoped proof selector patch
        run: echo '' | base64 -d >/tmp/patch.py && python /tmp/patch.py
      - name: Commit scoped product change
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/site/assets/js/work.js public/site/assets/js/domain-experience.js
          git commit -m "Prioritize recruiter-facing proof metrics"
          git push origin HEAD:migration/style-b-domain-work-v1
