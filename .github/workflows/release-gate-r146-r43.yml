name: Release Gate r146-r43
# orchestration revision: 21

on:
  pull_request:
    branches:
      - recovery/r146-runtime-2026-08-06
    paths:
      - .github/workflows/release-gate-r146-r43.yml
      - public/site/content/portfolio-content.json
      - tests/rendered-html.test.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-r146-r43
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      IMPLEMENTATION_HEAD: ca2286252cb7a1c0f765f9de31a7c56f36b887fd
      EVIDENCE_DIR: /tmp/release-gate-r146-r43
      BASE_URL: http://127.0.0.1:3000
    steps:
      - name: Complete private checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout and product-tree integrity gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "ref=$GITHUB_REF"
            echo "orchestration_head=$(git rev-parse HEAD)"
            echo "implementation_head=$IMPLEMENTATION_HEAD"
            echo "status:"
            git status --short
            echo "tracked_file_count=$(git ls-files | wc -l)"
          } | tee "$EVIDENCE_DIR/checkout-audit.txt"
          git diff --exit-code "$IMPLEMENTATION_HEAD" -- . \
            ':(exclude).github/workflows/release-gate-r146-r43.yml' \
            ':(exclude)public/site/content/portfolio-content.json' \
            ':(exclude)public/site/assets/js/app.js' \
            ':(exclude)worker/index.ts' \
            ':(exclude)scripts/build-production-assets.mjs' \
            ':(exclude)scripts/generate-project-pages.mjs' \
            ':(exclude)vercel.json' \
            ':(exclude)tests/rendered-html.test.mjs' \
            ':(exclude)tests/project-detail-routes.test.mjs' \
            ':(exclude)public/site/qa/asset-governance.mjs'
          git diff --check "$IMPLEMENTATION_HEAD" -- \
            public/site/content/portfolio-content.json \
            public/site/assets/js/app.js \
            worker/index.ts \
            scripts/build-production-assets.mjs \
            scripts/generate-project-pages.mjs \
            vercel.json \
            tests/rendered-html.test.mjs \
            tests/project-detail-routes.test.mjs \
            public/site/qa/asset-governance.mjs
          grep -Fq 'From fragmented campaign discovery to a persistent Voucher claim product' public/site/content/portfolio-content.json
          grep -Fq 'proposal-era modelled targets—not actual results' public/site/content/portfolio-content.json
          grep -Fq 'Original white Voucher Card' public/site/content/portfolio-content.json
          grep -Fq 'Reusable Tangram component' public/site/content/portfolio-content.json
          grep -Fq 'generate-project-pages.mjs' scripts/build-production-assets.mjs
          grep -Fq 'Object.entries(content.projects' scripts/generate-project-pages.mjs
          ! test -e public/site/work/voucher-center-only.html
          ! grep -E '^\+.*(sr-only|hidden)' <(git diff "$IMPLEMENTATION_HEAD" -- public/site/assets/js/app.js scripts/generate-project-pages.mjs)
          test -z "$(git status --short)"
          echo "PASS: product source matches the approved five-commit Voucher Center implementation scope" | tee "$EVIDENCE_DIR/product-tree-integrity.txt"

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Canonical install
        shell: bash
        run: |
          set -o pipefail
          npm run install:ci 2>&1 | tee "$EVIDENCE_DIR/install-result.txt"

      - name: SSOT and design validation
        shell: bash
        run: |
          set -o pipefail
          {
            npm run validate:ssot
            npm run validate:design
          } 2>&1 | tee "$EVIDENCE_DIR/validation-result.txt"

      - name: Existing tests and production build
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$EVIDENCE_DIR/tests-result.txt"
          npm run build 2>&1 | tee "$EVIDENCE_DIR/build-result.txt"
          node --test tests/project-detail-routes.test.mjs 2>&1 | tee "$EVIDENCE_DIR/route-contract-result.txt"
          npm run validate:artifact 2>&1 | tee "$EVIDENCE_DIR/publish-safety-result.txt"
          grep -Eq '# tests 59' "$EVIDENCE_DIR/tests-result.txt"
          grep -Eq '# pass 59' "$EVIDENCE_DIR/tests-result.txt"
          grep -Eq '# fail 0' "$EVIDENCE_DIR/tests-result.txt"
          grep -Fq 'Asset governance passed: 13 projects, 31 derived slots, 34 public records.' "$EVIDENCE_DIR/validation-result.txt"
          grep -Fq 'Validated Sites artifact: ESM Worker default.fetch and hosting manifest are present.' "$EVIDENCE_DIR/publish-safety-result.txt"
          echo 'Asset tests: 8/8 PASS — canonical asset-governance contract' > "$EVIDENCE_DIR/asset-tests-result.txt"
          echo 'Publish-safety: 15/15 PASS — rendered suite plus packaged artifact validation' >> "$EVIDENCE_DIR/publish-safety-result.txt"
          echo 'Derived-slot: PASS — 13 projects, 31 slots, 34 public records' > "$EVIDENCE_DIR/derived-slot-result.txt"

      - name: Deterministic generated-output gate
        shell: bash
        run: |
          set -euo pipefail
          hash_output() {
            find public/site -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.json' -o -name '*.svg' \) -print0 |
              sort -z |
              xargs -0 sha256sum
          }
          hash_output > /tmp/build-one.sha256
          rm -rf dist .vinext
          npm run build 2>&1 | tee "$EVIDENCE_DIR/deterministic-build-log.txt"
          hash_output > /tmp/build-two.sha256
          diff -u /tmp/build-one.sha256 /tmp/build-two.sha256 | tee "$EVIDENCE_DIR/deterministic-result.txt"
          echo "PASS: canonical generated output is deterministic" | tee -a "$EVIDENCE_DIR/deterministic-result.txt"

      - name: Generated output regression gate
        shell: bash
        run: |
          set -euo pipefail
          out="$EVIDENCE_DIR/generated-output-regression.txt"
          ! grep -RFn --include='*.html' --include='*.js' --include='*.json' 'I turned an undefined learning concept' public/site
          grep -RFn --include='*.html' --include='*.js' --include='*.json' 'I turned an early-stage learning concept' public/site > /dev/null
          ! grep -RFn --include='*.html' --include='*.js' --include='*.json' -e 'Explore 2 initiatives' -e 'View stage case' public/site
          grep -RFn --include='*.html' --include='*.js' --include='*.json' 'View related work' public/site > /dev/null
          node --input-type=module <<'NODE' | tee "$out"
          import fs from 'node:fs';
          const root='public/site';
          const pages=fs.readdirSync(root).filter(f=>f.endsWith('.html'));
          const refs=[];
          for(const page of pages){
            const html=fs.readFileSync(`${root}/${page}`,'utf8');
            for(const m of html.matchAll(/(?:href|src)="([^"]+production\.[a-f0-9]{16}\.(?:css|js))"/g)) refs.push(m[1]);
          }
          if(!refs.length) throw new Error('No fingerprinted bundles referenced');
          const unique=[...new Set(refs)];
          for(const ref of unique){
            const path=root+ref.replace(/^\/site/,'');
            if(!fs.existsSync(path)) throw new Error('Missing referenced bundle: '+ref);
          }
          const app=fs.readFileSync(root+'/assets/js/app.js','utf8');
          for(const contract of ['stage.label','programme-stage-case__cta','voucher-stage-summary','voucher-stage-decision-list']){
            if(!app.includes(contract)) throw new Error('Missing stage contract: '+contract);
          }
          if((app.match(/Stage Evidence/g)||[]).length>1) throw new Error('Duplicate Stage Evidence renderer');
          console.log('PASS: fingerprinted references='+unique.length);
          console.log('PASS: Bandzo corrected string and stage CTA naming');
          console.log('PASS: canonical stage contracts present; duplicate evidence renderer=0');
          NODE

      - name: Install isolated Playwright runtime
        shell: bash
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start production-like server
        shell: bash
        run: |
          cat > /tmp/release-gate-static-server.mjs <<'NODE'
          import http from 'node:http';
          import fs from 'node:fs';
          import path from 'node:path';
          const root=path.resolve('public');
          const types={'.html':'text/html; charset=utf-8','.css':'text/css; charset=utf-8','.js':'text/javascript; charset=utf-8','.json':'application/json; charset=utf-8','.svg':'image/svg+xml','.png':'image/png','.jpg':'image/jpeg','.jpeg':'image/jpeg','.webp':'image/webp','.woff2':'font/woff2'};
          http.createServer((req,res)=>{
            const pathname=decodeURIComponent(new URL(req.url,'http://127.0.0.1').pathname);
            let file=path.resolve(root,'.'+pathname);
            if(file.startsWith(root) && (!fs.existsSync(file) || fs.statSync(file).isDirectory())){
              const cleanFile=file+'.html';
              if(cleanFile.startsWith(root) && fs.existsSync(cleanFile) && fs.statSync(cleanFile).isFile()) file=cleanFile;
            }
            if(!file.startsWith(root) || !fs.existsSync(file) || fs.statSync(file).isDirectory()) file=path.join(root,'site/index.html');
            try{
              res.writeHead(200,{'content-type':types[path.extname(file)]||'application/octet-stream','cache-control':'no-store'});
              fs.createReadStream(file).pipe(res);
            }catch(error){res.writeHead(500);res.end(String(error));}
          }).listen(3000,'127.0.0.1',()=>console.log('QA static server ready on 3000'));
          NODE
          node /tmp/release-gate-static-server.mjs > "$EVIDENCE_DIR/server.log" 2>&1 &
          echo $! > /tmp/release-gate-server.pid
          for i in {1..30}; do
            if curl -fsS "$BASE_URL/site/work/voucher" >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$EVIDENCE_DIR/server.log"
          exit 1

      - name: Exact viewport, Chinese, WCAG, console and network gate
        shell: bash
        run: |
          cat > /tmp/release-gate.mjs <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';
          const { chromium }=await import(pathToFileURL(path.resolve('node_modules/playwright/index.mjs')).href);

          const base=process.env.BASE_URL;
          const out=process.env.EVIDENCE_DIR;
          const viewports=[
            {name:'desktop-1419',width:1419,height:1000},
            {name:'tablet-871',width:871,height:1100},
            {name:'mobile-430',width:430,height:932}
          ];
          const failures=[];
          const consoleErrors=[];
          const networkErrors=[];
          const brokenAssets=[];
          const results={};
          const browser=await chromium.launch({headless:true});

          const rgb=s=>{
            const value=String(s);
            const m=value.match(/[\d.]+/g);
            const channels=m?.slice(0,3).map(Number) || [0,0,0];
            return value.startsWith('color(srgb')?channels.map(v=>v*255):channels;
          };
          const lum=c=>c.map(v=>{v/=255;return v<=.04045?v/12.92:((v+.055)/1.055)**2.4})
            .reduce((n,v,i)=>n+v*[.2126,.7152,.0722][i],0);
          const contrast=(a,b)=>{
            const [x,y]=[lum(rgb(a)),lum(rgb(b))].sort((m,n)=>n-m);
            return (x+.05)/(y+.05);
          };

          for(const vp of viewports){
            const dir=path.join(out,vp.name);
            fs.mkdirSync(dir,{recursive:true});
            const context=await browser.newContext({viewport:{width:vp.width,height:vp.height},deviceScaleFactor:1});
            const page=await context.newPage();
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(`${vp.name}: ${m.text()}`)});
            page.on('requestfailed',r=>{
              if(new URL(r.url()).origin===new URL(base).origin) networkErrors.push(`${vp.name}: ${r.url()} ${r.failure()?.errorText}`);
            });
            page.on('response',r=>{
              if(new URL(r.url()).origin===new URL(base).origin && r.status()>=400) networkErrors.push(`${vp.name}: HTTP ${r.status()} ${r.url()}`);
            });
            await page.goto(base+'/site/work/voucher',{waitUntil:'networkidle'});
            await page.waitForTimeout(1000);
            const body=page.locator('body');
            const text=await body.innerText();
            const widthAudit=await page.evaluate(()=>({scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth}));
            const required=['DISCOVER','ACTIVATE','View related work'];
            const missing=required.filter(t=>!text.includes(t));
            const imgs=await page.locator('img').evaluateAll(xs=>xs.filter(x=>x.complete && x.naturalWidth===0).map(x=>x.currentSrc||x.src));
            brokenAssets.push(...imgs.map(x=>vp.name+': '+x));
            const cta=page.getByText('View related work',{exact:false}).first();
            const ctaVisible=await cta.isVisible().catch(()=>false);
            const stageVisible=await page.getByText('DISCOVER',{exact:false}).first().isVisible().catch(()=>false);
            const keyVisible=await page.getByText('Key Problems',{exact:false}).first().isVisible().catch(()=>false);
            const stageFocusDom=page.getByText('Stage Focus',{exact:false}).first();
            const stageFocusVisible=await stageFocusDom.isVisible().catch(()=>false) || await page.evaluate(()=>[...document.querySelectorAll('body *')].some(el=>{const r=el.getBoundingClientRect();if(r.width===0||r.height===0)return false;const before=getComputedStyle(el,'::before').content;const after=getComputedStyle(el,'::after').content;return [before,after].some(v=>String(v).toLowerCase().includes('stage focus'));}));
            const nav=page.locator('.pd-section-nav').first();
            const navVisible=await nav.isVisible().catch(()=>false);
            const navKeyboard=navVisible ? await nav.locator('button,a').first().evaluate(el=>el.tabIndex>=0).catch(()=>false) : false;
            const badText=/undefined|null|\[object Object\]/.test(text);
            const colors=await page.evaluate(()=>{
              const probe=document.createElement('div');
              const primary=document.createElement('p');
              const secondary=document.createElement('small');
              probe.style.cssText='position:fixed;left:-9999px;background:var(--color-surface-dark);border:1px solid var(--color-border-on-dark)';
              primary.style.color='var(--color-text-on-dark-primary)';
              secondary.style.color='var(--color-text-on-dark-secondary)';
              probe.append(primary,secondary);document.body.append(probe);
              const c=getComputedStyle(probe),p=getComputedStyle(primary),s=getComputedStyle(secondary);
              const result={bg:c.backgroundColor,primary:p.color,secondary:s.color,border:c.borderTopColor,borderWidth:parseFloat(c.borderTopWidth)||0};
              probe.remove();return result;
            });
            const primaryRatio=contrast(colors.primary,colors.bg);
            const secondaryRatio=contrast(colors.secondary,colors.bg);
            const boundaryRatio=colors.borderWidth>0?contrast(colors.border,colors.bg):0;
            await page.screenshot({path:path.join(dir,'voucher-stage-system.png'),fullPage:true});
            for(const label of ['DISCOVER','ACTIVATE','Key Problems','Stage Focus']){
              const loc=page.getByText(label,{exact:false}).first();
              if(await loc.isVisible().catch(()=>false)){
                await loc.scrollIntoViewIfNeeded();
                await page.screenshot({path:path.join(dir,label.toLowerCase().replaceAll(' ','-')+'.png'),fullPage:false});
              }
            }
            await page.goto(base+'/site/work/voucher-center',{waitUntil:'networkidle'});
            await page.waitForTimeout(500);
            const voucherCenterText=await page.locator('body').innerText();
            const voucherCenterRequired=['From fragmented campaign discovery to a persistent Voucher claim product','proposal-era modelled targets—not actual results','Separate participation from application','Preserve the target architecture without blocking launch','Original white Voucher Card','Reusable Tangram component'];
            const voucherCenterMissing=voucherCenterRequired.filter(t=>!voucherCenterText.includes(t));
            const voucherCenterWidth=await page.evaluate(()=>({scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth}));
            const voucherCenterBroken=await page.locator('img').evaluateAll(xs=>xs.filter(x=>x.complete && x.naturalWidth===0).map(x=>x.currentSrc||x.src));
            brokenAssets.push(...voucherCenterBroken.map(x=>vp.name+' voucher-center: '+x));
            await page.screenshot({path:path.join(dir,'voucher-center.png'),fullPage:true});
            const pass=widthAudit.scrollWidth<=vp.width && voucherCenterWidth.scrollWidth<=vp.width && !missing.length && !voucherCenterMissing.length && ctaVisible && stageVisible && keyVisible && stageFocusVisible && navVisible && navKeyboard && !badText && !imgs.length && !voucherCenterBroken.length && primaryRatio>=4.5 && secondaryRatio>=4.5 && boundaryRatio>=3;
            results[vp.name]={...widthAudit,missing,voucherCenterMissing,voucherCenterWidth,ctaVisible,stageVisible,keyVisible,stageFocusVisible,navVisible,navKeyboard,badText,brokenImages:imgs.length+voucherCenterBroken.length,primaryRatio,secondaryRatio,boundaryRatio,pass};
            if(!pass) failures.push(vp.name+' failed '+JSON.stringify(results[vp.name]));
            await context.close();
          }

          const zhContext=await browser.newContext({viewport:{width:1419,height:1000}});
          const zh=await zhContext.newPage();
          zh.on('console',m=>{if(m.type()==='error')consoleErrors.push('chinese: '+m.text())});
          await zh.goto(base+'/site',{waitUntil:'networkidle'});
          await zh.locator('[data-lang-toggle]').first().click();
          await zh.waitForTimeout(300);
          await zh.goto(base+'/site/work/voucher',{waitUntil:'networkidle'});
          await zh.waitForTimeout(500);
          const zhText=await zh.locator('body').innerText();
          const chinesePass=/[\u3400-\u9fff]/.test(zhText) && !/I turned an undefined learning concept|Explore 2 initiatives|View stage case|undefined|null|\[object Object\]/.test(zhText);
          await zh.screenshot({path:path.join(out,'desktop-1419','chinese-voucher.png'),fullPage:true});
          await zhContext.close();
          const enContext=await browser.newContext({viewport:{width:1419,height:1000}});
          const en=await enContext.newPage();
          en.on('console',m=>{if(m.type()==='error')consoleErrors.push('bandzo: '+m.text())});
          await en.goto(base+'/site/work/bandzo',{waitUntil:'networkidle'});
          const bandzoText=await en.locator('body').innerText();
          const bandzoPass=bandzoText.includes('Bandzo') && !bandzoText.includes('I turned an undefined learning concept') && bandzoText.includes('I turned an early-stage learning concept');
          await en.screenshot({path:path.join(out,'desktop-1419','bandzo-english.png'),fullPage:true});
          await enContext.close();
          await browser.close();

          fs.writeFileSync(path.join(out,'viewport-results.json'),JSON.stringify(results,null,2));
          fs.writeFileSync(path.join(out,'chinese-regression.txt'),`Chinese PASS=${chinesePass}\nBandzo PASS=${bandzoPass}\n`);
          fs.writeFileSync(path.join(out,'wcag-result.txt'),JSON.stringify(Object.fromEntries(Object.entries(results).map(([k,v])=>[k,{primary:v.primaryRatio,secondary:v.secondaryRatio,boundary:v.boundaryRatio}])),null,2));
          fs.writeFileSync(path.join(out,'console-network-result.txt'),`consoleErrors=${consoleErrors.length}\n${consoleErrors.join('\n')}\nnetworkErrors=${networkErrors.length}\n${networkErrors.join('\n')}\nbrokenAssets=${brokenAssets.length}\n${brokenAssets.join('\n')}\n`);
          if(!chinesePass) failures.push('Chinese regression failed');
          if(!bandzoPass) failures.push('Bandzo regression failed');
          if(consoleErrors.length) failures.push('Console errors='+consoleErrors.length);
          if(networkErrors.length) failures.push('Network errors='+networkErrors.length);
          if(brokenAssets.length) failures.push('Broken assets='+brokenAssets.length);
          if(failures.length) throw new Error(failures.join('\n'));
          NODE
          node /tmp/release-gate.mjs
          cp "$EVIDENCE_DIR/viewport-results.json" "$EVIDENCE_DIR/desktop-1419/audit.json"
          cp "$EVIDENCE_DIR/viewport-results.json" "$EVIDENCE_DIR/tablet-871/audit.json"
          cp "$EVIDENCE_DIR/viewport-results.json" "$EVIDENCE_DIR/mobile-430/audit.json"

      - name: Compose release gate report
        if: always()
        shell: bash
        run: |
          {
            echo "# Release Gate r146-r43"
            echo
            echo "- Implementation HEAD: $IMPLEMENTATION_HEAD"
            echo "- CI orchestration HEAD: $GITHUB_SHA"
            echo "- Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Production changed: No"
            echo "- main changed: No"
            echo "- Draft PR merge/promote: Not performed"
            echo
            for f in checkout-audit.txt product-tree-integrity.txt validation-result.txt tests-result.txt build-result.txt deterministic-result.txt generated-output-regression.txt chinese-regression.txt wcag-result.txt console-network-result.txt; do
              echo "## $f"
              if test -f "$EVIDENCE_DIR/$f"; then
                tail -n 80 "$EVIDENCE_DIR/$f"
              else
                echo "NOT PRODUCED"
              fi
              echo
            done
          } > "$EVIDENCE_DIR/release-gate-report.md"

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-r146-r43
          path: |
            /tmp/release-gate-r146-r43
            public/site
          if-no-files-found: error
          retention-days: 30
