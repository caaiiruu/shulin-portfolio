name: Temporary Domain CTA Divider Fix

on:
  push:
    branches:
      - migration/style-b-domain-work-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply scoped Domain CTA divider fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('public/site/assets/css/components/domain-experience.css')
          s=p.read_text()
          old='.domain-experience .domain-project-card-v2__cta{width:100%;margin:var(--space-3) 0 0;padding:var(--space-3) 0 0}'
          new='.domain-experience .domain-project-card-v2__cta{position:relative;border-top:0}\n.domain-experience .domain-project-card-v2__cta::before{position:absolute;top:0;left:var(--domain-card-content-padding);right:var(--domain-card-content-padding);height:var(--dimension-1px);background:color-mix(in srgb,var(--sys-color-text-primary) 16%,transparent);content:"";pointer-events:none}'
          if old not in s:
              raise SystemExit('target Domain CTA override not found')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
          git diff -- public/site/assets/css/components/domain-experience.css
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/site/assets/css/components/domain-experience.css
          git commit -m 'Preserve Domain CTA geometry with inset divider'
          git push origin HEAD:migration/style-b-domain-work-v1
