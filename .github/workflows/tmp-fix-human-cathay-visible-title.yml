name: Temporary Human Cathay Visible Title QA Fix

on:
  push:
    branches: [migration/style-b-domain-work-v1]

permissions:
  contents: write

jobs:
  fix-human-cathay-visible-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/style-b-domain-work-v1
          fetch-depth: 0
      - name: Align Human route QA with visible title contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/style-b-domain-work-qa.yml')
          text=p.read_text()
          old="""  const cathayRoutes={\n    'cathay-mortgage-assistant':'From rigid scripts to flexible mortgage consultation',\n    'cathay-sit-review-remediation-operations':'From interface issues to prioritised remediation',\n    'cathay-sit-online-account-opening':'From fragmented steps to end-to-end account opening'\n  };"""
          new="""  const cathayRoutes={\n    'cathay-mortgage-assistant':'Rigid scripts to flexible mortgage consultation',\n    'cathay-sit-review-remediation-operations':'Interface issues to prioritised remediation',\n    'cathay-sit-online-account-opening':'Fragmented steps to end-to-end account opening'\n  };"""
          count=text.count(old)
          if count==0:
              if new in text:
                  print('Already aligned')
                  raise SystemExit(0)
              raise SystemExit('Human Cathay route expectation block not found')
          if count!=1:
              raise SystemExit(f'Expected one Human Cathay route block, got {count}')
          p.write_text(text.replace(old,new,1))
          PY
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/style-b-domain-work-qa.yml
          git commit -m "Align Human Cathay route QA with visible titles"
          git push origin HEAD:migration/style-b-domain-work-v1
