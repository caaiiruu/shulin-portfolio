name: Repair r146 bootstrap assertions

on:
  push:
    branches:
      - recovery/bootstrap-r146-exact-2026-08-06
    paths:
      - .github/workflows/repair-r146-bootstrap-assertions.yml

permissions:
  contents: write

concurrency:
  group: r146-bootstrap-assertion-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Repair false r146 source assertion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/bootstrap-r146-exact.yml')
          text = workflow.read_text('utf-8')

          before = "for(const s of ['related-project-card__company-v135','localize(project.company)','localize(project.domain_label)','2026-08-06-r146','adaptContent','canonicalProjectId','projectAliasRegistry']) assert.ok(app.includes(s),s);"
          after = "assert.equal(data.contentVersion,'2026-08-06-r146');\n          for(const s of ['related-project-card__company-v135','localize(project.company)','localize(project.domain_label)','adaptContent','canonicalProjectId','projectAliasRegistry']) assert.ok(app.includes(s),s);"

          if text.count(before) != 1:
              raise SystemExit(f'expected one false r146 app assertion, found {text.count(before)}')

          text = text.replace(before, after, 1)

          if text.count("assert.equal(data.contentVersion,'2026-08-06-r146');") < 2:
              raise SystemExit('canonical content-version assertions are incomplete')
          if "'2026-08-06-r146','adaptContent'" in text:
              raise SystemExit('false app.js ownership assertion remains')
          if "7dfbf56f5f61a3ba175d9568501c4586af4bc647e0dff0ae7fdbc60b16e60693" not in text:
              raise SystemExit('approved merged app.js hash missing')
          if "6b68abb20c7c0750126e9bf4f85ba71239be330474a9106c653d639fd3cbfbaa" not in text:
              raise SystemExit('approved merged home.js hash missing')
          if "localize(project?.domain_label)" not in text:
              raise SystemExit('home.js domain-label contract missing')

          workflow.write_text(text, 'utf-8')
          PY

          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = '.github/workflows/bootstrap-r146-exact.yml'

      - name: Commit repaired bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'r146 Recovery Bootstrap'
          git config user.email '63276875+caaiiruu@users.noreply.github.com'
          git add .github/workflows/bootstrap-r146-exact.yml
          git commit -m 'ci: verify r146 version from canonical content owner'
          git push origin HEAD:recovery/bootstrap-r146-exact-2026-08-06
