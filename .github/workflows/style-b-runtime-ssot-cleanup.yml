name: Style B Runtime SSOT Cleanup

on:
  push:
    branches:
      - integration/style-b-project-card-webp-v1
    paths:
      - '.github/workflows/style-b-runtime-ssot-cleanup.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/style-b-project-card-webp-v1
          fetch-depth: 0
      - name: Clean ProjectCard runtime SSOT
        run: node -e "const fs=require('fs');const p='public/site/content/portfolio-asset-manifest.json';const m=JSON.parse(fs.readFileSync(p,'utf8'));if(!fs.existsSync('public/site/assets/project-card-leads/daily-hours.jpg'))throw Error('Daily Hours JPG missing');m.projectCardLeadVisuals={schemaVersion:1,owner:'ProjectCard',dailyHours:{projectId:'daily-hours',publicPath:'/site/assets/project-card-leads/daily-hours.jpg',type:'image/jpeg',width:1600,height:900}};delete m.items['daily-hours-project-card-lead-v1'];fs.writeFileSync(p,JSON.stringify(m,null,2)+'\\n');"
      - name: Add canonical brand tints
        env:
          PROJECT_CARD_TINTS_B64: 
        run: node -e "const fs=require('fs');const p='public/site/assets/css/components/project-card.css';let s=fs.readFileSync(p,'utf8');const marker='/* ProjectCard brand-family surfaces — canonical listing owner. */';if(!s.includes(marker)){s+=Buffer.from(process.env.PROJECT_CARD_TINTS_B64,'base64').toString('utf8');fs.writeFileSync(p,s)}"
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/site/content/portfolio-asset-manifest.json public/site/assets/css/components/project-card.css
          git diff --check --cached
          git commit -m 'Clean ProjectCard runtime SSOT and centralize brand tints'
          git push origin HEAD:integration/style-b-project-card-webp-v1
