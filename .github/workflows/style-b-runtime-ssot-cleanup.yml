name: Style B Runtime SSOT Cleanup

on:
  push:
    branches:
      - integration/style-b-project-card-webp-v1
    paths:
      - '.github/workflows/style-b-runtime-ssot-cleanup.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/style-b-project-card-webp-v1
          fetch-depth: 0
      - name: Add remaining canonical brand tints
        env:
          EXTRA_TINTS_B64: 
        run: node -e "const fs=require('fs');const p='public/site/assets/css/components/project-card.css';let s=fs.readFileSync(p,'utf8');const marker='/* ProjectCard extended brand-family surfaces. */';if(!s.includes(marker)){s+=Buffer.from(process.env.EXTRA_TINTS_B64,'base64').toString('utf8');fs.writeFileSync(p,s)}"
      - name: Commit brand-family completion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/site/assets/css/components/project-card.css
          git diff --check --cached
          git commit -m 'Complete ProjectCard brand-family tints'
          git push origin HEAD:integration/style-b-project-card-webp-v1
