name: Sync original GPT Site parity

on:
  push:
    branches:
      - deploy/vercel-preview-2026-08-05
    paths:
      - .github/workflows/sync-original-gpt-site.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    env:
      ORIGINAL_ORIGIN: https://shulin-portfolio-v53.dr-piipii.chatgpt.site
      VERCEL_ORG_ID: team_nD9NNfDwlkTJJ2wtplVSaxHO
      VERCEL_PROJECT_ID: prj_XJxTzDxihUexNiSzUmFHNzXBBwUk
    steps:
      - name: Checkout deployment branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch exact original files
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          import hashlib
          import json
          import os

          origin = os.environ['ORIGINAL_ORIGIN'].rstrip('/')
          runner_temp = Path(os.environ['RUNNER_TEMP'])
          paths = [
              'site/index.html',
              'site/work.html',
              'site/experiments.html',
              'site/profile.html',
              'site/assets/validation/payment/validation-payment-video-order-details-r77.mov',
              'site/assets/js/production.c3e1b4d6a1eb213d.js',
              'site/assets/css/production.e6ab1a6b71ba8928.css',
              'site/content/portfolio-content.json',
              'site/content/portfolio-asset-manifest.json',
          ]
          mirror = runner_temp / 'parity-mirror'
          mirror.mkdir(exist_ok=True)
          manifest = {}
          for relative in paths:
              url = f'{origin}/{relative}'
              request = Request(url, headers={'User-Agent': 'Mozilla/5.0 PortfolioParitySync/1.0'})
              with urlopen(request, timeout=60) as response:
                  if int(getattr(response, 'status', 200)) != 200:
                      raise RuntimeError(f'Unexpected status for {url}: {response.status}')
                  body = response.read()
              destination = mirror / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(body)
              manifest[relative] = {
                  'bytes': len(body),
                  'sha256': hashlib.sha256(body).hexdigest(),
              }
          (runner_temp / 'parity-remote-manifest.json').write_text(
              json.dumps(manifest, indent=2), encoding='utf-8'
          )
          PY

      - name: Guard source-of-truth parity before overwrite
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os

          mirror = Path(os.environ['RUNNER_TEMP']) / 'parity-mirror'
          public = Path('public')

          identical_required = [
              'site/assets/js/production.c3e1b4d6a1eb213d.js',
              'site/assets/css/production.e6ab1a6b71ba8928.css',
              'site/content/portfolio-content.json',
              'site/content/portfolio-asset-manifest.json',
          ]

          def sha(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          for relative in identical_required:
              remote = mirror / relative
              local = public / relative
              assert local.exists(), f'Missing required local asset: {local}'
              assert sha(remote) == sha(local), f'Guard failed: canonical asset differs: {relative}'
              print('Canonical asset identical:', relative)

          payload = json.loads((mirror / 'site/content/portfolio-content.json').read_text())
          assert payload.get('contentVersion') == '2026-08-04-r119', payload.get('contentVersion')
          print('Remote contentVersion:', payload.get('contentVersion'))

          for name in ('index.html', 'work.html', 'experiments.html', 'profile.html'):
              text = (mirror / 'site' / name).read_text(encoding='utf-8')
              assert '/site/assets/js/production.c3e1b4d6a1eb213d.js' in text, name
              assert '/site/assets/css/production.e6ab1a6b71ba8928.css' in text, name
              assert '/site/assets/js/app.js' not in text, name
              print('Original full runtime confirmed:', name)

          video = mirror / 'site/assets/validation/payment/validation-payment-video-order-details-r77.mov'
          assert video.stat().st_size > 3_000_000
          print('Original validation video bytes:', video.stat().st_size)
          PY

      - name: Restore exact original runtime shell and missing media
        run: |
          set -euo pipefail
          for name in index.html work.html experiments.html profile.html; do
            cp "$RUNNER_TEMP/parity-mirror/site/$name" "public/site/$name"
          done
          mkdir -p public/site/assets/validation/payment
          cp "$RUNNER_TEMP/parity-mirror/site/assets/validation/payment/validation-payment-video-order-details-r77.mov" \
             public/site/assets/validation/payment/validation-payment-video-order-details-r77.mov

      - name: Verify only approved parity paths changed
        run: |
          set -euo pipefail
          git status --short
          python - <<'PY'
          import subprocess

          allowed = {
              'public/site/index.html',
              'public/site/work.html',
              'public/site/experiments.html',
              'public/site/profile.html',
              'public/site/assets/validation/payment/validation-payment-video-order-details-r77.mov',
          }
          output = subprocess.check_output(['git', 'status', '--porcelain'], text=True)
          changed = set()
          for line in output.splitlines():
              if not line.strip():
                  continue
              changed.add(line[3:])
          unexpected = changed - allowed
          missing = allowed - changed
          assert not unexpected, f'Unexpected changed paths: {sorted(unexpected)}'
          assert not missing, f'Expected parity changes not present: {sorted(missing)}'
          print('Approved parity paths:', sorted(changed))
          PY

      - name: Commit exact parity restoration
        run: |
          set -euo pipefail
          git config user.name "caiiru"
          git config user.email "63276875+caaiiruu@users.noreply.github.com"
          git add \
            public/site/index.html \
            public/site/work.html \
            public/site/experiments.html \
            public/site/profile.html \
            public/site/assets/validation/payment/validation-payment-video-order-details-r77.mov
          git commit -m "Restore exact original GPT Site runtime parity"
          git push origin HEAD:deploy/vercel-preview-2026-08-05

      - name: Install Vercel CLI
        run: npm install --global vercel@58.5.1

      - name: Link Vercel project
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Deploy restored site to production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          PRODUCTION_URL=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN")
          printf '%s\n' "$PRODUCTION_URL" | tee production-url.txt
          echo "url=$PRODUCTION_URL" >> "$GITHUB_OUTPUT"

      - name: Verify production deployment and exact public parity
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PRODUCTION_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          HOSTNAME=${PRODUCTION_URL#https://}
          HTTP_STATUS=$(curl --silent --show-error \
            --output deployment.json \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$HOSTNAME?teamId=$VERCEL_ORG_ID")
          test "$HTTP_STATUS" = "200"
          python - <<'PY'
          import json
          payload = json.load(open('deployment.json'))
          state = payload.get('readyState') or payload.get('state')
          assert state == 'READY', state
          assert payload.get('target') == 'production', payload.get('target')
          print('Production deployment READY:', payload.get('url'))
          PY

          verify_html() {
            url="$1"
            expected_title="$2"
            output="$3"
            for attempt in 1 2 3 4 5 6; do
              status=$(curl --silent --show-error --location \
                --output "$output" --write-out '%{http_code}' \
                -H 'Cache-Control: no-cache' "$url")
              if [ "$status" = "200" ] && \
                 grep -Fq '/site/assets/js/production.c3e1b4d6a1eb213d.js' "$output" && \
                 grep -Fq "$expected_title" "$output"; then
                echo "Verified full production runtime: $url"
                return 0
              fi
              echo "Waiting for alias propagation: $url (status $status, attempt $attempt)"
              sleep 10
            done
            echo "::error::Public parity verification failed: $url"
            return 1
          }

          verify_html 'https://shulinchou.com/site' 'Shulin Chou' /tmp/site.html
          verify_html 'https://shulinchou.com/site/work' 'Work — Shulin Chou' /tmp/work.html
          verify_html 'https://shulinchou.com/site/work/voucher-center' 'Work — Shulin Chou' /tmp/voucher.html
          verify_html 'https://shulinchou.com/site/profile' 'Profile — Shulin Chou' /tmp/profile.html

          curl --silent --show-error --fail \
            https://shulinchou.com/site/content/portfolio-content.json \
            -o /tmp/content.json
          python - <<'PY'
          import json
          payload = json.load(open('/tmp/content.json'))
          assert payload.get('contentVersion') == '2026-08-04-r119'
          print('Production contentVersion:', payload.get('contentVersion'))
          PY

          remote_video_bytes=$(curl --silent --show-error --location \
            https://shulinchou.com/site/assets/validation/payment/validation-payment-video-order-details-r77.mov \
            | wc -c | tr -d ' ')
          test "$remote_video_bytes" -gt 3000000
          echo "Production validation video bytes: $remote_video_bytes"

      - name: Prepare parity evidence
        run: |
          mkdir -p parity-evidence
          cp "$RUNNER_TEMP/parity-remote-manifest.json" parity-evidence/parity-remote-manifest.json
          cp production-url.txt deployment.json parity-evidence/

      - name: Upload parity evidence
        uses: actions/upload-artifact@v4
        with:
          name: original-gpt-site-parity-release
          path: parity-evidence
          retention-days: 2
