name: Style B Finalize ProjectCard WebP

on:
  push:
    branches:
      - integration/style-b-project-card-webp-v1
    paths:
      - '.github/workflows/style-b-materialize-webp.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/style-b-project-card-webp-v1
          fetch-depth: 0
      - name: Install image derivative dependency
        run: python3 -m pip install --quiet Pillow
      - name: Finalize responsive WebP and full-bleed shared ProjectCard contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re

          # 1) Ensure responsive standalone WebP derivatives exist from canonical masters.
          sources = {
              'payment': Path('public/site/assets/projects/payment/payment-lead-visual-app-and-sco-checkout-public-v1.jpg'),
              'voucher': Path('public/site/assets/projects/voucher/voucher-lead-visual-incentive-ecosystem-public-v1.jpg'),
              'voucher-center': Path('public/site/assets/projects/voucher-center/voucher-center-lead-visual-claim-journey-public-v1.jpg'),
              'game-center': Path('public/site/assets/projects/game-center/game-center-lead-visual-multi-game-discovery-public-v1.jpg'),
              'dbs': Path('public/site/assets/projects/dbs/dbs-lead-visual-exception-and-risk-workbench-public-v1.jpg'),
              'booking': Path('public/site/assets/projects/booking/booking-connected-trip-lead-visual-timeline-experience-public-v1.jpg'),
              'cathay-mortgage-assistant': Path('public/site/assets/projects/cathay-mortgage-assistant/cathay-mortgage-assistant-lead-visual-consultation-system-public-v1.jpg'),
              'cathay-sit-online-account-opening': Path('public/site/assets/projects/cathay-sit-online-account-opening/cathay-online-account-opening-lead-visual-end-to-end-flow-public-v1.jpg'),
              'cathay-sit-review-remediation-operations': Path('public/site/assets/projects/cathay-sit-review-remediation-operations/cathay-review-remediation-lead-visual-remediation-operating-model-public-v1.jpg'),
              'ctbc-mortgage-self-service-app': Path('public/site/assets/projects/ctbc-mortgage-self-service-app/ctbc-mortgage-self-service-lead-visual-service-architecture-public-v1.jpg'),
              'daily-hours': Path('public/site/assets/projects/daily-hours/daily-hours-hero-static.png'),
          }
          out = Path('public/site/assets/style-b/lead-visuals-webp')
          out.mkdir(parents=True, exist_ok=True)

          def crop_16_9(image):
              width, height = image.size
              target = 16 / 9
              ratio = width / height
              if abs(ratio - target) < 1e-6:
                  return image
              if ratio > target:
                  crop_width = round(height * target)
                  left = (width - crop_width) // 2
                  return image.crop((left, 0, left + crop_width, height))
              crop_height = round(width / target)
              top = (height - crop_height) // 2
              return image.crop((0, top, width, top + crop_height))

          for project_id, source in sources.items():
              if not source.exists():
                  raise SystemExit(f'Missing canonical Lead Visual master: {source}')
              with Image.open(source) as raw:
                  image = crop_16_9(raw.convert('RGB'))
                  for width in (800, 1200, 1600):
                      height = width * 9 // 16
                      target = out / f'{project_id}-{width}.webp'
                      if target.exists():
                          continue
                      image.resize((width, height), Image.Resampling.LANCZOS).save(target, 'WEBP', quality=90, method=6)

          # 2) Work: one shared LeadVisual resolver, responsive srcset, no background-image substitution.
          work_path = Path('public/site/assets/js/work.js')
          work = work_path.read_text()
          first_text = "  const firstText = (...values) => values.map(scalarText).find(Boolean) || '';\n"
          if 'const PROJECT_CARD_LEAD_VISUALS' not in work:
              contract = '''
  const PROJECT_CARD_LEAD_VISUALS = Object.freeze(Object.fromEntries([
    'payment','voucher','voucher-center','game-center','dbs','booking','cathay-mortgage-assistant','cathay-sit-online-account-opening','cathay-sit-review-remediation-operations','ctbc-mortgage-self-service-app','daily-hours'
  ].map(id => [id, Object.freeze({
    src800:`/site/assets/style-b/lead-visuals-webp/${id}-800.webp`,
    src1200:`/site/assets/style-b/lead-visuals-webp/${id}-1200.webp`,
    src1600:`/site/assets/style-b/lead-visuals-webp/${id}-1600.webp`,
    width:1600,
    height:900
  })])));
  window.PROJECT_CARD_SYSTEM = Object.freeze({
    version:'shared-v1',
    variants:Object.freeze(['featured','standard','compact']),
    leadVisuals:PROJECT_CARD_LEAD_VISUALS
  });
  const applyProjectCardLeadVisual = (card,id,variant) => {
    const visual = PROJECT_CARD_LEAD_VISUALS[id];
    const img = card?.querySelector('.work-card-v32__image-v225');
    if (!visual || !img) return;
    img.src = visual.src1600;
    img.srcset = `${visual.src800} 800w, ${visual.src1200} 1200w, ${visual.src1600} 1600w`;
    img.sizes = variant === 'featured'
      ? '(max-width: 1100px) 100vw, 58vw'
      : variant === 'standard'
        ? '(max-width: 1100px) 100vw, 50vw'
        : '(max-width: 640px) 100vw, 33vw';
    img.width = visual.width;
    img.height = visual.height;
    img.loading = variant === 'featured' ? 'eager' : 'lazy';
    img.decoding = 'async';
    img.fetchPriority = variant === 'featured' ? 'high' : 'auto';
    img.removeAttribute('style');
    card.dataset.projectCardLeadVisual = 'responsive-webp';
  };
'''
              if first_text not in work:
                  raise SystemExit('work.js firstText anchor missing')
              work = work.replace(first_text, first_text + contract, 1)
          decorate_anchor = "    card.classList.remove('work-card-v32--featured','work-card-v32--compact');\n"
          if 'applyProjectCardLeadVisual(card,id,variant);' not in work:
              if decorate_anchor not in work:
                  raise SystemExit('work.js decorate anchor missing')
              work = work.replace(decorate_anchor, decorate_anchor + "    applyProjectCardLeadVisual(card,id,variant);\n", 1)
          work_path.write_text(work)

          # 3) Domain: consume the exact same LeadVisual map.
          domain_path = Path('public/site/assets/js/domain-experience.js')
          domain = domain_path.read_text()
          domain_first = "  const firstText = (...values) => values.map(scalarText).find(Boolean) || '';\n"
          if 'const projectCardLeadVisualFor' not in domain:
              if domain_first not in domain:
                  raise SystemExit('domain firstText anchor missing')
              domain = domain.replace(domain_first, domain_first + "  const projectCardLeadVisualFor = key => window.PROJECT_CARD_SYSTEM?.leadVisuals?.[key] || null;\n", 1)
          replacement = '''  const buildVisual = (project,key,projection) => {
    const visual = document.createElement('div');
    visual.className = 'domain-project-card-v2__visual';
    const responsive = projectCardLeadVisualFor(key);
    if (responsive) {
      const img = document.createElement('img');
      img.className = 'domain-project-card-v2__image';
      img.src = responsive.src1600;
      img.srcset = `${responsive.src800} 800w, ${responsive.src1200} 1200w, ${responsive.src1600} 1600w`;
      img.sizes = '(max-width: 900px) 84vw, 48vw';
      img.width = responsive.width;
      img.height = responsive.height;
      img.alt = titleFor(project,projection,key);
      img.loading = 'lazy';
      img.decoding = 'async';
      img.draggable = false;
      visual.dataset.projectCardLeadVisual = 'responsive-webp';
      visual.append(img);
      return visual;
    }
    const assetId = projection?.coverAssetId || project?.coverAssetId || project?.hero_visual_brief?.assetId || project?.heroVisualBrief?.assetId;
    const caseAsset = project?.presentationContract !== 'legacy' ? window.CASE_STUDY_ASSETS?.[key]?.assets?.[assetId] : null;
    const asset = caseAsset ? {src:caseAsset.publicPath,alt:caseAsset.alt,width:caseAsset.width,height:caseAsset.height} : (assetId ? window.resolveProjectAsset?.(assetId,key) : null);
    if (asset?.src) {
      const img = document.createElement('img');
      img.className = 'domain-project-card-v2__image';
      img.src = asset.src;img.alt = scalarText(asset.alt);img.loading='lazy';img.decoding='async';img.draggable=false;
      if (asset.width && asset.height) {img.width=asset.width;img.height=asset.height}
      visual.append(img);
    } else {
      const fallback=document.createElement('span');fallback.className='domain-project-card-v2__visual-fallback';fallback.textContent=companyFor(project,projection);visual.append(fallback);
    }
    return visual;
  };

  const buildCard'''
          domain, count = re.subn(r"  const buildVisual = \(project,key,projection\) => \{.*?\n  \};\n\n  const buildCard", replacement, domain, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'domain buildVisual replacement count {count}')
          domain_path.write_text(domain)

          # 4) Shared CSS: full-bleed cover media for all three variants and Domain.
          css_path = Path('public/site/assets/css/components/project-card-system.css')
          css = css_path.read_text()
          css = css.replace('background-position:center;background-repeat:no-repeat;background-size:contain', 'background-position:center;background-repeat:no-repeat;background-size:cover')
          css = css.replace('object-fit:contain;object-position:center', 'object-fit:cover;object-position:center')
          marker_start = '/* Canonical lead-visual projection. One media source is reused by Work and Domain. */'
          marker_end = '@media(max-width:1100px){'
          start = css.find(marker_start)
          end = css.find(marker_end, start if start >= 0 else 0)
          if start < 0 or end < 0:
              raise SystemExit('project-card-system media markers missing')
          full_bleed = '''/* Full-bleed LeadVisual contract. Media is a responsive <img>, never a CSS background substitution. */
.work-card-v32[data-project-card-system="shared-v1"] .work-artifact{padding:0!important;background-image:none!important}
.work-card-v32[data-project-card-system="shared-v1"] .work-card-v32__image-v225{display:block;width:100%;height:100%;object-fit:cover;object-position:center}
.domain-project-card-v2[data-project-card-system="shared-v1"] .domain-project-card-v2__visual{padding:0!important;overflow:hidden;background-image:none!important}
.domain-project-card-v2[data-project-card-system="shared-v1"] .domain-project-card-v2__image{display:block;width:100%;height:100%;object-fit:cover;object-position:center}

'''
          css = css[:start] + full_bleed + css[end:]
          css_path.write_text(css)

          # 5) Expand existing exact integration gate to this isolated child lane and verify the new media contract.
          qa_path = Path('.github/workflows/style-b-prod-integration-qa.yml')
          qa = qa_path.read_text()
          qa = qa.replace('branches: [integration/style-b-domain-work-prod-7b6c4f]', 'branches: [integration/style-b-domain-work-prod-7b6c4f, integration/style-b-project-card-webp-v1]')
          all_cards = "              const allCards=work.locator('.work-card-v32[data-project-card-variant]');\n"
          if 'ProjectCard variant drift' not in qa:
              extra = '''              const variants=await allCards.evaluateAll(cards=>cards.map(card=>card.dataset.projectCardVariant));
              assert(variants.every(value=>['featured','standard','compact'].includes(value)),`Work ${width}: ProjectCard variant drift ${JSON.stringify(variants)}`);
              assert(await allCards.evaluateAll(cards=>cards.every(card=>card.dataset.projectCardSystem==='shared-v1')),`Work ${width}: shared ProjectCard system missing`);
              const dailyMeta=await dh.locator('.project-card__meta').innerText();
              assert(/0→1 PRODUCT/i.test(dailyMeta)&&/SHULIN STUDIO/i.test(dailyMeta)&&/2026/.test(dailyMeta),`Work ${width}: Daily Hours metadata ${dailyMeta}`);
              const mappedMedia=work.locator('.work-card-v32[data-project-card-lead-visual="responsive-webp"] .work-card-v32__image-v225');
              assert(await mappedMedia.count()>=6,`Work ${width}: responsive WebP projection missing`);
              for(let i=0;i<await mappedMedia.count();i++){
                const img=mappedMedia.nth(i);
                const src=await img.getAttribute('src');
                const srcset=await img.getAttribute('srcset');
                assert(/lead-visuals-webp\/.*-1600\.webp$/.test(src||''),`Work ${width}: non-WebP lead visual ${src}`);
                assert(/800w/.test(srcset||'')&&/1200w/.test(srcset||'')&&/1600w/.test(srcset||''),`Work ${width}: responsive srcset missing ${srcset}`);
                assert(await img.evaluate(el=>getComputedStyle(el).objectFit)==='cover',`Work ${width}: lead visual is not full bleed`);
              }
'''
              if all_cards not in qa:
                  raise SystemExit('QA allCards anchor missing')
              qa = qa.replace(all_cards, all_cards + extra, 1)
          hierarchy = "                assert(a&&b&&a.width>b.width*1.6,`Work 1419: hierarchy ${a?.width}/${b?.width}`);\n"
          if 'same-row standard card heights' not in qa:
              extra_geom = '''                const standardRow=work.locator('.work-index__featured-secondary-row > .work-card-v32');
                if(await standardRow.count()===2){
                  const boxes=await Promise.all([standardRow.nth(0).boundingBox(),standardRow.nth(1).boundingBox()]);
                  assert(boxes[0]&&boxes[1]&&Math.abs(boxes[0].height-boxes[1].height)<=2,`Work 1419: same-row standard card heights ${boxes[0]?.height}/${boxes[1]?.height}`);
                  const mediaBoxes=await Promise.all([standardRow.nth(0).locator('.work-artifact').boundingBox(),standardRow.nth(1).locator('.work-artifact').boundingBox()]);
                  assert(mediaBoxes[0]&&mediaBoxes[1]&&Math.abs(mediaBoxes[0].height-mediaBoxes[1].height)<=2,`Work 1419: same-row media heights ${mediaBoxes[0]?.height}/${mediaBoxes[1]?.height}`);
                }
                const firstArrow=allCards.first().locator('.work-card-v32__action .icon-arrow--right');
                const before=await firstArrow.boundingBox();
                await allCards.first().locator('.work-card-v32__button').hover();
                await page.waitForTimeout(180);
                const after=await firstArrow.boundingBox();
                assert(before&&after&&after.x>before.x&&Math.abs(after.y-before.y)<=1,`Work 1419: hover arrow motion ${JSON.stringify({before,after})}`);
'''
              if hierarchy not in qa:
                  raise SystemExit('QA hierarchy anchor missing')
              qa = qa.replace(hierarchy, hierarchy + extra_geom, 1)
          qa_path.write_text(qa)
          PY
          rm -f .github/workflows/style-b-materialize-webp.yml .github/workflows/style-b-project-card-webp-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/site/assets/style-b/lead-visuals-webp public/site/assets/js/work.js public/site/assets/js/domain-experience.js public/site/assets/css/components/project-card-system.css .github/workflows/style-b-prod-integration-qa.yml .github/workflows/style-b-materialize-webp.yml .github/workflows/style-b-project-card-webp-apply.yml
          git diff --check --cached
          git commit -m 'Serve full-bleed responsive WebP ProjectCard media'
          git push origin HEAD:integration/style-b-project-card-webp-v1
