name: Style B Materialize Lead WebP

on:
  push:
    branches:
      - integration/style-b-project-card-webp-v1
    paths:
      - '.github/workflows/style-b-materialize-webp.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/style-b-project-card-webp-v1
          fetch-depth: 0
      - name: Install image derivative dependency
        run: python3 -m pip install --quiet Pillow
      - name: Build cacheable responsive WebP derivatives from canonical masters
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          sources = {
              'payment': Path('public/site/assets/projects/payment/payment-lead-visual-app-and-sco-checkout-public-v1.jpg'),
              'voucher': Path('public/site/assets/projects/voucher/voucher-lead-visual-incentive-ecosystem-public-v1.jpg'),
              'voucher-center': Path('public/site/assets/projects/voucher-center/voucher-center-lead-visual-claim-journey-public-v1.jpg'),
              'game-center': Path('public/site/assets/projects/game-center/game-center-lead-visual-multi-game-discovery-public-v1.jpg'),
              'dbs': Path('public/site/assets/projects/dbs/dbs-lead-visual-exception-and-risk-workbench-public-v1.jpg'),
              'booking': Path('public/site/assets/projects/booking/booking-connected-trip-lead-visual-timeline-experience-public-v1.jpg'),
              'cathay-mortgage-assistant': Path('public/site/assets/projects/cathay-mortgage-assistant/cathay-mortgage-assistant-lead-visual-consultation-system-public-v1.jpg'),
              'cathay-sit-online-account-opening': Path('public/site/assets/projects/cathay-sit-online-account-opening/cathay-online-account-opening-lead-visual-end-to-end-flow-public-v1.jpg'),
              'cathay-sit-review-remediation-operations': Path('public/site/assets/projects/cathay-sit-review-remediation-operations/cathay-review-remediation-lead-visual-remediation-operating-model-public-v1.jpg'),
              'ctbc-mortgage-self-service-app': Path('public/site/assets/projects/ctbc-mortgage-self-service-app/ctbc-mortgage-self-service-lead-visual-service-architecture-public-v1.jpg'),
              'daily-hours': Path('public/site/assets/projects/daily-hours/daily-hours-hero-static.png'),
          }
          out = Path('public/site/assets/style-b/lead-visuals-webp')
          out.mkdir(parents=True, exist_ok=True)

          def crop_16_9(image: Image.Image) -> Image.Image:
              width, height = image.size
              target = 16 / 9
              ratio = width / height
              if abs(ratio - target) < 1e-6:
                  return image
              if ratio > target:
                  crop_width = round(height * target)
                  left = (width - crop_width) // 2
                  return image.crop((left, 0, left + crop_width, height))
              crop_height = round(width / target)
              top = (height - crop_height) // 2
              return image.crop((0, top, width, top + crop_height))

          for project_id, source in sources.items():
              if not source.exists():
                  raise SystemExit(f'Missing canonical Lead Visual master: {source}')
              with Image.open(source) as raw:
                  image = crop_16_9(raw.convert('RGB'))
                  for width in (800, 1600):
                      height = width * 9 // 16
                      derivative = image.resize((width, height), Image.Resampling.LANCZOS)
                      target = out / f'{project_id}-{width}.webp'
                      derivative.save(target, 'WEBP', quality=90, method=6)
                      print(f'{project_id}: {target.name} {target.stat().st_size} bytes')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/site/assets/style-b/lead-visuals-webp
          git diff --cached --quiet && exit 0
          git commit -m 'Materialize responsive ProjectCard WebP lead visuals'
          git push origin HEAD:integration/style-b-project-card-webp-v1
