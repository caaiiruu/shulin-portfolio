name: Style B Materialize Lead WebP

on:
  push:
    branches:
      - integration/style-b-project-card-webp-v1
    paths:
      - '.github/workflows/style-b-materialize-webp.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/style-b-project-card-webp-v1
          fetch-depth: 0
      - name: Decode embedded WebP payloads into standalone cacheable assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import xml.etree.ElementTree as ET
          from pathlib import Path

          sources = {
              'payment': Path('public/site/assets/style-b/lead-visuals/payment.svg'),
              'voucher': Path('public/site/assets/style-b/lead-visuals/voucher.svg'),
              'game-center': Path('public/site/assets/style-b/lead-visuals/game-center.svg'),
              'dbs': Path('public/site/assets/style-b/lead-visuals/dbs.svg'),
              'booking': Path('public/site/assets/style-b/lead-visuals/booking.svg'),
              'cathay-mortgage-assistant': Path('public/site/assets/style-b/lead-visuals/cathay-mortgage-assistant.svg'),
              'cathay-sit-online-account-opening': Path('public/site/assets/style-b/lead-visuals/cathay-sit-online-account-opening.svg'),
              'daily-hours': Path('public/site/assets/style-b/daily-hours-lead-visual.svg'),
          }
          out = Path('public/site/assets/style-b/lead-visuals-webp')
          out.mkdir(parents=True, exist_ok=True)
          for project_id, source in sources.items():
              if not source.exists():
                  raise SystemExit(f'Missing lead visual source: {source}')
              root = ET.parse(source).getroot()
              image = next((node for node in root.iter() if node.tag.endswith('image')), None)
              if image is None:
                  raise SystemExit(f'No image node in {source}')
              href = image.attrib.get('href') or image.attrib.get('{http://www.w3.org/1999/xlink}href') or ''
              prefix = 'data:image/webp;base64,'
              if not href.startswith(prefix):
                  raise SystemExit(f'No WebP data URI in {source}')
              encoded = ''.join(href[len(prefix):].split())
              payload = base64.b64decode(encoded, validate=True)
              if payload[:4] != b'RIFF' or payload[8:12] != b'WEBP':
                  raise SystemExit(f'Invalid WebP payload in {source}')
              target = out / f'{project_id}.webp'
              target.write_bytes(payload)
              print(f'{project_id}: {len(payload)} bytes -> {target}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/site/assets/style-b/lead-visuals-webp
          git diff --cached --quiet && exit 0
          git commit -m 'Materialize cacheable ProjectCard WebP lead visuals'
          git push origin HEAD:integration/style-b-project-card-webp-v1
