name: Temp Domain Tab5 CTA Geometry
on:
  push:
    branches: [migration/style-b-domain-work-v1]
    paths: ['.github/workflows/tmp-domain-tab5-cta-geometry.yml']
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm run install:ci
          npm run build
      - working-directory: public/site/qa
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - run: |
          PORT=4173 node tests/portfolio-static-server.mjs >/tmp/server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/site/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/server.log; exit 1
      - working-directory: public/site/qa
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1419,height:1100}});
          await page.goto('http://127.0.0.1:4173/site/index.html',{waitUntil:'networkidle'});
          const domain=page.locator('#domains');
          await domain.scrollIntoViewIfNeeded();
          await page.waitForFunction(()=>document.querySelector('#domains')?.dataset.domainGoldenReferenceMounted==='true');
          const tabs=domain.locator('.domain-tab');
          for(let i=0;i<=4;i++){
            await tabs.nth(i).click();
            await page.waitForFunction(index=>document.querySelectorAll('#domains .domain-tab')[index]?.getAttribute('aria-selected')==='true',i);
            await page.waitForFunction(()=>document.querySelectorAll('#domains .domain-project-card-v2[data-wheel-offset="0"]').length===1);
            await page.waitForTimeout(60);
          }
          const sample=async label=>{
            const data=await domain.locator('.domain-project-card-v2[data-wheel-offset="0"]').evaluate(node=>{
              const q=s=>node.querySelector(s); const r=e=>{if(!e)return null;const b=e.getBoundingClientRect();return{x:b.x,y:b.y,width:b.width,height:b.height,right:b.right,bottom:b.bottom}};
              const c=q('.domain-project-card-v2__content'),cta=q('.domain-project-card-v2__cta'),m=q('.domain-project-card-v2__metrics'),t=q('.domain-project-card-v2__title');
              const cs=getComputedStyle(node),cc=getComputedStyle(c),ct=getComputedStyle(cta);
              return {project:node.dataset.project,card:r(node),content:r(c),title:r(t),metrics:r(m),cta:r(cta),cardTransform:cs.transform,hover:node.matches(':hover'),contentGrid:cc.gridTemplateRows,contentHeight:cc.height,contentPadding:cc.padding,ctaWidth:ct.width,ctaMargin:ct.margin,ctaPadding:ct.padding};
            });
            console.log(label+' '+JSON.stringify(data));
          };
          await sample('T60');
          await page.evaluate(()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)))); await sample('RAF2');
          await page.waitForTimeout(350); await sample('T410');
          await page.mouse.move(1,1); await page.waitForTimeout(60); await sample('NEUTRAL');
          await browser.close();
          NODE
