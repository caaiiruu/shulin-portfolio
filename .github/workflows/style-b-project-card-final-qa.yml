name: Style B ProjectCard Final QA
# Exact-head certification for the unified ProjectCard owner.

on:
  push:
    branches:
      - integration/style-b-project-card-webp-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify ancestry and frozen Daily Hours owners
        run: |
          set -euo pipefail
          BASE=7b6c4f47b6f1bba1e4d4048649305f22999b2976
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --check "$BASE"...HEAD
          git diff --name-only "$BASE"...HEAD | tee /tmp/changed.txt
          ! grep -Fxq 'public/site/assets/css/components/case-study-v2.css' /tmp/changed.txt
          ! grep -Fxq 'public/site/assets/js/case-study-v2.js' /tmp/changed.txt
          ! grep -E '^public/site/content/case-studies/daily-hours/' /tmp/changed.txt
          ! grep -E '^public/site/assets/projects/daily-hours/' /tmp/changed.txt
          ! grep -Fxq 'scripts/generate-project-pages.mjs' /tmp/changed.txt
          ! grep -Fxq 'scripts/build-production-assets.mjs' /tmp/changed.txt

      - name: Verify canonical ProjectCard owners and JPG media
        run: |
          node <<'NODE'
          const fs=require('fs');
          const content=JSON.parse(fs.readFileSync('public/site/content/portfolio-content.json','utf8'));
          const assets=JSON.parse(fs.readFileSync('public/site/content/portfolio-asset-manifest.json','utf8'));
          const ds=JSON.parse(fs.readFileSync('public/site/docs/design-system/registry.json','utf8'));
          const projects=content.projects||{};
          const entries=Object.entries(projects);
          if(entries.length!==13) throw new Error(`legacy project count ${entries.length}`);
          if(projects['daily-hours']) throw new Error('Daily Hours entered legacy projects');
          if(content.publicLocaleMode!=='EN_ONLY_TEMPORARY') throw new Error('public locale mode drift');
          if(fs.existsSync('public/site/assets/css/components/project-card-system.css')) throw new Error('parallel ProjectCard CSS owner exists');
          if(fs.existsSync('public/site/content/project-card-registry.json')) throw new Error('parallel ProjectCard content registry exists');
          if(fs.existsSync('public/site/assets/style-b/lead-visuals-webp')) throw new Error('retired WebP delivery directory exists');
          if(fs.existsSync('public/site/assets/style-b/lead-visuals')) throw new Error('retired SVG lead directory exists');
          const pc=ds.governanceGraph?.componentContracts?.ProjectCard;
          if(pc?.cssOwner!=='assets/css/components/project-card.css') throw new Error('ProjectCard CSS owner drift');
          if(pc?.assetRegistry!=='content/portfolio-asset-manifest.json#projectCardLeadVisuals') throw new Error('ProjectCard asset registry drift');
          const heroAssetId=(project)=>project?.publicContent?.imagePlan?.find?.(x=>x?.role==='hero'&&x?.assetId)?.assetId||project?.heroVisualBrief?.assetId||'';
          for(const [id,project] of entries){
            const assetId=heroAssetId(project); if(!assetId) throw new Error(`${id}: hero asset ID missing`);
            const item=assets.items?.[assetId]; if(!item) throw new Error(`${id}: manifest item ${assetId} missing`);
            if(item.type!=='image/jpeg') throw new Error(`${id}: Lead Visual is not JPG`);
            if(item.assetStatus!=='production'||item.implementationStatus!=='real-active'||item.replacementRequired!==false) throw new Error(`${id}: Lead Visual not production-approved`);
            if(Number(item.width)<1600||Number(item.height)<900) throw new Error(`${id}: Lead Visual resolution too low ${item.width}x${item.height}`);
            const file='public'+item.publicPath.replace(/^\/site/,'/site'); if(!fs.existsSync(file)) throw new Error(`${id}: file missing ${file}`);
          }
          const daily=assets.projectCardLeadVisuals?.dailyHours;
          if(!daily||daily.type!=='image/jpeg'||daily.width!==1600||daily.height!==900) throw new Error('Daily Hours listing JPG projection invalid');
          if(!fs.existsSync('public'+daily.publicPath.replace(/^\/site/,'/site'))) throw new Error('Daily Hours listing JPG missing');
          const work=fs.readFileSync('public/site/assets/js/work.js','utf8');
          const domain=fs.readFileSync('public/site/assets/js/domain-experience.js','utf8');
          const media=fs.readFileSync('public/site/assets/js/project-card-media.js','utf8');
          for(const source of [work,domain]) if(/tintPalette|tintForProject|tintFor\s*=/.test(source)) throw new Error('page-owned brand tint remains');
          if(/lead-visuals-webp|style-b\/lead-visuals\//.test(media)) throw new Error('retired Lead Visual runtime path remains');
          if(!media.includes("publicContent?.imagePlan")||!media.includes("projectCardLeadVisuals?.dailyHours")) throw new Error('runtime does not resolve canonical SSOT owners');
          NODE

      - name: Install build and regression suite
        run: |
          npm run install:ci
          npm run build
          npm test

      - name: Install browser QA dependencies
        working-directory: public/site/qa
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start static QA server
        run: |
          PORT=4173 node tests/portfolio-static-server.mjs >/tmp/project-card-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/site/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/project-card-server.log
          exit 1

      - name: Run exact visual interaction and navigation certification
        working-directory: public/site/qa
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          import fs from 'node:fs';
          import path from 'node:path';
          const browser=await chromium.launch({headless:true});
          const base='http://127.0.0.1:4173';
          const widths=[1419,871,430];
          const out=path.join(process.env.GITHUB_WORKSPACE,'artifacts/project-card-final');
          fs.mkdirSync(out,{recursive:true});
          const content=JSON.parse(fs.readFileSync(path.join(process.env.GITHUB_WORKSPACE,'public/site/content/portfolio-content.json'),'utf8'));
          const assets=JSON.parse(fs.readFileSync(path.join(process.env.GITHUB_WORKSPACE,'public/site/content/portfolio-asset-manifest.json'),'utf8'));
          const heroAssetId=(project)=>project?.publicContent?.imagePlan?.find?.(x=>x?.role==='hero'&&x?.assetId)?.assetId||project?.heroVisualBrief?.assetId||'';
          const expectedVisual=(id)=>{
            if(id==='daily-hours') return assets.projectCardLeadVisuals?.dailyHours?.publicPath||'';
            const assetId=heroAssetId(content.projects?.[id]);
            return assets.items?.[assetId]?.publicPath||'';
          };
          const brandTint=(id)=>{
            if(['payment','voucher','voucher-center','game-center'].includes(id)) return 'rgb(230 239 255)';
            if(id==='dbs'||id==='taishin-p2p-marketplace') return 'rgb(252 232 234)';
            if(id==='booking'||id==='booking-taxi-strategy') return 'rgb(232 242 255)';
            if(['cathay-mortgage-assistant','cathay-sit-online-account-opening','cathay-sit-review-remediation-operations'].includes(id)) return 'rgb(228 244 239)';
            if(id==='ctbc-mortgage-self-service-app') return 'rgb(226 242 238)';
            if(id==='bandzo') return 'rgb(237 235 250)';
            if(id==='daily-hours') return 'rgb(230 237 245)';
            return '';
          };
          const assert=(value,message)=>{if(!value)throw new Error(message)};
          const normalizePath=value=>new URL(value,'http://local').pathname.replace(/\.html$/,'').replace(/^\/site/,'')||'/';
          const report={};
          try{
            for(const width of widths){
              const context=await browser.newContext({viewport:{width,height:1100},hasTouch:width===430,isMobile:width===430});
              const page=await context.newPage();
              const errors=[];
              page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
              page.on('pageerror',e=>errors.push(e.message));
              for(const route of ['/site/index.html','/site/work.html','/site/work/daily-hours.html','/site/profile.html']){
                const response=await page.goto(base+route,{waitUntil:'networkidle'});
                assert(response?.ok(),`${route} ${width}: HTTP ${response?.status()}`);
                assert(await page.locator('.site-header').count()===1,`${route} ${width}: header count`);
                assert(await page.locator('.site-footer').count()===1,`${route} ${width}: footer count`);
                assert(await page.locator('[data-lang-toggle]').count()===0,`${route} ${width}: locale control leaked`);
                assert(await page.evaluate(()=>document.documentElement.lang)==='en',`${route} ${width}: not EN`);
                assert(await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth)<=1,`${route} ${width}: overflow`);
              }
              await page.goto(base+'/site/work.html',{waitUntil:'networkidle'});
              await page.waitForSelector('.work-index[data-style-b-integrated="true"]',{timeout:10000});
              await page.waitForFunction(()=>[...document.querySelectorAll('.work-card-v32[data-project-card-variant]')].every(c=>c.dataset.projectCardLeadVisual==='canonical-jpg'));
              const work=page.locator('.work-index');
              const cards=work.locator('.work-card-v32[data-project-card-variant]');
              const count=await cards.count();
              assert(count>=6,`Work ${width}: too few cards ${count}`);
              const variants=await cards.evaluateAll(nodes=>nodes.map(n=>n.dataset.projectCardVariant));
              assert(variants.every(v=>['featured','standard','compact'].includes(v)),`Work ${width}: variant drift`);
              const dh=work.locator('.work-card-v32[data-work-index-project="daily-hours"]');
              assert(await dh.count()===1,`Work ${width}: Daily Hours absent`);
              const dhMeta=(await dh.locator('.project-card__meta').innerText()).replace(/\s+/g,' ').trim();
              assert(/0→1 PRODUCT/i.test(dhMeta)&&/SHULIN STUDIO/i.test(dhMeta)&&/2026/.test(dhMeta),`Work ${width}: Daily Hours metadata ${dhMeta}`);
              for(let i=0;i<count;i++){
                const card=cards.nth(i); const id=await card.getAttribute('data-work-index-project'); const expected=expectedVisual(id); if(!expected)continue;
                const img=card.locator('.work-card-v32__image-v225'); assert(await img.count()===1,`Work ${width} ${id}: image missing`);
                assert(await img.getAttribute('src')===expected,`Work ${width} ${id}: wrong Lead Visual`);
                const styles=await img.evaluate(el=>({fit:getComputedStyle(el).objectFit,opacity:getComputedStyle(el).opacity}));
                assert(styles.fit==='cover'&&styles.opacity==='1',`Work ${width} ${id}: not full bleed`);
                const tint=await card.evaluate(el=>getComputedStyle(el).getPropertyValue('--project-card-tint').trim());
                const expectedTint=brandTint(id); if(expectedTint) assert(tint===expectedTint,`Work ${width} ${id}: tint ${tint} expected ${expectedTint}`);
                assert(await card.locator('.project-card__title').evaluate(el=>getComputedStyle(el).textDecorationLine)==='none',`Work ${width} ${id}: title underline`);
                assert(await card.locator('.work-card-v32__button').getAttribute('href'),`Work ${width} ${id}: whole-card route missing`);
              }
              await work.screenshot({path:path.join(out,`work-${width}.png`),animations:'disabled'});
              const payment=work.locator('.work-card-v32[data-work-index-project="payment"] .work-card-v32__button');
              if(await payment.count()){
                const expected=normalizePath(await payment.getAttribute('href'));
                await Promise.all([page.waitForLoadState('domcontentloaded'),payment.click()]);
                assert(normalizePath(page.url())===expected,`Work ${width}: whole-card navigation failed`);
              }
              await page.goto(base+'/site/index.html',{waitUntil:'networkidle'});
              const domain=page.locator('#domains'); await domain.scrollIntoViewIfNeeded();
              await page.waitForFunction(()=>document.querySelector('#domains')?.dataset.domainGoldenReferenceMounted==='true');
              assert(await domain.locator('.domain-tab').count()===6,`Domain ${width}: expected six tabs`);
              const shots=[];
              for(let index=0;index<6;index++){
                const tab=domain.locator('.domain-tab').nth(index); await tab.click(); await page.waitForTimeout(350);
                const active=domain.locator('.domain-project-card-v2[data-wheel-offset="0"]'); assert(await active.count()===1,`Domain ${width} ${index}: active card missing`);
                const id=await active.getAttribute('data-project'); const expected=expectedVisual(id); assert(expected,`Domain ${width}: ${id} has no canonical visual`);
                for(const selector of ['.domain-project-card-v2__content','.domain-project-card-v2__meta','.domain-project-card-v2__title','.domain-project-card-v2__cta','.domain-project-card-v2__visual','.domain-project-card-v2__image']){
                  assert(await active.locator(selector).count()===1,`Domain ${width} ${id}: ${selector} missing`);
                  assert(await active.locator(selector).isVisible(),`Domain ${width} ${id}: ${selector} invisible`);
                }
                const img=active.locator('.domain-project-card-v2__image');
                assert(await img.getAttribute('src')===expected,`Domain ${width} ${id}: wrong Lead Visual`);
                assert(await img.evaluate(el=>getComputedStyle(el).objectFit)==='cover',`Domain ${width} ${id}: image not cover`);
                assert(await active.locator('.domain-project-card-v2__title').evaluate(el=>getComputedStyle(el).textDecorationLine)==='none',`Domain ${width} ${id}: title underline`);
                assert(await active.locator('.domain-project-card-v2__cta').evaluate(el=>getComputedStyle(el).textDecorationLine)==='none',`Domain ${width} ${id}: CTA underline`);
                const tint=await active.evaluate(el=>getComputedStyle(el).getPropertyValue('--project-card-tint').trim()); const expectedTint=brandTint(id); if(expectedTint) assert(tint===expectedTint,`Domain ${width} ${id}: tint mismatch`);
                const href=await active.locator('.domain-project-card-v2__cta').getAttribute('href'); assert(href,`Domain ${width} ${id}: CTA route missing`);
                const shot=`domain-${width}-${index+1}.png`; await domain.screenshot({path:path.join(out,shot),animations:'disabled'}); shots.push({id,shot});
              }
              report[width]={workCards:count,variants,domains:shots,consoleErrors:errors};
              assert(errors.length===0,`Console errors ${width}: ${JSON.stringify(errors)}`);
              await context.close();
            }
          } finally {
            fs.writeFileSync(path.join(out,'report.json'),JSON.stringify(report,null,2));
            await browser.close();
          }
          NODE

      - name: Upload Human-review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-card-final-evidence
          path: artifacts/project-card-final
          retention-days: 7
