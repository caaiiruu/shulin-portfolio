name: Style B ProjectCard Final QA

on:
  push:
    branches:
      - integration/style-b-project-card-webp-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Production ancestry and frozen dependencies
        run: |
          set -euo pipefail
          BASE=7b6c4f47b6f1bba1e4d4048649305f22999b2976
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --check "$BASE"...HEAD
          git diff --name-only "$BASE"...HEAD | tee /tmp/changed.txt
          ! grep -Fxq 'public/site/assets/css/components/case-study-v2.css' /tmp/changed.txt
          ! grep -Fxq 'public/site/assets/js/case-study-v2.js' /tmp/changed.txt
          ! grep -E '^public/site/content/case-studies/daily-hours/' /tmp/changed.txt
          ! grep -E '^public/site/assets/projects/daily-hours/' /tmp/changed.txt
          ! grep -Fxq 'scripts/generate-project-pages.mjs' /tmp/changed.txt
          ! grep -Fxq 'scripts/build-production-assets.mjs' /tmp/changed.txt

      - name: Verify project, locale and media contracts
        run: |
          node <<'NODE'
          const fs=require('fs');
          const content=JSON.parse(fs.readFileSync('public/site/content/portfolio-content.json','utf8'));
          const registry=JSON.parse(fs.readFileSync('public/site/content/project-presentation-registry.json','utf8'));
          const ids=Object.keys(content.projects||{});
          if(ids.length!==13) throw new Error(`legacy project count ${ids.length}`);
          if(content.projects['daily-hours']) throw new Error('Daily Hours entered legacy projects');
          if(content.publicLocaleMode!=='EN_ONLY_TEMPORARY') throw new Error('public locale mode drift');
          const dh=registry.routes?.['/work/daily-hours'];
          if(!dh||dh.projectId!=='daily-hours'||dh.presentationContract!=='case-study-v2') throw new Error('Daily Hours registry drift');
          if('domainIds' in (dh.workProjection||{})||'company' in (dh.workProjection||{})) throw new Error('Style B metadata leaked into frozen Daily Hours registry');
          const mediaIds=['payment','voucher','voucher-center','game-center','dbs','booking','cathay-mortgage-assistant','cathay-sit-online-account-opening','cathay-sit-review-remediation-operations','ctbc-mortgage-self-service-app','daily-hours'];
          for(const id of mediaIds){
            for(const width of [800,1200,1600]){
              const file=`public/site/assets/style-b/lead-visuals-webp/${id}-${width}.webp`;
              if(!fs.existsSync(file)) throw new Error(`missing ${file}`);
              const bytes=fs.statSync(file).size;
              if(bytes<10000||bytes>250000) throw new Error(`unexpected WebP size ${file}: ${bytes}`);
            }
          }
          NODE

      - name: Install, build and test
        run: |
          npm run install:ci
          npm run build
          npm test

      - name: Install browser QA dependencies
        working-directory: public/site/qa
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start static QA server
        run: |
          PORT=4173 node tests/portfolio-static-server.mjs >/tmp/style-b-project-card-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/site/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/style-b-project-card-server.log
          exit 1

      - name: Run exact visual and interaction contract
        working-directory: public/site/qa
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          import fs from 'node:fs';
          import path from 'node:path';
          const browser=await chromium.launch({headless:true});
          const base='http://127.0.0.1:4173';
          const widths=[1419,871,430];
          const out=path.join(process.env.GITHUB_WORKSPACE,'artifacts/style-b-project-card-final');
          fs.mkdirSync(out,{recursive:true});
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          const report={};
          const routes=[
            ['home','/site/index.html'],['work','/site/work.html'],['daily-hours','/site/work/daily-hours.html'],
            ['payment','/site/work/payment.html'],['voucher','/site/work/voucher.html'],['dbs','/site/work/dbs.html'],['booking','/site/work/booking.html'],['profile','/site/profile.html']
          ];
          try{
            for(const width of widths){
              const context=await browser.newContext({viewport:{width,height:1100},hasTouch:width===430,isMobile:width===430});
              await context.addInitScript(()=>{if(location.pathname==='/site/work/daily-hours.html')history.replaceState(null,'','/work/daily-hours')});
              const page=await context.newPage();
              const errors=[];
              page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
              page.on('pageerror',e=>errors.push(e.message));
              for(const [name,route] of routes){
                const response=await page.goto(base+route,{waitUntil:'networkidle'});
                assert(response?.ok(),`${name} ${width}: HTTP ${response?.status()}`);
                assert(await page.locator('.site-header').count()===1,`${name} ${width}: Header count`);
                assert(await page.locator('.site-footer').count()===1,`${name} ${width}: Footer count`);
                assert(await page.locator('[data-lang-toggle]').count()===0,`${name} ${width}: locale control leaked`);
                assert(await page.evaluate(()=>document.documentElement.lang)==='en',`${name} ${width}: not EN`);
                assert(await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth)<=1,`${name} ${width}: overflow`);
                if(name==='daily-hours'){
                  assert(await page.locator('.csv2-main[data-csv2-mounted="true"]').count()===1,`Daily Hours ${width}: CSV2 not mounted`);
                  assert(await page.locator('.csv2-cta').count()===1,`Daily Hours ${width}: CTA missing`);
                  if(width===1419) assert(await page.locator('.csv2-evidence-index').count()===1,'Daily Hours 1419: indexed evidence missing');
                  if(width<=871) assert(await page.locator('.csv2-accordion').count()===1,`Daily Hours ${width}: accordion missing`);
                }
              }

              await page.goto(base+'/site/work.html',{waitUntil:'networkidle'});
              await page.waitForSelector('.work-index[data-style-b-integrated="true"]',{timeout:10000});
              await page.waitForFunction(()=>document.querySelectorAll('.work-card-v32[data-project-card-lead-visual="responsive-webp"]').length>=6);
              const work=page.locator('.work-index');
              const cards=work.locator('.work-card-v32[data-project-card-variant]');
              const count=await cards.count();
              assert(count>=6,`Work ${width}: card count ${count}`);
              const variants=await cards.evaluateAll(nodes=>nodes.map(n=>n.dataset.projectCardVariant));
              assert(variants.every(v=>['featured','standard','compact'].includes(v)),`Work ${width}: variant drift ${JSON.stringify(variants)}`);
              assert(await cards.evaluateAll(nodes=>nodes.every(n=>n.dataset.projectCardSystem==='shared-v1')),`Work ${width}: shared system missing`);
              const dh=work.locator('.work-card-v32[data-work-index-project="daily-hours"]');
              assert(await dh.count()===1,`Work ${width}: Daily Hours card missing`);
              const dhMeta=(await dh.locator('.project-card__meta').innerText()).replace(/\s+/g,' ').trim();
              assert(/0→1 PRODUCT/i.test(dhMeta)&&/SHULIN STUDIO/i.test(dhMeta)&&/2026/.test(dhMeta),`Work ${width}: Daily Hours metadata ${dhMeta}`);
              const mapped=work.locator('.work-card-v32[data-project-card-lead-visual="responsive-webp"]');
              for(let i=0;i<await mapped.count();i++){
                const card=mapped.nth(i);const img=card.locator('.work-card-v32__image-v225');
                const src=await img.getAttribute('src');const srcset=await img.getAttribute('srcset');
                assert(/lead-visuals-webp\/.*-1600\.webp$/.test(src||''),`Work ${width}: non-WebP ${src}`);
                assert(/800w/.test(srcset||'')&&/1200w/.test(srcset||'')&&/1600w/.test(srcset||''),`Work ${width}: srcset ${srcset}`);
                const styles=await img.evaluate(el=>({fit:getComputedStyle(el).objectFit,opacity:getComputedStyle(el).opacity}));
                assert(styles.fit==='cover'&&styles.opacity==='1',`Work ${width}: media not full bleed ${JSON.stringify(styles)}`);
                const bg=await card.locator('.work-artifact').evaluate(el=>getComputedStyle(el).backgroundImage);
                assert(bg==='none',`Work ${width}: CSS background substitution ${bg}`);
              }
              if(width===1419){
                const row=work.locator('.work-index__featured-secondary-row > .work-card-v32');
                if(await row.count()===2){
                  const a=await row.nth(0).boundingBox(),b=await row.nth(1).boundingBox();
                  assert(a&&b&&Math.abs(a.height-b.height)<=2,`Work 1419: row card heights ${a?.height}/${b?.height}`);
                  const ma=await row.nth(0).locator('.work-artifact').boundingBox(),mb=await row.nth(1).locator('.work-artifact').boundingBox();
                  assert(ma&&mb&&Math.abs(ma.height-mb.height)<=2,`Work 1419: media heights ${ma?.height}/${mb?.height}`);
                }
                const button=cards.first().locator('.work-card-v32__button');
                const arrow=cards.first().locator('.work-card-v32__action .icon-arrow--right');
                const before=await arrow.boundingBox();await button.hover();await page.waitForTimeout(180);const after=await arrow.boundingBox();
                assert(before&&after&&after.x>before.x&&Math.abs(after.y-before.y)<=1,`Work 1419: hover arrow ${JSON.stringify({before,after})}`);
              }
              await work.screenshot({path:path.join(out,`work-${width}.png`)});

              await page.goto(base+'/site/index.html',{waitUntil:'networkidle'});
              const domain=page.locator('#domains');await domain.scrollIntoViewIfNeeded();
              await page.waitForFunction(()=>document.querySelector('#domains')?.dataset.domainGoldenReferenceMounted==='true');
              assert(await domain.locator('.domain-tab').count()===6,`Domain ${width}: tabs`);
              const operations=domain.locator('.domain-tab').filter({hasText:/Operational|Operations/i}).first();await operations.click();await page.waitForTimeout(220);
              const dhDomain=domain.locator('.domain-project-card-v2[data-project="daily-hours"]');
              assert(await dhDomain.count()===1,`Domain ${width}: Daily Hours absent`);
              assert(await dhDomain.locator('.domain-project-card-v2__cta').getAttribute('href')==='/work/daily-hours',`Domain ${width}: Daily Hours route`);
              await page.waitForFunction(()=>document.querySelector('.domain-project-card-v2[data-project="daily-hours"]')?.dataset.projectCardLeadVisual==='responsive-webp');
              const dimg=dhDomain.locator('.domain-project-card-v2__image');
              const dsrcset=await dimg.getAttribute('srcset');
              assert(/800w/.test(dsrcset||'')&&/1200w/.test(dsrcset||'')&&/1600w/.test(dsrcset||''),`Domain ${width}: Daily Hours srcset`);
              assert(await dimg.evaluate(el=>getComputedStyle(el).objectFit)==='cover',`Domain ${width}: media not cover`);
              if(width<=900)assert(await domain.locator('.domain-wheel-v2__control:visible').count()===0,`Domain ${width}: controls visible`);
              await domain.screenshot({path:path.join(out,`domain-${width}.png`)});
              assert(errors.length===0,`Console errors ${width}: ${JSON.stringify(errors)}`);
              report[width]={cards:count,variants};
              await context.close();
            }
          } finally {
            fs.writeFileSync(path.join(out,'report.json'),JSON.stringify(report,null,2));
            await browser.close();
          }
          NODE

      - name: Upload final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: style-b-project-card-final
          path: artifacts/style-b-project-card-final
          retention-days: 3
