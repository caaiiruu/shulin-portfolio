name: Style B Work Proof Diagnostic

on:
  push:
    branches:
      - migration/style-b-domain-work-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install and build
        run: |
          npm run install:ci
          npm run build
      - name: Install browser
        working-directory: public/site/qa
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start server
        run: |
          PORT=4173 node tests/portfolio-static-server.mjs >/tmp/work-diag-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/site/work.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/work-diag-server.log
          exit 1
      - name: Capture Work image raster paint
        working-directory: public/site/qa
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          import fs from 'node:fs';
          import path from 'node:path';
          const out=path.join(process.env.GITHUB_WORKSPACE,'artifacts/work-proof-diagnostic');
          fs.mkdirSync(out,{recursive:true});
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1419,height:1100}});
          const errors=[];
          page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
          page.on('pageerror',e=>errors.push(e.message));
          await page.goto('http://127.0.0.1:4173/site/work.html',{waitUntil:'networkidle'});
          await page.waitForSelector('.work-index',{timeout:10000});
          await page.waitForFunction(()=>{
            const images=[...document.querySelectorAll('.work-index-card__visual img')];
            return images.length===5&&images.every(img=>img.complete&&img.naturalWidth>0);
          },{timeout:10000});
          const data=await page.evaluate(()=>({
            rendered:[...document.querySelectorAll('.work-index-card')].map(card=>{
              const visual=card.querySelector('.work-index-card__visual');
              const img=visual?.querySelector('img');
              const vr=visual?.getBoundingClientRect();
              const ir=img?.getBoundingClientRect();
              const vs=visual?getComputedStyle(visual):null;
              const is=img?getComputedStyle(img):null;
              let nonWhiteRatio=0;
              if(img){
                const canvas=document.createElement('canvas');
                canvas.width=128; canvas.height=72;
                const ctx=canvas.getContext('2d',{willReadFrequently:true});
                ctx.drawImage(img,0,0,128,72);
                const px=ctx.getImageData(0,0,128,72).data;
                let nonWhite=0;
                for(let i=0;i<px.length;i+=4){
                  if(px[i]<245||px[i+1]<245||px[i+2]<245) nonWhite++;
                }
                nonWhiteRatio=nonWhite/(128*72);
              }
              return {
                project:card.dataset.workIndexProject||'',
                visual:{width:vr?.width||0,height:vr?.height||0,display:vs?.display,visibility:vs?.visibility,opacity:vs?.opacity,overflow:vs?.overflow},
                image:img?{src:img.currentSrc||img.src,naturalWidth:img.naturalWidth,naturalHeight:img.naturalHeight,width:ir?.width||0,height:ir?.height||0,display:is?.display,visibility:is?.visibility,opacity:is?.opacity,objectFit:is?.objectFit,position:is?.position,filter:is?.filter,mixBlendMode:is?.mixBlendMode,clipPath:is?.clipPath,nonWhiteRatio}:null
              };
            })
          }));
          data.errors=errors;
          fs.writeFileSync(path.join(out,'work-image-raster.json'),JSON.stringify(data,null,2));
          for(const item of data.rendered){
            const locator=page.locator(`.work-index-card[data-work-index-project="${item.project}"] .work-index-card__visual img`);
            await locator.screenshot({path:path.join(out,`${item.project}-img.png`)});
          }
          await page.locator('.work-index').screenshot({path:path.join(out,'work-1419-diagnostic.png')});
          await browser.close();
          console.log(JSON.stringify(data,null,2));
          NODE
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: style-b-work-proof-diagnostic
          path: artifacts/work-proof-diagnostic
          retention-days: 1
