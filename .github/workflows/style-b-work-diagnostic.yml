name: Style B Domain Geometry Diagnostic

on:
  push:
    branches:
      - migration/style-b-domain-work-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install and build
        run: |
          npm run install:ci
          npm run build
      - name: Install browser
        working-directory: public/site/qa
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start server
        run: |
          PORT=4173 node tests/portfolio-static-server.mjs >/tmp/domain-diag-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/site/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/domain-diag-server.log
          exit 1
      - name: Capture Domain geometry
        working-directory: public/site/qa
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          import fs from 'node:fs';
          import path from 'node:path';
          const out=path.join(process.env.GITHUB_WORKSPACE,'artifacts/domain-geometry-diagnostic');
          fs.mkdirSync(out,{recursive:true});
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1419,height:1100}});
          const errors=[];
          page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
          page.on('pageerror',e=>errors.push(e.message));
          await page.goto('http://127.0.0.1:4173/site/index.html',{waitUntil:'networkidle'});
          await page.locator('#domains').scrollIntoViewIfNeeded();
          await page.waitForFunction(()=>document.querySelector('#domains')?.dataset.domainGoldenReferenceMounted==='true');
          await page.waitForSelector('#domains .domain-project-card-v2[data-wheel-offset="0"]');
          const data=await page.evaluate(()=>{
            const inspect=(el)=>{
              if(!el)return null;
              const r=el.getBoundingClientRect();
              const s=getComputedStyle(el);
              return {tag:el.tagName,id:el.id,className:typeof el.className==='string'?el.className:'',rect:{x:r.x,y:r.y,width:r.width,height:r.height,right:r.right},computedWidth:s.width,display:s.display,position:s.position,transform:s.transform,transformOrigin:s.transformOrigin,zoom:s.zoom,maxWidth:s.maxWidth,minWidth:s.minWidth,boxSizing:s.boxSizing,paddingLeft:s.paddingLeft,paddingRight:s.paddingRight,marginLeft:s.marginLeft,marginRight:s.marginRight,overflowX:s.overflowX};
            };
            const wheel=document.querySelector('#domains .domain-wheel-v2');
            const panel=wheel?.closest('.domain-panel-v30--projects');
            const section=document.querySelector('#domains');
            const ancestors=[];
            let el=wheel;
            while(el){ ancestors.push(inspect(el)); el=el.parentElement; }
            return {
              viewport:{innerWidth:window.innerWidth,clientWidth:document.documentElement.clientWidth,dpr:window.devicePixelRatio,visualViewportWidth:window.visualViewport?.width||null},
              cssVar:getComputedStyle(section).getPropertyValue('--domain-viewport-width').trim(),
              wheel:inspect(wheel),panel:inspect(panel),section:inspect(section),body:inspect(document.body),html:inspect(document.documentElement),ancestors
            };
          });
          data.errors=errors;
          fs.writeFileSync(path.join(out,'domain-geometry.json'),JSON.stringify(data,null,2));
          await page.locator('#domains').screenshot({path:path.join(out,'domain-1419-diagnostic.png')});
          console.log('DOMAIN_GEOMETRY '+JSON.stringify(data));
          await browser.close();
          NODE
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: style-b-domain-geometry-diagnostic
          path: artifacts/domain-geometry-diagnostic
          retention-days: 1
