name: Style B Work Visual Diagnostic

on:
  push:
    branches:
      - migration/style-b-domain-work-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Collect candidate visual assets
        run: |
          set -euo pipefail
          OUT=artifacts/work-visual-candidates
          mkdir -p "$OUT"
          cp public/site/assets/projects/dbs/dbs-lead-visual-exception-and-risk-workbench-public-v1.jpg "$OUT/dbs-lead.jpg"
          cp public/site/assets/projects/dbs/dbs-decision-03-cross-role-architecture-01.jpeg "$OUT/dbs-cross-role.jpeg"
          cp public/site/assets/projects/dbs/dbs-decision-02-report-to-workbench-01.jpeg "$OUT/dbs-workbench.jpeg"
          cp public/site/assets/projects/booking/booking-connected-trip-lead-visual-timeline-experience-public-v1.jpg "$OUT/booking-lead.jpg"
          cp public/site/assets/projects/booking/booking-evidence-decision-02-hotjar-edit-trip-01.jpg "$OUT/booking-hotjar.jpg"
          cp public/site/assets/projects/booking/booking-evidence-decision-03-baggage-language-01.jpg "$OUT/booking-baggage.jpg"
          cp public/site/assets/projects/game-center/game-center-lead-visual-multi-game-discovery-public-v1.jpg "$OUT/game-center-lead.jpg"
          cp public/site/assets/projects/payment/payment-lead-visual-app-and-sco-checkout-public-v1.jpg "$OUT/payment-lead.jpg"
          find "$OUT" -type f -maxdepth 1 -print -exec sha256sum {} \;
      - name: Upload visual candidates
        uses: actions/upload-artifact@v4
        with:
          name: style-b-work-visual-candidates
          path: artifacts/work-visual-candidates
          retention-days: 1
