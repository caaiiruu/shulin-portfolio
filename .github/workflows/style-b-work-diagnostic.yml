name: Style B Work Proof Diagnostic

on:
  push:
    branches:
      - migration/style-b-domain-work-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install and build
        run: |
          npm run install:ci
          npm run build
      - name: Install browser
        working-directory: public/site/qa
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start server
        run: |
          PORT=4173 node tests/portfolio-static-server.mjs >/tmp/work-diag-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/site/work.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/work-diag-server.log
          exit 1
      - name: Capture canonical Work projection fields
        working-directory: public/site/qa
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          import fs from 'node:fs';
          import path from 'node:path';
          const out=path.join(process.env.GITHUB_WORKSPACE,'artifacts/work-proof-diagnostic');
          fs.mkdirSync(out,{recursive:true});
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1419,height:1100}});
          const errors=[];
          page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
          page.on('pageerror',e=>errors.push(e.message));
          await page.goto('http://127.0.0.1:4173/site/work.html',{waitUntil:'networkidle'});
          await page.waitForSelector('.work-index',{timeout:10000});
          const data=await page.evaluate(()=>{
            const ids=['voucher','payment','dbs','booking','game-center'];
            const DATA=window.PORTFOLIO_RUNTIME_DATA||window.PORTFOLIO_DATA||{};
            const pick=(obj)=>({
              keys:Object.keys(obj||{}).sort(),
              company:obj?.company,
              title:obj?.title,
              transformation:obj?.transformation,
              transformation_zh:obj?.transformation_zh,
              atAGlance:obj?.atAGlance,
              at_a_glance_pair:obj?.at_a_glance_pair,
              whatThisProves:obj?.whatThisProves,
              what_this_proves:obj?.what_this_proves,
              infoGrid:obj?.infoGrid,
              role:obj?.role,
              scope:obj?.scope,
              audience:obj?.audience,
              timeline:obj?.timeline,
              businessImpact:obj?.businessImpact,
              business_impact:obj?.business_impact,
              impactEvidence:obj?.impactEvidence,
              impact_evidence:obj?.impact_evidence,
              metrics:obj?.metrics,
              primaryMetrics:obj?.primaryMetrics,
              primary_metrics:obj?.primary_metrics,
              heroVisualBrief:obj?.heroVisualBrief,
              hero_visual_brief:obj?.hero_visual_brief,
              domain_label:obj?.domain_label,
              cardTitle:obj?.cardTitle
            });
            return {
              projects:Object.fromEntries(ids.map(id=>[id,{raw:pick(DATA.projects?.[id]),adapted:pick(window.adaptPortfolioProject?.(id)||{})}])),
              source:[...document.querySelectorAll('#workGallery > article')].map(card=>({
                project:card.querySelector('[data-project]')?.dataset.project||'',
                directClasses:[...card.children].map(node=>node.className),
                buttonChildren:[...card.querySelector('[data-project]')?.children||[]].map(node=>node.className),
                images:[...card.querySelectorAll('img')].map(img=>({src:img.getAttribute('src'),assetId:img.dataset.assetId||'',className:img.className}))
              }))
            };
          });
          data.errors=errors;
          fs.writeFileSync(path.join(out,'work-projection-fields.json'),JSON.stringify(data,null,2));
          await page.locator('.work-index').screenshot({path:path.join(out,'work-1419-diagnostic.png')});
          await browser.close();
          NODE
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: style-b-work-proof-diagnostic
          path: artifacts/work-proof-diagnostic
          retention-days: 1
