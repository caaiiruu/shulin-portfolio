name: Style B Final Visual Diagnostic

on:
  push:
    branches:
      - migration/style-b-domain-work-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Install and build
        run: |
          npm run install:ci
          npm run build
      - name: Install browser
        working-directory: public/site/qa
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start server
        run: |
          PORT=4173 node tests/portfolio-static-server.mjs >/tmp/final-visual-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/site/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/final-visual-server.log
          exit 1
      - name: Verify all outer-card proof and painted visuals
        working-directory: public/site/qa
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          import fs from 'node:fs';
          import path from 'node:path';
          const out=path.join(process.env.GITHUB_WORKSPACE,'artifacts/style-b-final-visual-diagnostic');
          fs.mkdirSync(out,{recursive:true});
          const browser=await chromium.launch({headless:true});
          const widths=[1419,871,430];
          const report={domain:{},work:{},errors:[]};
          const assert=(value,message)=>{if(!value)throw new Error(message)};
          const clean=value=>String(value||'').replace(/\s+/g,' ').trim();
          const forbiddenProof=/\b(?:timeline|duration|interviews?|participants?|respondents?|functions?|flows?|prototypes?|usability tasks?)\b|時程|期間|訪談|參與者|功能|原型|可用性任務/i;
          const assertProofLabels=(labels,label)=>assert(labels.every(x=>!forbiddenProof.test(clean(x))),`${label}: filler proof returned ${JSON.stringify(labels)}`);

          for(const width of widths){
            const context=await browser.newContext({viewport:{width,height:1100},reducedMotion:'no-preference'});
            const page=await context.newPage();
            const errors=[];
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            page.on('pageerror',e=>errors.push(e.message));

            await page.goto('http://127.0.0.1:4173/site/index.html',{waitUntil:'networkidle'});
            await page.waitForFunction(()=>document.querySelector('#domains')?.dataset.domainGoldenReferenceMounted==='true');
            const domain=page.locator('#domains');
            await domain.scrollIntoViewIfNeeded();
            const tabs=domain.locator('.domain-tab');
            assert(await tabs.count()===6,`Domain ${width}: expected six tabs`);
            const iconKeys=await domain.locator('.domain-tab__icon').evaluateAll(nodes=>nodes.map(n=>n.dataset.iconKey||''));
            assert(iconKeys.length===6,`Domain ${width}: expected six icons`);
            assert(new Set(iconKeys).size===6,`Domain ${width}: icon semantics not distinct ${JSON.stringify(iconKeys)}`);

            const domainTabs=[];
            for(let tabIndex=0;tabIndex<6;tabIndex++){
              await tabs.nth(tabIndex).click();
              await page.waitForFunction(index=>document.querySelectorAll('#domains .domain-tab')[index]?.getAttribute('aria-selected')==='true',tabIndex);
              await page.waitForFunction(()=>document.querySelectorAll('#domains .domain-project-card-v2[data-wheel-offset="0"]').length===1);
              await page.evaluate(()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve))));

              const tabLabel=clean(await tabs.nth(tabIndex).locator('.domain-tab__label').textContent());
              const cards=domain.locator('.domain-project-card-v2');
              const cardCount=await cards.count();
              assert(cardCount>=1,`Domain ${width} ${tabLabel}: no cards`);
              const projects=[];
              for(let cardIndex=0;cardIndex<cardCount;cardIndex++){
                const card=cards.nth(cardIndex);
                const project=await card.getAttribute('data-project');
                const labels=(await card.locator('.domain-project-card-v2__metric-label').allTextContents()).map(clean);
                assert(labels.every(label=>!/[+/]/.test(label)),`Domain ${width} ${tabLabel} ${project}: residual metric punctuation ${JSON.stringify(labels)}`);
                assertProofLabels(labels,`Domain ${width} ${tabLabel} ${project}`);
                projects.push({project,metricLabels:labels});
              }

              await domain.evaluate(async root=>{
                const running=root.getAnimations({subtree:true}).filter(animation=>animation.playState==='running');
                await Promise.allSettled(running.map(animation=>animation.finished));
              });
              await page.evaluate(()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve))));
              await domain.screenshot({path:path.join(out,`domain-${width}-tab-${tabIndex+1}-painted.png`)});
              domainTabs.push({tabIndex:tabIndex+1,tabLabel,projects});
            }
            report.domain[width]={iconKeys,tabs:domainTabs};

            await page.goto('http://127.0.0.1:4173/site/work.html',{waitUntil:'networkidle'});
            await page.waitForSelector('.work-index',{timeout:10000});
            const allMetricLabels=(await page.locator('.work-index-card__metric-label').allTextContents()).map(clean);
            assert(allMetricLabels.every(label=>!/[+/]/.test(label)),`Work ${width}: residual metric punctuation ${JSON.stringify(allMetricLabels)}`);
            assertProofLabels(allMetricLabels,`Work ${width}`);

            const cards=page.locator('.work-index-card');
            const painted=[];
            for(let i=0;i<await cards.count();i++){
              const card=cards.nth(i);
              await card.scrollIntoViewIfNeeded();
              const project=await card.getAttribute('data-work-index-project');
              const cardLabels=(await card.locator('.work-index-card__metric-label').allTextContents()).map(clean);
              assertProofLabels(cardLabels,`Work ${width} ${project}`);
              const image=card.locator('.work-index-card__visual img');
              assert(await image.count()===1,`Work ${width} ${project}: visual image missing`);
              await image.evaluate(async img=>{if(img.decode){try{await img.decode()}catch{}}});
              await page.evaluate(()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve))));
              const state=await image.evaluate(img=>{
                const r=img.getBoundingClientRect();
                const s=getComputedStyle(img);
                let nonWhiteRatio=0;
                try{
                  const canvas=document.createElement('canvas');canvas.width=96;canvas.height=54;
                  const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0,96,54);
                  const p=ctx.getImageData(0,0,96,54).data;let n=0;
                  for(let j=0;j<p.length;j+=4)if(p[j]<245||p[j+1]<245||p[j+2]<245)n++;
                  nonWhiteRatio=n/(96*54);
                }catch{}
                return{complete:img.complete,naturalWidth:img.naturalWidth,naturalHeight:img.naturalHeight,width:r.width,height:r.height,display:s.display,visibility:s.visibility,opacity:s.opacity,nonWhiteRatio};
              });
              assert(state.complete&&state.naturalWidth>0&&state.naturalHeight>0,`Work ${width} ${project}: image not decoded`);
              assert(state.width>40&&state.height>40&&state.display!=='none'&&state.visibility!=='hidden'&&Number(state.opacity)>0,`Work ${width} ${project}: image not visibly laid out`);
              assert(state.nonWhiteRatio>0.01,`Work ${width} ${project}: image raster appears blank`);
              await card.screenshot({path:path.join(out,`work-${width}-${project}-painted.png`)});
              painted.push({project,metricLabels:cardLabels,...state});
            }

            assert(errors.length===0,`Console/page errors ${width} ${JSON.stringify(errors)}`);
            report.work[width]={workMetricLabels:allMetricLabels,painted};
            report.errors.push(...errors.map(text=>({width,text})));
            await context.close();
          }

          fs.writeFileSync(path.join(out,'final-visual.json'),JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          await browser.close();
          NODE
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: style-b-final-visual-diagnostic
          path: artifacts/style-b-final-visual-diagnostic
          retention-days: 3
