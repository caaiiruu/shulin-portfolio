name: Style B SSOT Consolidation

on:
  push:
    branches:
      - integration/style-b-project-card-webp-v1
    paths:
      - '.github/workflows/style-b-ssot-consolidation.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/style-b-project-card-webp-v1
          fetch-depth: 0
      - name: Move ProjectCard asset projection into canonical asset manifest
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const assetPath = 'public/site/content/portfolio-asset-manifest.json';
          const tempPath = 'public/site/content/project-card-registry.json';
          const dsPath = 'public/site/docs/design-system/registry.json';
          const asset = JSON.parse(fs.readFileSync(assetPath, 'utf8'));
          const temp = JSON.parse(fs.readFileSync(tempPath, 'utf8'));
          const ds = JSON.parse(fs.readFileSync(dsPath, 'utf8'));

          asset.projectCardLeadVisuals = {
            schemaVersion: 1,
            owner: 'portfolio-asset-manifest.json',
            componentOwner: 'ProjectCard',
            variants: ['featured','standard','compact'],
            source: 'approvedCanonicalMasterOnly',
            usage: ['home','domain','work'],
            aspectRatio: '16:9',
            fit: 'cover',
            rules: temp.leadVisualContract.rules,
            projects: temp.projects
          };

          const pc = ds?.governanceGraph?.componentContracts?.ProjectCard;
          if (!pc) throw new Error('ProjectCard component contract missing');
          pc.assetRegistry = 'content/portfolio-asset-manifest.json#projectCardLeadVisuals';
          pc.assetRegistryRole = 'Canonical ProjectCard Lead Visual identity, approved source hash, brand tint and delivery projection';

          fs.writeFileSync(assetPath, JSON.stringify(asset, null, 2) + '\n');
          fs.writeFileSync(dsPath, JSON.stringify(ds, null, 2) + '\n');
          fs.unlinkSync(tempPath);
          NODE

          rm -f .github/workflows/style-b-ssot-consolidation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --check --cached
          git commit -m 'Move ProjectCard asset projection into canonical asset manifest'
          git push origin HEAD:integration/style-b-project-card-webp-v1
