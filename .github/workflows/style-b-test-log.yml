name: Style B Validation Log

on:
  push:
    branches:
      - migration/style-b-domain-work-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validation-log:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: migration/style-b-domain-work-v1
      - name: Canonicalize Domain card naming from SSOT
        if: github.event.head_commit.message == 'Trigger Cathay runtime canonicalization'
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='public/site/assets/js/domain-experience.js';
          let source=fs.readFileSync(path,'utf8');
          const block=/\n  const CARD_PRESENTATION_COPY = \{[\s\S]*?\n  \};\n  const presentationCopy = \(key\) => CARD_PRESENTATION_COPY\[key\]\?\.\[language\(\)\] \|\| \{\};\n/;
          if(!block.test(source)) throw new Error('Cathay presentation-copy override block not found');
          source=source.replace(block,'\n');
          source=source.replace("    const compact = presentationCopy(key);\n",'');
          source=source.replace("    company.textContent = compact.company || firstText(project?.company);","    company.textContent = firstText(project?.company);");
          source=source.replace("    title.textContent = compact.title || firstText(language() === 'zh' ? project?.transformation_zh : project?.transformation, project?.transformation, project?.title_pair, project?.title);","    title.textContent = firstText(language() === 'zh' ? project?.transformation_zh : project?.transformation, project?.transformation, project?.title_pair, project?.title);");
          if(/CARD_PRESENTATION_COPY|presentationCopy\(|compact\.company|compact\.title/.test(source)) throw new Error('Residual presentation-copy override remained');
          fs.writeFileSync(path,source);
          NODE
          git config user.name 'caiiru'
          git config user.email '63276875+caaiiruu@users.noreply.github.com'
          git add public/site/assets/js/domain-experience.js
          git diff --cached --check
          git commit -m 'Use canonical SSOT names in Domain cards'
          git push origin HEAD:migration/style-b-domain-work-v1
      - name: Verify isolated baseline and denylist
        run: |
          set -euo pipefail
          test "$(git merge-base 05291a4ba071d00d0098f227ea08069c774cb422 HEAD)" = "05291a4ba071d00d0098f227ea08069c774cb422"
          git diff --check 05291a4ba071d00d0098f227ea08069c774cb422...HEAD
          git diff --name-only 05291a4ba071d00d0098f227ea08069c774cb422...HEAD | tee /tmp/changed.txt
          ! grep -Fxq 'public/site/assets/js/app.js' /tmp/changed.txt
          test -f public/site/content/portfolio-content.json
          test -f public/site/content/portfolio-asset-manifest.json
          ! grep -Fxq 'public/site/assets/css/components/project-card.css' /tmp/changed.txt
          ! grep -Fxq 'scripts/build-production-assets.mjs' /tmp/changed.txt
          ! grep -Fxq 'scripts/generate-project-pages.mjs' /tmp/changed.txt
          ! grep -E '^public/site/assets/projects/daily-hours/' /tmp/changed.txt
          ! grep -Fxq 'public/site/assets/css/components/project-detail-overview.css' /tmp/changed.txt
      - name: Install dependencies
        run: npm run install:ci
      - name: Build
        run: npm run build
      - name: Capture full validation log
        id: validation
        shell: bash
        run: |
          mkdir -p artifacts/style-b-validation
          set +e
          npm test 2>&1 | tee artifacts/style-b-validation/npm-test.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload validation log
        uses: actions/upload-artifact@v4
        with:
          name: style-b-validation-log
          path: artifacts/style-b-validation/npm-test.log
          retention-days: 3
      - name: Fail if validation failed
        if: steps.validation.outputs.exit_code != '0'
        run: exit 1
