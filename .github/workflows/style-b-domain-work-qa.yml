name: Style B Domain Work Human Contract QA

on:
  push:
    branches: [migration/style-b-domain-work-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify isolated baseline and denylist
        run: |
          set -euo pipefail
          BASE=05291a4ba071d00d0098f227ea08069c774cb422
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --check "$BASE"...HEAD
          git diff --name-only "$BASE"...HEAD | tee /tmp/changed.txt
          ! grep -Fxq 'public/site/assets/js/app.js' /tmp/changed.txt
          test -f public/site/content/portfolio-content.json
          test -f public/site/content/portfolio-asset-manifest.json
          ! grep -Fxq 'public/site/assets/css/components/project-card.css' /tmp/changed.txt
          ! grep -Fxq 'scripts/build-production-assets.mjs' /tmp/changed.txt
          ! grep -Fxq 'scripts/generate-project-pages.mjs' /tmp/changed.txt
          ! grep -E '^public/site/assets/projects/daily-hours/' /tmp/changed.txt
          ! grep -Fxq 'public/site/assets/css/components/project-detail-overview.css' /tmp/changed.txt
          git diff --quiet "$BASE"...HEAD -- public/site/assets/css/components/domain-selector.css
          ! grep -q 'related-project-card' public/site/assets/css/components/domain-experience.css

      - name: Verify approved Cathay canonical SSOT
        run: |
          node <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('public/site/content/portfolio-content.json','utf8'));
          const manifest=JSON.parse(fs.readFileSync('public/site/content/portfolio-asset-manifest.json','utf8'));
          if(data.contentVersion!==manifest.contentVersion) throw new Error('Content/asset manifest version drift');
          const expected={
            'cathay-mortgage-assistant':'From rigid scripts to flexible mortgage consultation',
            'cathay-sit-review-remediation-operations':'From interface issues to prioritised remediation',
            'cathay-sit-online-account-opening':'From fragmented steps to end-to-end account opening'
          };
          for(const [id,title] of Object.entries(expected)){
            const p=data.projects?.[id];
            if(!p) throw new Error(`Missing ${id}`);
            if(p.company!=='Cathay'||p.heroMetadata?.company!=='Cathay') throw new Error(`${id}: company not canonical Cathay`);
            if(p.title?.en!==title||p.transformation!==title) throw new Error(`${id}: title/transformation drift`);
          }
          NODE

      - name: Install build and validate source
        run: |
          npm run install:ci
          npm run build
          npm test

      - name: Install browser QA dependencies
        working-directory: public/site/qa
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start static QA server
        run: |
          PORT=4173 node tests/portfolio-static-server.mjs >/tmp/style-b-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/site/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/style-b-server.log
          exit 1

      - name: Run latest Human contract browser QA
        working-directory: public/site/qa
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          import fs from 'node:fs';
          import path from 'node:path';

          const out=path.join(process.env.GITHUB_WORKSPACE,'artifacts/style-b-domain-work-human-contract');
          fs.mkdirSync(out,{recursive:true});
          const base='http://127.0.0.1:4173';
          const widths=[1419,871,430];
          const browser=await chromium.launch({headless:true});
          const report={domain:{},work:{},routes:{},consoleErrors:[]};
          const assert=(value,message)=>{if(!value)throw new Error(message)};
          const clean=value=>String(value||'').replace(/\s+/g,' ').trim();
          const boxInside=(inner,outer,t=2)=>inner&&outer&&inner.left>=outer.left-t&&inner.right<=outer.right+t&&inner.top>=outer.top-t&&inner.bottom<=outer.bottom+t;
          const stacked=async card=>card.evaluate(node=>{
            const c=node.querySelector('.domain-project-card-v2__content,.work-index-card__content')?.getBoundingClientRect();
            const v=node.querySelector('.domain-project-card-v2__visual,.work-index-card__visual')?.getBoundingClientRect();
            return Boolean(c&&v&&v.top>=c.bottom-2);
          });
          const forbiddenProof=/\b(?:timeline|duration|interviews?|participants?|respondents?|functions?|flows?|prototypes?|usability tasks?)\b|時程|期間|訪談|參與者|功能|原型|可用性任務/i;
          const assertProofLabels=(labels,label)=>assert(labels.every(x=>!forbiddenProof.test(x)),`${label}: filler proof returned ${JSON.stringify(labels)}`);

          try{
            for(const width of widths){
              const context=await browser.newContext({viewport:{width,height:1100},reducedMotion:'no-preference'});
              const page=await context.newPage();
              page.on('console',m=>{if(m.type()==='error')report.consoleErrors.push({width,url:page.url(),text:m.text()})});
              page.on('pageerror',e=>report.consoleErrors.push({width,url:page.url(),text:e.message}));

              let response=await page.goto(`${base}/site/index.html`,{waitUntil:'networkidle'});
              assert(response?.ok(),`Home ${width}: HTTP ${response?.status()}`);
              const domain=page.locator('#domains');
              await domain.scrollIntoViewIfNeeded();
              await page.waitForFunction(()=>document.querySelector('#domains')?.dataset.domainGoldenReferenceMounted==='true');
              await page.waitForSelector('#domains .domain-project-card-v2[data-wheel-offset="0"]');

              const tabs=domain.locator('.domain-tab');
              assert(await tabs.count()===6,`Home ${width}: expected 6 Domain tabs`);
              assert(await domain.locator('.domain-tab__icon svg').count()===6,`Home ${width}: all Domain tabs require icons`);
              const tabLabels=(await domain.locator('.domain-tab__label').allTextContents()).map(clean);
              assert(tabLabels.length===6&&tabLabels.every(Boolean)&&!tabLabels.some(x=>/^all$/i.test(x)),`Home ${width}: Domain labels invalid ${JSON.stringify(tabLabels)}`);
              const selectedDecoration=await domain.locator('.domain-tab[aria-selected="true"]').evaluate(node=>({after:getComputedStyle(node,'::after').content,labelAfter:getComputedStyle(node.querySelector('.domain-tab__label'),'::after').content}));
              assert(['none','normal','""'].includes(selectedDecoration.after)&&['none','normal','""'].includes(selectedDecoration.labelAfter),`Home ${width}: selected tab trailing decoration returned ${JSON.stringify(selectedDecoration)}`);

              const viewport=await page.evaluate(()=>document.documentElement.clientWidth);
              const wheel=domain.locator('.domain-wheel-v2');
              const wheelBox=await wheel.boundingBox();
              assert(wheelBox&&Math.abs(wheelBox.width-viewport)<=2&&Math.abs(wheelBox.x)<=2,`Home ${width}: wheel not full bleed`);
              const disclosures=domain.locator('details.domain-experience-disclosure');
              assert(await disclosures.count()===2,`Home ${width}: disclosure count`);
              for(const d of await disclosures.all()) assert(!(await d.getAttribute('open')),`Home ${width}: disclosure default open`);
              if(width===1419){
                const [a,b]=await Promise.all([disclosures.nth(0).boundingBox(),disclosures.nth(1).boundingBox()]);
                assert(a&&b&&b.x-(a.x+a.width)>=48,`Home 1419: disclosure columns too close ${a&&b?b.x-(a.x+a.width):'missing'}`);
              }

              for(let i=0;i<await tabs.count();i++){
                await tabs.nth(i).click();
                await page.waitForFunction(index=>document.querySelectorAll('#domains .domain-tab')[index]?.getAttribute('aria-selected')==='true',i);
                await page.waitForFunction(()=>document.querySelectorAll('#domains .domain-project-card-v2[data-wheel-offset="0"]').length===1);
                const active=domain.locator('.domain-project-card-v2[data-wheel-offset="0"]');
                const cardBox=await active.boundingBox();
                const cta=active.locator('.domain-project-card-v2__cta');
                const ctaBox=await cta.boundingBox();
                assert(boxInside(ctaBox,cardBox,2),`Home ${width} Domain tab ${i+1}: CTA clipped outside card`);
                assert(await active.locator('.domain-project-card-v2__image').evaluate(img=>img.complete&&img.naturalWidth>0),`Home ${width} Domain tab ${i+1}: visual not decoded`);
                const labels=(await active.locator('.domain-project-card-v2__metric-label').allTextContents()).map(clean);
                assert(labels.length<=3&&labels.every(x=>x.split(/\s+/).filter(Boolean).length<=2),`Home ${width} Domain tab ${i+1}: metric labels invalid`);
                assertProofLabels(labels,`Home ${width} Domain tab ${i+1}`);
                const projectCount=await domain.locator('.domain-project-card-v2').count();
                const controls=domain.locator('.domain-wheel-v2__control:visible');
                if(width<=600||projectCount<=1) assert(await controls.count()===0,`Home ${width} Domain tab ${i+1}: controls must be hidden`);
                else assert(await controls.count()===2,`Home ${width} Domain tab ${i+1}: expected two controls`);
                if(width<1419) assert(await stacked(active),`Home ${width} Domain tab ${i+1}: card must stack content before visual`);
              }

              if(width===430){
                const targetDomain=await tabs.nth(0).getAttribute('data-domain');
                await tabs.nth(0).click();
                await page.waitForFunction(expected=>{
                  const root=document.querySelector('#domains');
                  const selected=root?.querySelector('.domain-tab[aria-selected="true"]');
                  const active=root?.querySelectorAll('.domain-project-card-v2[data-wheel-offset="0"]');
                  const visual=active?.length===1?active[0].querySelector('.domain-project-card-v2__visual'):null;
                  return selected?.getAttribute('data-domain')===expected&&active?.length===1&&Boolean(visual?.isConnected);
                },targetDomain);
                await page.evaluate(()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve))));
                const activeCard=domain.locator('.domain-project-card-v2[data-wheel-offset="0"]');
                if(await domain.locator('.domain-project-card-v2').count()>1){
                  const firstProject=await activeCard.getAttribute('data-project');
                  const visual=activeCard.locator('.domain-project-card-v2__visual');
                  await visual.evaluate(node=>node.scrollIntoView({block:'center',inline:'nearest'}));
                  await page.waitForTimeout(60);
                  const vb=await visual.boundingBox();
                  assert(vb,'Home 430: swipe visual missing');
                  const cy=vb.y+vb.height*.5,sx=vb.x+vb.width*.68,ex=vb.x+vb.width*.32;
                  const hit=await page.evaluate(({x,y})=>{const node=document.elementFromPoint(x,y);return{project:node?.closest('.domain-project-card-v2')?.getAttribute('data-project')||'',visual:Boolean(node?.closest('.domain-project-card-v2__visual'))}},{x:sx,y:cy});
                  assert(hit.project===firstProject&&hit.visual,`Home 430: swipe start misses active visual ${JSON.stringify(hit)}`);
                  await page.mouse.move(sx,cy);await page.mouse.down();await page.mouse.move(ex,cy,{steps:8});await page.mouse.up();await page.waitForTimeout(80);
                  assert(await domain.locator('.domain-project-card-v2[data-wheel-offset="0"]').getAttribute('data-project')!==firstProject,'Home 430: swipe failed');
                }
              }
              assert(await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth)<=1,`Home ${width}: horizontal overflow`);
              report.domain[width]={tabLabels};
              await domain.screenshot({path:path.join(out,`domain-${width}.png`)});

              response=await page.goto(`${base}/site/work.html`,{waitUntil:'networkidle'});
              assert(response?.ok(),`Work ${width}: HTTP ${response?.status()}`);
              await page.waitForSelector('.work-index',{timeout:10000});
              await page.waitForFunction(()=>{const imgs=[...document.querySelectorAll('.work-index-card__visual img')];return imgs.length===5&&imgs.every(img=>img.complete&&img.naturalWidth>0)},{timeout:10000});
              const work=page.locator('.work-index');
              const filters=(await work.locator('.work-index-filter').allTextContents()).map(clean);
              assert(JSON.stringify(filters)===JSON.stringify(['All','Transactions','Operations','Incentives','0→1','Connected journeys']),`Work ${width}: taxonomy ${JSON.stringify(filters)}`);

              const leadPair=work.locator('.work-index__featured > .work-index-card');
              const medium=work.locator('.work-index__featured-secondary-row .work-index-card--half');
              const selected=work.locator('.work-index__featured .work-index-card');
              const more=work.locator('.work-index__more-grid .work-index-card--compact');
              const allCards=work.locator('.work-index-card');
              assert(await leadPair.count()===2,`Work ${width}: expected 2 lead cards`);
              assert(await medium.count()===2,`Work ${width}: expected 2 medium Selected Work cards`);
              assert(await selected.count()===4,`Work ${width}: expected 4 Selected Work cards`);
              assert(await more.count()===1,`Work ${width}: expected 1 More Work card`);
              assert(await allCards.count()===5,`Work ${width}: expected 5 total work cards`);

              for(let i=0;i<await allCards.count();i++){
                const card=allCards.nth(i);
                const type=card.locator('.work-index-card__type');
                const identity=card.locator('.work-index-card__identity');
                const [tb,ib]=await Promise.all([type.boundingBox(),identity.boundingBox()]);
                assert(tb&&ib&&ib.y>=tb.y+tb.height-1&&Math.abs(ib.x-tb.x)<=2,`Work ${width}: card ${i+1} metadata must stack TYPE then COMPANY · YEAR`);
                const titleMax=await card.locator('.work-index-card__title').evaluate(n=>getComputedStyle(n).maxWidth);
                assert(titleMax==='none',`Work ${width}: card ${i+1} title max-width ${titleMax}`);
                const cardBox=await card.boundingBox(),buttonBox=await card.locator('.work-index-card__button').boundingBox(),ctaBox=await card.locator('.work-index-card__cta').boundingBox();
                assert(cardBox&&buttonBox&&Math.abs(cardBox.width-buttonBox.width)<=2&&Math.abs(cardBox.height-buttonBox.height)<=2,`Work ${width}: card ${i+1} target area`);
                assert(boxInside(ctaBox,cardBox,2),`Work ${width}: card ${i+1} CTA clipped`);
                const labels=(await card.locator('.work-index-card__metric-label').allTextContents()).map(clean);
                assertProofLabels(labels,`Work ${width}: card ${i+1}`);
              }

              const hero=leadPair.nth(0),secondary=leadPair.nth(1);
              if(width===1419){
                const [h,s,m1,m2,c]=await Promise.all([hero.boundingBox(),secondary.boundingBox(),medium.nth(0).boundingBox(),medium.nth(1).boundingBox(),more.nth(0).boundingBox()]);
                assert(h&&s&&Math.abs(h.y-s.y)<=2&&Math.abs(h.height-s.height)<=2,`Work 1419: lead cards must align and match height`);
                assert(h.width>s.width*1.6,`Work 1419: primary card must be clearly wider ${h.width}/${s.width}`);
                assert(c&&Math.abs(s.width-c.width)<=40,`Work 1419: secondary width must approximate More Work card ${s.width}/${c.width}`);
                assert(m1&&m2&&Math.abs(m1.y-m2.y)<=2&&Math.abs(m1.height-m2.height)<=2,`Work 1419: medium cards must align and match height`);
                assert(!await stacked(hero),'Work 1419: hero must remain horizontal');
                assert(await stacked(secondary),'Work 1419: secondary must remain stacked');
              }else{
                assert(await stacked(hero),`Work ${width}: hero must stack`);
                assert(await stacked(secondary),`Work ${width}: secondary must stack`);
              }
              if(width===430){
                for(let i=0;i<await medium.count();i++) assert(await stacked(medium.nth(i)),`Work 430: medium ${i+1} must stack`);
              }

              await page.mouse.move(1,1);await page.waitForTimeout(50);
              const before=await hero.evaluate(card=>({i:getComputedStyle(card.querySelector('.work-index-card__image')).transform,a:getComputedStyle(card.querySelector('.work-index-card__cta-arrow')).transform}));
              await hero.hover();await page.waitForTimeout(320);
              const after=await hero.evaluate(card=>({i:getComputedStyle(card.querySelector('.work-index-card__image')).transform,a:getComputedStyle(card.querySelector('.work-index-card__cta-arrow')).transform}));
              assert(before.i!==after.i&&before.a!==after.a,`Work ${width}: hover motion missing`);
              await work.locator('[data-work-index-filter="operations"]').click();
              assert(await work.locator('.work-index-card[data-work-categories~="operations"]:not([hidden])').count()>=1,`Work ${width}: Operations filter empty`);
              await work.locator('[data-work-index-filter="all"]').click();
              assert(await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth)<=1,`Work ${width}: horizontal overflow`);
              report.work[width]={filters,lead:2,medium:2,selected:4,more:1};
              await work.screenshot({path:path.join(out,`work-${width}.png`)});
              await context.close();
            }

            {
              const context=await browser.newContext({viewport:{width:1419,height:1100}}),page=await context.newPage();
              const response=await page.goto(`${base}/site/experiments.html?experiment=daily-hours`,{waitUntil:'networkidle'});
              assert(response?.ok(),'Daily Hours experiment route failed');
              assert(await page.evaluate(()=>new URL(location.href).searchParams.get('experiment'))==='daily-hours','Daily Hours query lost');
              await page.waitForFunction(()=>document.body.innerText.includes('Daily Hours'),null,{timeout:10000});
              report.routes['daily-hours']={status:response.status()};
              await context.close();
            }
            for(const slug of ['payment','dbs']){
              const context=await browser.newContext({viewport:{width:1419,height:1100}}),page=await context.newPage();
              const response=await page.goto(`${base}/site/work/${slug}.html`,{waitUntil:'networkidle'});
              assert(response?.ok(),`${slug}: route failed`);
              const canonical=await page.locator('link[rel="canonical"]').getAttribute('href');
              assert(canonical?.endsWith(`/work/${slug}`),`${slug}: canonical mismatch`);
              report.routes[slug]={status:response.status(),canonical};
              await context.close();
            }
            const cathayRoutes={
              'cathay-mortgage-assistant':'Rigid scripts to flexible mortgage consultation',
              'cathay-sit-review-remediation-operations':'Interface issues to prioritised remediation',
              'cathay-sit-online-account-opening':'Fragmented steps to end-to-end account opening'
            };
            for(const [slug,expectedTitle] of Object.entries(cathayRoutes)){
              const context=await browser.newContext({viewport:{width:430,height:1000}}),page=await context.newPage();
              const response=await page.goto(`${base}/site/work/${slug}.html`,{waitUntil:'networkidle'});
              assert(response?.ok(),`${slug}: route failed`);
              const identity=await page.evaluate(()=>({body:document.body.innerText,canonical:document.querySelector('link[rel="canonical"]')?.href||''}));
              assert(identity.canonical.endsWith(`/work/${slug}`),`${slug}: canonical mismatch`);
              assert(identity.body.includes(expectedTitle)&&identity.body.includes('Cathay'),`${slug}: visible canonical content drift`);
              report.routes[slug]={status:response.status(),canonical:identity.canonical,expectedTitle};
              await context.close();
            }
            assert(report.consoleErrors.length===0,`Console/page errors: ${JSON.stringify(report.consoleErrors)}`);
          }catch(error){report.failure={message:error.message,stack:error.stack};throw error}
          finally{fs.writeFileSync(path.join(out,'qa-report.json'),JSON.stringify(report,null,2));await browser.close()}
          NODE

      - name: Upload Human review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: style-b-domain-work-human-contract
          path: artifacts/style-b-domain-work-human-contract
          retention-days: 3