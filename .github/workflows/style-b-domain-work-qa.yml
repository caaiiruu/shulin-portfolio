name: Style B Domain Work Human Contract QA

on:
  push:
    branches: [migration/style-b-domain-work-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify isolated baseline and denylist
        run: |
          set -euo pipefail
          BASE=05291a4ba071d00d0098f227ea08069c774cb422
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --check "$BASE"...HEAD
          git diff --name-only "$BASE"...HEAD | tee /tmp/changed.txt
          ! grep -Fxq 'public/site/assets/js/app.js' /tmp/changed.txt
          ! grep -Fxq 'public/site/content/portfolio-content.json' /tmp/changed.txt
          ! grep -Fxq 'public/site/assets/css/components/project-card.css' /tmp/changed.txt
          ! grep -Fxq 'scripts/build-production-assets.mjs' /tmp/changed.txt
          ! grep -Fxq 'scripts/generate-project-pages.mjs' /tmp/changed.txt
          ! grep -E '^public/site/assets/projects/daily-hours/' /tmp/changed.txt
          ! grep -Fxq 'public/site/assets/css/components/project-detail-overview.css' /tmp/changed.txt
          git diff --quiet "$BASE"...HEAD -- public/site/assets/css/components/domain-selector.css
          ! grep -q 'related-project-card' public/site/assets/css/components/domain-experience.css

      - name: Install build and validate source
        run: |
          npm run install:ci
          npm run build
          npm test

      - name: Install browser QA dependencies
        working-directory: public/site/qa
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start static QA server
        run: |
          PORT=4173 node tests/portfolio-static-server.mjs >/tmp/style-b-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/site/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/style-b-server.log
          exit 1

      - name: Run latest Human contract browser QA
        working-directory: public/site/qa
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          import fs from 'node:fs';
          import path from 'node:path';

          const out=path.join(process.env.GITHUB_WORKSPACE,'artifacts/style-b-domain-work-human-contract');
          fs.mkdirSync(out,{recursive:true});
          const base='http://127.0.0.1:4173';
          const widths=[1419,871,430];
          const browser=await chromium.launch({headless:true});
          const report={domain:{},work:{},routes:{},consoleErrors:[]};
          const assert=(value,message)=>{if(!value)throw new Error(message)};
          const clean=value=>String(value||'').replace(/\s+/g,' ').trim();
          const isWhite=value=>/rgba?\(\s*255\s*,\s*255\s*,\s*255/i.test(value||'');

          try{
            for(const width of widths){
              const context=await browser.newContext({viewport:{width,height:1100},reducedMotion:'no-preference'});
              const page=await context.newPage();
              page.on('console',m=>{if(m.type()==='error')report.consoleErrors.push({width,url:page.url(),text:m.text()})});
              page.on('pageerror',e=>report.consoleErrors.push({width,url:page.url(),text:e.message}));

              let response=await page.goto(`${base}/site/index.html`,{waitUntil:'networkidle'});
              assert(response?.ok(),`Home ${width}: HTTP ${response?.status()}`);
              const domain=page.locator('#domains');
              await domain.scrollIntoViewIfNeeded();
              await page.waitForFunction(()=>document.querySelector('#domains')?.dataset.domainGoldenReferenceMounted==='true');
              await page.waitForSelector('#domains .domain-project-card-v2[data-wheel-offset="0"]');

              const tabs=domain.locator('.domain-tab');
              assert(await tabs.count()===6,`Home ${width}: expected 6 Domain tabs`);
              assert(await domain.locator('.domain-tab__icon svg').count()===6,`Home ${width}: all Domain tabs require icons`);
              const iconStates=await domain.locator('.domain-tab__icon').evaluateAll(nodes=>nodes.map(n=>{const s=getComputedStyle(n);return{display:s.display,visibility:s.visibility,opacity:Number(s.opacity),w:n.getBoundingClientRect().width,h:n.getBoundingClientRect().height}}));
              assert(iconStates.every(x=>x.display!=='none'&&x.visibility!=='hidden'&&x.opacity>0&&x.w>0&&x.h>0),`Home ${width}: Domain icons not rendered ${JSON.stringify(iconStates)}`);
              const tabLabels=(await domain.locator('.domain-tab__label').allTextContents()).map(clean);
              assert(tabLabels.length===6&&tabLabels.every(Boolean),`Home ${width}: Domain labels missing`);
              assert(!tabLabels.some(x=>/^all$/i.test(x)),`Home ${width}: unexpected All tab`);

              const viewport=await page.evaluate(()=>document.documentElement.clientWidth);
              const wheel=domain.locator('.domain-wheel-v2');
              const wheelBox=await wheel.boundingBox();
              assert(wheelBox&&Math.abs(wheelBox.width-viewport)<=2,`Home ${width}: wheel not full bleed ${wheelBox?.width}/${viewport}`);
              assert(Math.abs(wheelBox.x)<=2,`Home ${width}: wheel x ${wheelBox?.x}`);

              const disclosures=domain.locator('details.domain-experience-disclosure');
              assert(await disclosures.count()===2,`Home ${width}: disclosure count`);
              for(const d of await disclosures.all())assert(!(await d.getAttribute('open')),`Home ${width}: disclosure default open`);
              assert(await domain.locator('.domain-experience__project-heading:visible').count()===0,`Home ${width}: Related Work heading visible`);

              const verifyActive=async(label)=>{
                const active=domain.locator('.domain-project-card-v2[data-wheel-offset="0"]');
                assert(await active.count()===1,`${label}: exactly one active card required`);
                assert(clean(await active.locator('.domain-project-card-v2__title').textContent()).length>8,`${label}: title missing`);
                assert(await active.locator('.domain-project-card-v2__support').count()===0,`${label}: removed supporting sentence returned`);
                const href=await active.locator('.domain-project-card-v2__cta').getAttribute('href');
                assert(href?.startsWith('/work/'),`${label}: CTA missing`);
                const image=active.locator('.domain-project-card-v2__image');
                assert(await image.count()===1,`${label}: temporary visual missing`);
                assert(await image.evaluate(img=>img.complete&&img.naturalWidth>0&&img.naturalHeight>0),`${label}: visual not decoded`);
                const values=active.locator('.domain-project-card-v2__metric-value');
                const labels=active.locator('.domain-project-card-v2__metric-label');
                const count=await values.count();
                assert(count>=1&&count<=3,`${label}: metric count ${count}`);
                assert(await labels.count()===count,`${label}: metric mismatch`);
                const labelText=(await labels.allTextContents()).map(clean);
                assert(labelText.every(x=>x.split(/\s+/).filter(Boolean).length<=2),`${label}: metric labels too long ${JSON.stringify(labelText)}`);
                const valueTops=await values.evaluateAll(nodes=>nodes.map(n=>n.getBoundingClientRect().top));
                const labelTops=await labels.evaluateAll(nodes=>nodes.map(n=>n.getBoundingClientRect().top));
                assert(Math.max(...valueTops)-Math.min(...valueTops)<=2,`${label}: metric values not horizontal`);
                assert(Math.max(...labelTops)-Math.min(...labelTops)<=2,`${label}: metric labels not horizontal`);
                const state=await active.evaluate(card=>{
                  const content=card.querySelector('.domain-project-card-v2__content');
                  const visual=card.querySelector('.domain-project-card-v2__visual');
                  const cta=card.querySelector('.domain-project-card-v2__cta');
                  const value=card.querySelector('.domain-project-card-v2__metric-value');
                  const metricLabel=card.querySelector('.domain-project-card-v2__metric-label');
                  const meta=card.querySelector('.domain-project-card-v2__meta');
                  const metrics=card.querySelector('.domain-project-card-v2__metrics');
                  const title=card.querySelector('.domain-project-card-v2__title');
                  const cr=content.getBoundingClientRect(),vr=visual.getBoundingClientRect(),tr=cta.getBoundingClientRect(),mr=metrics.getBoundingClientRect(),tir=title.getBoundingClientRect();
                  const ms=getComputedStyle(metrics),vs=getComputedStyle(visual);
                  return{bg:getComputedStyle(content).backgroundColor,valueSize:parseFloat(getComputedStyle(value).fontSize),labelSize:parseFloat(getComputedStyle(metricLabel).fontSize),metaSize:parseFloat(getComputedStyle(meta).fontSize),contentLeft:cr.left,contentRight:cr.right,contentBottom:cr.bottom,visualLeft:vr.left,visualTop:vr.top,visualWidth:vr.width,visualHeight:vr.height,ctaLeft:tr.left,ctaRight:tr.right,metricsTop:mr.top,titleBottom:tir.bottom,metricBorderTop:parseFloat(ms.borderTopWidth)||0,visualRatio:vr.height?vr.width/vr.height:0,visualObjectFit:vs.objectFit};
                });
                assert(!isWhite(state.bg),`${label}: project tint missing`);
                assert(state.valueSize>state.labelSize,`${label}: metric hierarchy invalid`);
                assert(Math.abs(state.ctaLeft-state.contentLeft)<=30&&Math.abs(state.ctaRight-state.contentRight)<=30,`${label}: CTA width mismatch`);
                if(width===430){
                  assert(Math.abs(state.metaSize-state.labelSize)<=0.5,`${label}: mobile meta size ${state.metaSize}/${state.labelSize}`);
                  assert(state.metricBorderTop===0,`${label}: mobile metrics top divider returned`);
                  assert(state.metricsTop>state.titleBottom,`${label}: mobile metrics not below title`);
                  assert(state.visualRatio>=1.72&&state.visualRatio<=1.84,`${label}: mobile visual ratio ${state.visualRatio}`);
                }
                return {active,state};
              };

              const {active,state}=await verifyActive(`Home ${width}`);
              assert(await domain.locator('.domain-project-card-v2[data-wheel-offset="-1"]').count()===1,`Home ${width}: previous card missing`);
              assert(await domain.locator('.domain-project-card-v2[data-wheel-offset="1"]').count()===1,`Home ${width}: next card missing`);
              assert(Number(await active.getAttribute('tabindex'))>=0,`Home ${width}: active not keyboard target`);

              const box=await active.boundingBox();
              if(width===1419){assert(Math.abs(box.width-1120)<=3&&Math.abs(box.height-430)<=3,`Home 1419: card geometry ${box.width}x${box.height}`)}
              else if(width===871){assert(box.width>=716&&box.width<=734&&box.height>=440&&box.height<=460,`Home 871: card geometry ${box.width}x${box.height}`)}
              else{assert(box.width>=330&&box.width<=338&&Math.abs(box.height-576)<=3,`Home 430: card geometry ${box.width}x${box.height}`)}
              if(width===1419||width===871)assert(Math.abs(state.visualLeft-state.contentRight)<=2,`Home ${width}: horizontal billboard regressed`);
              else assert(Math.abs(state.visualTop-state.contentBottom)<=2,`Home 430: visual must follow content`);

              const controls=domain.locator('.domain-wheel-v2__control');
              if(width>600){
                const controlBoxes=await controls.evaluateAll(nodes=>nodes.map(n=>{const r=n.getBoundingClientRect();return{x:r.x,y:r.y,w:r.width,h:r.height,cx:r.left+r.width/2}}));
                assert(controlBoxes.length===2&&controlBoxes.every(b=>b.w>=44&&b.h>=44),`Home ${width}: controls below 44x44`);
                const cardCenter=box.x+box.width/2;
                const leftDistance=cardCenter-controlBoxes[0].cx;
                const rightDistance=controlBoxes[1].cx-cardCenter;
                assert(Math.abs(leftDistance-rightDistance)<=3,`Home ${width}: controls asymmetric ${leftDistance}/${rightDistance}`);
              }else{
                assert(await domain.locator('.domain-wheel-v2__control:visible').count()===0,`Home 430: wheel controls must be hidden`);
              }

              await page.mouse.move(1,1);await page.waitForTimeout(50);
              const before=await active.evaluate(card=>{const image=getComputedStyle(card.querySelector('.domain-project-card-v2__image')).transform;const arrow=getComputedStyle(card.querySelector('.domain-project-card-v2__cta-arrow')).transform;const m=new DOMMatrix(arrow==='none'?undefined:arrow);return{image,arrow,m11:m.m11,m12:m.m12,m21:m.m21,m22:m.m22,x:m.m41,y:m.m42}});
              await active.hover();await page.waitForTimeout(320);
              const after=await active.evaluate(card=>{const image=getComputedStyle(card.querySelector('.domain-project-card-v2__image')).transform;const arrow=getComputedStyle(card.querySelector('.domain-project-card-v2__cta-arrow')).transform;const m=new DOMMatrix(arrow==='none'?undefined:arrow);return{image,arrow,m11:m.m11,m12:m.m12,m21:m.m21,m22:m.m22,x:m.m41,y:m.m42}});
              assert(before.image!==after.image,`Home ${width}: image hover motion missing`);
              assert(after.x>before.x+1&&Math.abs(after.y-before.y)<1,`Home ${width}: CTA arrow must move right only ${before.x},${before.y} -> ${after.x},${after.y}`);
              assert(Math.abs(after.m11-before.m11)<0.02&&Math.abs(after.m12-before.m12)<0.02&&Math.abs(after.m21-before.m21)<0.02&&Math.abs(after.m22-before.m22)<0.02,`Home ${width}: CTA arrow direction changed on hover`);

              const firstProject=await active.getAttribute('data-project');
              if(width>600){
                await controls.nth(1).click();
                const moved=domain.locator('.domain-project-card-v2[data-wheel-offset="0"]');
                assert(await moved.getAttribute('data-project')!==firstProject,`Home ${width}: next control failed`);
                await moved.focus();await page.keyboard.press('ArrowLeft');
                assert(await domain.locator('.domain-project-card-v2[data-wheel-offset="0"]').getAttribute('data-project')===firstProject,`Home ${width}: keyboard failed`);
              }else{
                const wheelBoxForDrag=await wheel.boundingBox();
                const cy=wheelBoxForDrag.y+Math.min(wheelBoxForDrag.height/2,300);
                const startX=wheelBoxForDrag.x+wheelBoxForDrag.width*.68;
                const endX=wheelBoxForDrag.x+wheelBoxForDrag.width*.32;
                await page.mouse.move(startX,cy);await page.mouse.down();await page.mouse.move(endX,cy,{steps:6});await page.mouse.up();
                assert(await domain.locator('.domain-project-card-v2[data-wheel-offset="0"]').getAttribute('data-project')!==firstProject,`Home 430: swipe failed`);
              }

              for(let i=0;i<await tabs.count();i++){
                await tabs.nth(i).click();
                await page.waitForFunction(index=>document.querySelectorAll('.domain-tab')[index]?.getAttribute('aria-selected')==='true',i);
                await page.waitForFunction(()=>document.querySelectorAll('#domains .domain-project-card-v2[data-wheel-offset="0"]').length===1);
                await verifyActive(`Home ${width} Domain tab ${i+1}`);
                for(const d of await disclosures.all())assert(!(await d.getAttribute('open')),`Home ${width}: disclosure reopened on tab ${i+1}`);
              }

              assert(await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth)<=1,`Home ${width}: horizontal overflow`);
              report.domain[width]={viewport,wheelWidth:wheelBox.width,wheelX:wheelBox.x,cardWidth:box.width,cardHeight:box.height,tabLabels};
              await domain.screenshot({path:path.join(out,`domain-${width}.png`)});

              response=await page.goto(`${base}/site/work.html`,{waitUntil:'networkidle'});
              assert(response?.ok(),`Work ${width}: HTTP ${response?.status()}`);
              await page.waitForSelector('.work-index',{timeout:10000});
              await page.waitForFunction(()=>{const imgs=[...document.querySelectorAll('.work-index-card__visual img')];return imgs.length===5&&imgs.every(img=>img.complete&&img.naturalWidth>0&&img.naturalHeight>0)},{timeout:10000});
              const work=page.locator('.work-index');
              const filters=(await work.locator('.work-index-filter').allTextContents()).map(clean);
              assert(JSON.stringify(filters)===JSON.stringify(['All','Transactions','Operations','Incentives','0→1','Connected journeys']),`Work ${width}: taxonomy ${JSON.stringify(filters)}`);
              const featured=work.locator('.work-index__featured .work-index-card');
              assert(await featured.count()===4,`Work ${width}: expected 4 featured cards`);
              const expected=[3,2,2,2];
              for(let i=0;i<4;i++){
                const card=featured.nth(i),cardBox=await card.boundingBox(),buttonBox=await card.locator('.work-index-card__button').boundingBox();
                assert(cardBox&&buttonBox&&Math.abs(cardBox.width-buttonBox.width)<=2&&Math.abs(cardBox.height-buttonBox.height)<=2,`Work ${width}: card ${i+1} target area`);
                assert(await card.locator('.work-index-card__metric').count()===expected[i],`Work ${width}: card ${i+1} metric count`);
                const metricLabels=(await card.locator('.work-index-card__metric-label').allTextContents()).map(clean);
                assert(metricLabels.every(x=>x.split(/\s+/).filter(Boolean).length<=2),`Work ${width}: card ${i+1} long metric labels`);
                const tops=await card.locator('.work-index-card__metric').evaluateAll(nodes=>nodes.map(n=>n.getBoundingClientRect().top));
                assert(Math.max(...tops)-Math.min(...tops)<=2,`Work ${width}: card ${i+1} metrics not horizontal`);
                const visual=card.locator('.work-index-card__visual img');
                assert(await visual.count()===1&&await visual.evaluate(img=>img.complete&&img.naturalWidth>0),`Work ${width}: card ${i+1} visual missing`);
                const typ=await card.evaluate(node=>({bg:getComputedStyle(node.querySelector('.work-index-card__content')).backgroundColor,v:parseFloat(getComputedStyle(node.querySelector('.work-index-card__metric-value')).fontSize),l:parseFloat(getComputedStyle(node.querySelector('.work-index-card__metric-label')).fontSize)}));
                assert(!isWhite(typ.bg)&&typ.v>typ.l,`Work ${width}: card ${i+1} hierarchy/tint`);
                if(width<=1100){const geo=await card.evaluate(node=>{const c=node.querySelector('.work-index-card__content').getBoundingClientRect(),v=node.querySelector('.work-index-card__visual').getBoundingClientRect();return{cb:c.bottom,vt:v.top}});assert(geo.vt>=geo.cb-2,`Work ${width}: card ${i+1} must stack`)}
              }
              await page.mouse.move(1,1);await page.waitForTimeout(50);
              const hero=featured.nth(0);
              const workBefore=await hero.evaluate(card=>({i:getComputedStyle(card.querySelector('.work-index-card__image')).transform,a:getComputedStyle(card.querySelector('.work-index-card__cta-arrow')).transform}));
              await hero.hover();await page.waitForTimeout(320);
              const workAfter=await hero.evaluate(card=>({i:getComputedStyle(card.querySelector('.work-index-card__image')).transform,a:getComputedStyle(card.querySelector('.work-index-card__cta-arrow')).transform}));
              assert(workBefore.i!==workAfter.i&&workBefore.a!==workAfter.a,`Work ${width}: hover motion missing`);
              const more=work.locator('.work-index__more-grid .work-index-card');
              assert(await more.count()>=1,`Work ${width}: More Work empty`);
              for(let i=0;i<await more.count();i++)assert(await more.nth(i).locator('.work-index-card__metric').count()===1,`Work ${width}: More Work ${i+1} metric count`);
              await work.locator('[data-work-index-filter="operations"]').click();
              assert(await work.locator('.work-index-card[data-work-categories~="operations"]:not([hidden])').count()>=1,`Work ${width}: Operations filter empty`);
              await work.locator('[data-work-index-filter="all"]').click();
              assert(await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth)<=1,`Work ${width}: horizontal overflow`);
              report.work[width]={filters};
              await work.screenshot({path:path.join(out,`work-${width}.png`)});
              await context.close();
            }

            {
              const context=await browser.newContext({viewport:{width:1419,height:1100}}),page=await context.newPage();
              const response=await page.goto(`${base}/site/experiments.html?experiment=daily-hours`,{waitUntil:'networkidle'});
              assert(response?.ok(),'Daily Hours experiment route failed');
              assert(await page.evaluate(()=>new URL(location.href).searchParams.get('experiment'))==='daily-hours','Daily Hours query lost');
              await page.waitForFunction(()=>document.body.innerText.includes('Daily Hours'),null,{timeout:10000});
              report.routes['daily-hours']={status:response.status()};
              await context.close();
            }
            for(const slug of ['payment','dbs']){
              const context=await browser.newContext({viewport:{width:1419,height:1100}}),page=await context.newPage();
              const response=await page.goto(`${base}/site/work/${slug}.html`,{waitUntil:'networkidle'});
              assert(response?.ok(),`${slug}: route failed`);
              const identity=await page.evaluate(()=>({title:document.title,canonical:document.querySelector('link[rel="canonical"]')?.href||''}));
              assert(identity.canonical.endsWith(`/work/${slug}`),`${slug}: canonical mismatch`);
              assert(identity.title.length>10&&!/404|not found/i.test(identity.title),`${slug}: title invalid`);
              report.routes[slug]={status:response.status(),...identity};
              await context.close();
            }
            assert(report.consoleErrors.length===0,`Console/page errors: ${JSON.stringify(report.consoleErrors)}`);
          }catch(error){report.failure={message:error.message,stack:error.stack};throw error}
          finally{fs.writeFileSync(path.join(out,'qa-report.json'),JSON.stringify(report,null,2));await browser.close()}
          NODE

      - name: Upload Human review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: style-b-domain-work-human-contract
          path: artifacts/style-b-domain-work-human-contract
          retention-days: 3
