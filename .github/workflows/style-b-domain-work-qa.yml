name: Style B Domain Work Human Contract QA

on:
  push:
    branches: [migration/style-b-domain-work-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify isolated baseline and denylist
        run: |
          set -euo pipefail
          BASE=05291a4ba071d00d0098f227ea08069c774cb422
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --check "$BASE"...HEAD
          git diff --name-only "$BASE"...HEAD | tee /tmp/changed.txt
          ! grep -Fxq 'public/site/assets/js/app.js' /tmp/changed.txt
          ! grep -Fxq 'public/site/content/portfolio-content.json' /tmp/changed.txt
          ! grep -Fxq 'public/site/assets/css/components/project-card.css' /tmp/changed.txt
          ! grep -Fxq 'scripts/build-production-assets.mjs' /tmp/changed.txt
          ! grep -Fxq 'scripts/generate-project-pages.mjs' /tmp/changed.txt
          ! grep -E '^public/site/assets/projects/daily-hours/' /tmp/changed.txt
          ! grep -Fxq 'public/site/assets/css/components/project-detail-overview.css' /tmp/changed.txt
          git diff --quiet "$BASE"...HEAD -- public/site/assets/css/components/domain-selector.css
          ! grep -q 'related-project-card' public/site/assets/css/components/domain-experience.css

      - name: Install build and validate source
        run: |
          npm run install:ci
          npm run build
          npm test

      - name: Install browser QA dependencies
        working-directory: public/site/qa
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start static QA server
        run: |
          PORT=4173 node tests/portfolio-static-server.mjs >/tmp/style-b-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/site/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/style-b-server.log
          exit 1

      - name: Run Human contract browser QA
        working-directory: public/site/qa
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          import fs from 'node:fs';
          import path from 'node:path';

          const out=path.join(process.env.GITHUB_WORKSPACE,'artifacts/style-b-domain-work-human-contract');
          fs.mkdirSync(out,{recursive:true});
          const base='http://127.0.0.1:4173';
          const widths=[1419,871,430];
          const browser=await chromium.launch({headless:true});
          const report={domain:{},work:{},routes:{},consoleErrors:[]};
          const assert=(value,message)=>{if(!value)throw new Error(message)};
          const clean=value=>String(value||'').replace(/\s+/g,' ').trim();
          const isWhite=value=>/rgba?\(\s*255\s*,\s*255\s*,\s*255/i.test(value||'');

          try{
            for(const width of widths){
              const context=await browser.newContext({viewport:{width,height:1100},reducedMotion:'no-preference'});
              const page=await context.newPage();
              page.on('console',m=>{if(m.type()==='error')report.consoleErrors.push({width,url:page.url(),text:m.text()})});
              page.on('pageerror',e=>report.consoleErrors.push({width,url:page.url(),text:e.message}));

              let response=await page.goto(`${base}/site/index.html`,{waitUntil:'networkidle'});
              assert(response?.ok(),`Home ${width}: HTTP ${response?.status()}`);
              const domain=page.locator('#domains');
              await domain.scrollIntoViewIfNeeded();
              await page.waitForFunction(()=>document.querySelector('#domains')?.dataset.domainGoldenReferenceMounted==='true');
              await page.waitForSelector('#domains .domain-project-card-v2[data-wheel-offset="0"]');

              const tabs=domain.locator('.domain-tab');
              assert(await tabs.count()===6,`Home ${width}: expected 6 Domain tabs`);
              assert(await domain.locator('.domain-tab__icon svg').count()===6,`Home ${width}: all Domain tabs require icons`);
              const tabLabels=(await domain.locator('.domain-tab__label').allTextContents()).map(clean);
              assert(tabLabels.length===6&&tabLabels.every(x=>x.length>2),`Home ${width}: Domain labels missing`);
              assert(!tabLabels.some(x=>/^all$/i.test(x)),`Home ${width}: unexpected All Domain tab`);

              const layoutViewportWidth=await page.evaluate(()=>document.documentElement.clientWidth);
              const wheel=domain.locator('.domain-wheel-v2');
              const wheelBox=await wheel.boundingBox();
              assert(wheelBox&&Math.abs(wheelBox.width-layoutViewportWidth)<=2,`Home ${width}: wheel not full bleed (${wheelBox?.width} vs ${layoutViewportWidth})`);
              assert(Math.abs(wheelBox.x)<=2,`Home ${width}: wheel not aligned to viewport edge (${wheelBox?.x})`);

              const disclosures=domain.locator('details.domain-experience-disclosure');
              assert(await disclosures.count()===2,`Home ${width}: expected two disclosures`);
              for(const d of await disclosures.all())assert(!(await d.getAttribute('open')),`Home ${width}: disclosures must default closed`);
              assert(await domain.locator('.domain-experience__project-heading:visible').count()===0,`Home ${width}: Related Work heading visible`);

              const active=domain.locator('.domain-project-card-v2[data-wheel-offset="0"]');
              assert(await active.count()===1,`Home ${width}: exactly one active card required`);
              assert(await domain.locator('.domain-project-card-v2[data-wheel-offset="-1"]').count()===1,`Home ${width}: previous side card missing`);
              assert(await domain.locator('.domain-project-card-v2[data-wheel-offset="1"]').count()===1,`Home ${width}: next side card missing`);
              assert(Number(await active.getAttribute('tabindex'))>=0,`Home ${width}: keyboard target missing`);
              assert(await active.locator('.domain-project-card-v2__support').count()===1,`Home ${width}: supporting sentence missing`);
              assert(clean(await active.locator('.domain-project-card-v2__support').textContent()).length>8,`Home ${width}: supporting sentence empty`);
              assert(await active.locator('.domain-project-card-v2__cta').getAttribute('href'),`Home ${width}: CTA link missing`);

              const values=active.locator('.domain-project-card-v2__metric-value');
              const labelsLocator=active.locator('.domain-project-card-v2__metric-label');
              const metricCount=await values.count();
              assert(metricCount>=1&&metricCount<=3,`Home ${width}: invalid metric count ${metricCount}`);
              assert(await labelsLocator.count()===metricCount,`Home ${width}: metric values/labels mismatch`);
              assert(await active.locator('.domain-project-card-v2__metrics > div').count()===0,`Home ${width}: metric wrapper contract regressed`);
              const labels=(await labelsLocator.allTextContents()).map(clean);
              assert(labels.every(x=>x.split(/\s+/).filter(Boolean).length<=2),`Home ${width}: metric labels too long ${JSON.stringify(labels)}`);
              const valueTops=await values.evaluateAll(nodes=>nodes.map(node=>node.getBoundingClientRect().top));
              const labelTops=await labelsLocator.evaluateAll(nodes=>nodes.map(node=>node.getBoundingClientRect().top));
              assert(Math.max(...valueTops)-Math.min(...valueTops)<=2,`Home ${width}: values must share one row`);
              assert(Math.max(...labelTops)-Math.min(...labelTops)<=2,`Home ${width}: labels must share one row`);

              const activeBox=await active.boundingBox();
              assert(activeBox,`Home ${width}: active card box missing`);
              if(width===1419){
                assert(Math.abs(activeBox.width-1120)<=3,`Home 1419: card width ${activeBox.width} not ~1120`);
                assert(Math.abs(activeBox.height-430)<=3,`Home 1419: card height ${activeBox.height} not ~430`);
              }else if(width===871){
                assert(activeBox.width>=716&&activeBox.width<=734,`Home 871: card width ${activeBox.width} outside reference range`);
                assert(activeBox.height>=440&&activeBox.height<=460,`Home 871: card height ${activeBox.height} outside reference range`);
              }else{
                assert(activeBox.width>=330&&activeBox.width<=338,`Home 430: card width ${activeBox.width} not ~334`);
                assert(Math.abs(activeBox.height-640)<=3,`Home 430: card height ${activeBox.height} not ~640`);
              }

              const domainState=await active.evaluate(card=>{
                const content=card.querySelector('.domain-project-card-v2__content');
                const visual=card.querySelector('.domain-project-card-v2__visual');
                const cta=card.querySelector('.domain-project-card-v2__cta');
                const cr=content.getBoundingClientRect();
                const vr=visual.getBoundingClientRect();
                const tr=cta.getBoundingClientRect();
                return{bg:getComputedStyle(content).backgroundColor,valueSize:parseFloat(getComputedStyle(card.querySelector('.domain-project-card-v2__metric-value')).fontSize),labelSize:parseFloat(getComputedStyle(card.querySelector('.domain-project-card-v2__metric-label')).fontSize),contentLeft:cr.left,contentRight:cr.right,contentBottom:cr.bottom,visualLeft:vr.left,visualTop:vr.top,ctaLeft:tr.left,ctaRight:tr.right,ctaWidth:tr.width};
              });
              assert(!isWhite(domainState.bg),`Home ${width}: project tint missing`);
              assert(domainState.valueSize>domainState.labelSize,`Home ${width}: metric hierarchy invalid`);
              assert(Math.abs(domainState.ctaLeft-domainState.contentLeft)<=30&&Math.abs(domainState.ctaRight-domainState.contentRight)<=30,`Home ${width}: CTA must span content width`);
              if(width===1419||width===871){
                assert(Math.abs(domainState.visualLeft-domainState.contentRight)<=2,`Home ${width}: Large card must remain horizontal`);
              }else{
                assert(domainState.visualTop>=domainState.contentBottom-2&&domainState.visualTop<=domainState.contentBottom+2,`Home ${width}: mobile visual must follow content without gap`);
              }

              const controls=domain.locator('.domain-wheel-v2__control');
              const boxes=await controls.evaluateAll(nodes=>nodes.map(node=>{const r=node.getBoundingClientRect();return{w:r.width,h:r.height}}));
              assert(boxes.length===2&&boxes.every(b=>b.w>=44&&b.h>=44),`Home ${width}: wheel controls below 44x44`);

              await page.mouse.move(1,1);await page.waitForTimeout(50);
              const beforeHover=await active.evaluate(card=>({image:getComputedStyle(card.querySelector('.domain-project-card-v2__image')).transform,arrow:getComputedStyle(card.querySelector('.domain-project-card-v2__cta-arrow')).transform}));
              await active.hover();await page.waitForTimeout(320);
              const afterHover=await active.evaluate(card=>({image:getComputedStyle(card.querySelector('.domain-project-card-v2__image')).transform,arrow:getComputedStyle(card.querySelector('.domain-project-card-v2__cta-arrow')).transform}));
              assert(beforeHover.image!==afterHover.image,`Home ${width}: image hover motion missing`);
              assert(beforeHover.arrow!==afterHover.arrow,`Home ${width}: arrow hover motion missing`);

              const beforeKey=await active.getAttribute('data-project');
              await controls.nth(1).click();
              const activeAfter=domain.locator('.domain-project-card-v2[data-wheel-offset="0"]');
              const afterKey=await activeAfter.getAttribute('data-project');
              assert(beforeKey!==afterKey,`Home ${width}: next control failed`);
              await activeAfter.focus();await page.keyboard.press('ArrowLeft');
              assert(await domain.locator('.domain-project-card-v2[data-wheel-offset="0"]').getAttribute('data-project')===beforeKey,`Home ${width}: keyboard wheel navigation failed`);

              for(let i=0;i<await tabs.count();i++){
                await tabs.nth(i).click();
                await page.waitForTimeout(120);
                assert(await tabs.nth(i).getAttribute('aria-selected')==='true',`Home ${width}: Domain tab ${i+1} did not select`);
                const current=domain.locator('.domain-project-card-v2[data-wheel-offset="0"]');
                assert(await current.count()===1,`Home ${width}: Domain tab ${i+1} missing active card`);
                assert(await current.locator('.domain-project-card-v2__support').count()===1,`Home ${width}: Domain tab ${i+1} support missing`);
                for(const d of await disclosures.all())assert(!(await d.getAttribute('open')),`Home ${width}: disclosures reopened after tab switch`);
              }

              assert(await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth)<=1,`Home ${width}: horizontal overflow`);
              report.domain[width]={layoutViewportWidth,wheelWidth:wheelBox.width,wheelX:wheelBox.x,cardWidth:activeBox.width,cardHeight:activeBox.height,labels,...domainState};
              await domain.screenshot({path:path.join(out,`domain-${width}.png`)});

              response=await page.goto(`${base}/site/work.html`,{waitUntil:'networkidle'});
              assert(response?.ok(),`Work ${width}: HTTP ${response?.status()}`);
              await page.waitForSelector('.work-index',{timeout:10000});
              await page.waitForFunction(()=>{const imgs=[...document.querySelectorAll('.work-index-card__visual img')];return imgs.length===5&&imgs.every(img=>img.complete&&img.naturalWidth>0)},{timeout:10000});

              const work=page.locator('.work-index');
              const filters=(await work.locator('.work-index-filter').allTextContents()).map(clean);
              assert(JSON.stringify(filters)===JSON.stringify(['All','Transactions','Operations','Incentives','0→1','Connected journeys']),`Work ${width}: taxonomy mismatch ${JSON.stringify(filters)}`);
              assert(await work.locator(':scope > .work-index__shell > .work-index__featured > .work-index-card').count()===2,`Work ${width}: first featured row requires two cards`);
              assert(await work.locator('.work-index__featured-secondary-row > .work-index-card').count()===2,`Work ${width}: second featured row requires two cards`);

              const featured=work.locator('.work-index__featured .work-index-card');
              assert(await featured.count()===4,`Work ${width}: expected four featured cards`);
              const expectedMetrics=[3,2,2,2];
              for(let i=0;i<4;i++){
                const card=featured.nth(i);
                const buttonBox=await card.locator('.work-index-card__button').boundingBox();
                const cardBox=await card.boundingBox();
                assert(buttonBox&&cardBox&&Math.abs(buttonBox.width-cardBox.width)<=2&&Math.abs(buttonBox.height-cardBox.height)<=2,`Work ${width}: featured ${i+1} whole-card target failed`);
                assert(await card.locator('.work-index-card__visual img').count()===1,`Work ${width}: featured ${i+1} image missing`);
                const image=card.locator('.work-index-card__visual img');
                assert(await image.evaluate(img=>img.complete&&img.naturalWidth>0&&img.naturalHeight>0),`Work ${width}: featured ${i+1} image did not decode`);
                assert(await card.locator('.work-index-card__metric').count()===expectedMetrics[i],`Work ${width}: featured ${i+1} metric count mismatch`);
                const metricLabels=(await card.locator('.work-index-card__metric-label').allTextContents()).map(clean);
                assert(metricLabels.every(x=>x.split(/\s+/).filter(Boolean).length<=2),`Work ${width}: featured ${i+1} metric labels too long`);
                const tops=await card.locator('.work-index-card__metric').evaluateAll(nodes=>nodes.map(node=>node.getBoundingClientRect().top));
                assert(Math.max(...tops)-Math.min(...tops)<=2,`Work ${width}: featured ${i+1} metrics must stay horizontal`);
                const typography=await card.evaluate(node=>({bg:getComputedStyle(node.querySelector('.work-index-card__content')).backgroundColor,valueSize:parseFloat(getComputedStyle(node.querySelector('.work-index-card__metric-value')).fontSize),labelSize:parseFloat(getComputedStyle(node.querySelector('.work-index-card__metric-label')).fontSize)}));
                assert(!isWhite(typography.bg),`Work ${width}: featured ${i+1} tint missing`);
                assert(typography.valueSize>typography.labelSize,`Work ${width}: featured ${i+1} metric hierarchy invalid`);
                if(width<=1100){
                  const geometry=await card.evaluate(node=>{const c=node.querySelector('.work-index-card__content').getBoundingClientRect();const v=node.querySelector('.work-index-card__visual').getBoundingClientRect();return{contentBottom:c.bottom,visualTop:v.top}});
                  assert(geometry.visualTop>=geometry.contentBottom-2,`Work ${width}: featured ${i+1} must stack content above visual`);
                }
              }

              await page.mouse.move(1,1);await page.waitForTimeout(50);
              const workHero=featured.nth(0);
              const workBefore=await workHero.evaluate(card=>({image:getComputedStyle(card.querySelector('.work-index-card__image')).transform,arrow:getComputedStyle(card.querySelector('.work-index-card__cta-arrow')).transform}));
              await workHero.hover();await page.waitForTimeout(320);
              const workAfter=await workHero.evaluate(card=>({image:getComputedStyle(card.querySelector('.work-index-card__image')).transform,arrow:getComputedStyle(card.querySelector('.work-index-card__cta-arrow')).transform}));
              assert(workBefore.image!==workAfter.image,`Work ${width}: image hover motion missing`);
              assert(workBefore.arrow!==workAfter.arrow,`Work ${width}: arrow hover motion missing`);

              const more=work.locator('.work-index__more-grid .work-index-card');
              assert(await more.count()>=1,`Work ${width}: More Work empty`);
              for(let i=0;i<await more.count();i++)assert(await more.nth(i).locator('.work-index-card__metric').count()===1,`Work ${width}: More Work ${i+1} metric count mismatch`);
              await work.locator('.work-index-filter[data-work-index-filter="operations"]').click();
              assert(await work.locator('.work-index-card[data-work-categories~="operations"]:not([hidden])').count()>=1,`Work ${width}: Operations filter empty`);
              await work.locator('.work-index-filter[data-work-index-filter="all"]').click();
              assert(await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth)<=1,`Work ${width}: horizontal overflow`);
              report.work[width]={filters};
              await work.screenshot({path:path.join(out,`work-${width}.png`)});
              await context.close();
            }

            {
              const context=await browser.newContext({viewport:{width:1419,height:1100}});
              const page=await context.newPage();
              const response=await page.goto(`${base}/site/experiments.html?experiment=daily-hours`,{waitUntil:'networkidle'});
              assert(response?.ok(),`Daily Hours experiment: HTTP ${response?.status()}`);
              assert(await page.evaluate(()=>new URL(location.href).searchParams.get('experiment'))==='daily-hours','Daily Hours experiment query lost');
              await page.waitForFunction(()=>document.body.innerText.includes('Daily Hours'),null,{timeout:10000});
              const identity=await page.evaluate(()=>({title:document.title,body:document.body.innerText,canonical:document.querySelector('link[rel="canonical"]')?.href||''}));
              assert(identity.body.includes('Daily Hours'),'Daily Hours rendered identity missing');
              report.routes['daily-hours']={status:response.status(),query:'daily-hours',canonical:identity.canonical,title:identity.title};
              await context.close();
            }

            for(const slug of ['payment','dbs']){
              const context=await browser.newContext({viewport:{width:1419,height:1100}});
              const page=await context.newPage();
              const route=`/site/work/${slug}.html`;
              const response=await page.goto(`${base}${route}`,{waitUntil:'networkidle'});
              assert(response?.ok(),`${route}: HTTP ${response?.status()}`);
              const identity=await page.evaluate(()=>({title:document.title,canonical:document.querySelector('link[rel="canonical"]')?.href||''}));
              assert(identity.canonical.endsWith(`/work/${slug}`),`${route}: canonical mismatch ${identity.canonical}`);
              assert(identity.title&&identity.title.length>10&&!/404|not found/i.test(identity.title),`${route}: invalid title ${identity.title}`);
              report.routes[slug]={status:response.status(),...identity};
              await context.close();
            }

            assert(report.consoleErrors.length===0,`Console/page errors: ${JSON.stringify(report.consoleErrors)}`);
          }catch(error){
            report.failure={message:error.message,stack:error.stack};
            throw error;
          }finally{
            fs.writeFileSync(path.join(out,'qa-report.json'),JSON.stringify(report,null,2));
            await browser.close();
          }
          NODE

      - name: Upload Human review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: style-b-domain-work-human-contract
          path: artifacts/style-b-domain-work-human-contract
          retention-days: 3
