name: Style B Domain Work Human Contract QA

on:
  push:
    branches:
      - migration/style-b-domain-work-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify isolated baseline and denylist
        run: |
          set -euo pipefail
          BASE=05291a4ba071d00d0098f227ea08069c774cb422
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --check "$BASE"...HEAD
          git diff --name-only "$BASE"...HEAD | tee /tmp/changed.txt
          ! grep -Fxq 'public/site/assets/js/app.js' /tmp/changed.txt
          ! grep -Fxq 'public/site/content/portfolio-content.json' /tmp/changed.txt
          ! grep -Fxq 'public/site/assets/css/components/project-card.css' /tmp/changed.txt
          ! grep -Fxq 'scripts/build-production-assets.mjs' /tmp/changed.txt
          ! grep -Fxq 'scripts/generate-project-pages.mjs' /tmp/changed.txt
          ! grep -E '^public/site/assets/projects/daily-hours/' /tmp/changed.txt
          ! grep -Fxq 'public/site/assets/css/components/project-detail-overview.css' /tmp/changed.txt
          git diff --quiet "$BASE"...HEAD -- public/site/assets/css/components/domain-selector.css
          ! grep -q 'related-project-card' public/site/assets/css/components/domain-experience.css

      - name: Install build and validate source
        run: |
          npm run install:ci
          npm run build
          npm test

      - name: Install browser QA dependencies
        working-directory: public/site/qa
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start static QA server
        run: |
          PORT=4173 node tests/portfolio-static-server.mjs > /tmp/style-b-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/site/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/style-b-server.log
          exit 1

      - name: Run Human contract browser QA
        working-directory: public/site/qa
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          import fs from 'node:fs';
          import path from 'node:path';

          const out = path.join(process.env.GITHUB_WORKSPACE, 'artifacts/style-b-domain-work-human-contract');
          fs.mkdirSync(out, { recursive: true });
          const base = 'http://127.0.0.1:4173';
          const widths = [1419, 871, 430];
          const browser = await chromium.launch({ headless: true });
          const report = { domain: {}, work: {}, routes: {}, consoleErrors: [] };
          const assert = (condition, message) => { if (!condition) throw new Error(message); };
          const clean = (value) => String(value || '').replace(/\s+/g, ' ').trim();
          const colorIsWhite = (value) => /rgba?\(\s*255\s*,\s*255\s*,\s*255/i.test(value || '');

          try {
            for (const width of widths) {
              const context = await browser.newContext({ viewport: { width, height: 1100 }, reducedMotion: 'no-preference' });
              const page = await context.newPage();
              page.on('console', msg => { if (msg.type() === 'error') report.consoleErrors.push({ width, url: page.url(), text: msg.text() }); });
              page.on('pageerror', error => report.consoleErrors.push({ width, url: page.url(), text: error.message }));

              let response = await page.goto(`${base}/site/index.html`, { waitUntil: 'networkidle' });
              assert(response?.ok(), `Home ${width}: HTTP ${response?.status()}`);
              const domain = page.locator('#domains');
              await domain.scrollIntoViewIfNeeded();
              await page.waitForFunction(() => document.querySelector('#domains')?.dataset.domainGoldenReferenceMounted === 'true');
              await page.waitForSelector('#domains .domain-project-card-v2[data-wheel-offset="0"]');

              const tabs = domain.locator('.domain-tab');
              assert(await tabs.count() === 6, `Home ${width}: expected 6 Domain tabs`);
              assert(await domain.locator('.domain-tab__icon svg').count() === 6, `Home ${width}: all 6 Domain tabs require icons`);
              const tabLabels = (await domain.locator('.domain-tab__label').allTextContents()).map(clean);
              assert(tabLabels.length === 6 && tabLabels.every(label => label.length > 2), `Home ${width}: Domain labels missing`);

              const layoutViewportWidth = await page.evaluate(() => document.documentElement.clientWidth);
              const wheel = domain.locator('.domain-wheel-v2');
              const wheelBox = await wheel.boundingBox();
              assert(wheelBox && Math.abs(wheelBox.width - layoutViewportWidth) <= 2, `Home ${width}: wheel must span layout viewport (${wheelBox?.width} vs ${layoutViewportWidth})`);
              assert(Math.abs(wheelBox.x) <= 2, `Home ${width}: wheel must begin at layout viewport edge (${wheelBox?.x})`);

              const disclosures = domain.locator('details.domain-experience-disclosure');
              assert(await disclosures.count() === 2, `Home ${width}: expected 2 disclosures`);
              for (const details of await disclosures.all()) assert(!(await details.getAttribute('open')), `Home ${width}: disclosures default closed`);
              assert(await domain.locator('.domain-experience__project-heading:visible').count() === 0, `Home ${width}: legacy Related Work heading visible`);

              const active = domain.locator('.domain-project-card-v2[data-wheel-offset="0"]');
              assert(await active.count() === 1, `Home ${width}: exactly one active card required`);
              assert(await domain.locator('.domain-project-card-v2[data-wheel-offset="-1"]').count() === 1, `Home ${width}: previous side card missing`);
              assert(await domain.locator('.domain-project-card-v2[data-wheel-offset="1"]').count() === 1, `Home ${width}: next side card missing`);
              assert(await active.getAttribute('role') === 'link', `Home ${width}: active card must be one target area`);
              assert(Number(await active.getAttribute('tabindex')) >= 0, `Home ${width}: active card must be keyboard target`);
              assert(await active.locator('.domain-project-card-v2__support').count() === 0, `Home ${width}: subtitle/support copy must be removed`);

              const metricGroups = active.locator('.domain-project-card-v2__metric');
              const metricCount = await metricGroups.count();
              assert(metricCount >= 1 && metricCount <= 3, `Home ${width}: invalid metric count ${metricCount}`);
              const metricLabels = (await active.locator('.domain-project-card-v2__metric-label').allTextContents()).map(clean);
              assert(metricLabels.every(label => label.split(/\s+/).filter(Boolean).length <= 2), `Home ${width}: metric labels must be concise ${JSON.stringify(metricLabels)}`);
              for (const group of await metricGroups.all()) assert(await group.locator(':scope > dt').count() === 1 && await group.locator(':scope > dd').count() === 1, `Home ${width}: each metric requires value + label`);

              const domainState = await active.evaluate(card => {
                const content = card.querySelector('.domain-project-card-v2__content');
                const visual = card.querySelector('.domain-project-card-v2__visual');
                const c = content.getBoundingClientRect();
                const v = visual.getBoundingClientRect();
                return {
                  contentBg: getComputedStyle(content).backgroundColor,
                  valueSize: parseFloat(getComputedStyle(card.querySelector('.domain-project-card-v2__metric-value')).fontSize),
                  labelSize: parseFloat(getComputedStyle(card.querySelector('.domain-project-card-v2__metric-label')).fontSize),
                  contentRight: c.right,
                  contentBottom: c.bottom,
                  visualLeft: v.left,
                  visualTop: v.top
                };
              });
              assert(!colorIsWhite(domainState.contentBg), `Home ${width}: card content panel must use project tint`);
              assert(domainState.valueSize > domainState.labelSize, `Home ${width}: metric value must be larger than label`);
              if (width === 1419) {
                assert(Math.abs(domainState.visualLeft - domainState.contentRight) <= 2, `Home ${width}: Large card must stay horizontal`);
              }

              const controls = domain.locator('.domain-wheel-v2__control');
              const controlBoxes = await controls.evaluateAll(nodes => nodes.map(node => { const r = node.getBoundingClientRect(); return { w:r.width,h:r.height }; }));
              assert(controlBoxes.length === 2 && controlBoxes.every(box => box.w >= 44 && box.h >= 44), `Home ${width}: controls below 44x44`);

              const image = active.locator('.domain-project-card-v2__image');
              const beforeHover = await active.evaluate(card => ({
                image: getComputedStyle(card.querySelector('.domain-project-card-v2__image')).transform,
                arrow: getComputedStyle(card.querySelector('.domain-project-card-v2__cta-arrow')).transform
              }));
              await active.hover();
              await page.waitForTimeout(320);
              const afterHover = await active.evaluate(card => ({
                image: getComputedStyle(card.querySelector('.domain-project-card-v2__image')).transform,
                arrow: getComputedStyle(card.querySelector('.domain-project-card-v2__cta-arrow')).transform
              }));
              if (await image.count()) assert(beforeHover.image !== afterHover.image, `Home ${width}: image hover motion missing`);
              assert(beforeHover.arrow !== afterHover.arrow, `Home ${width}: arrow hover motion missing`);

              const beforeKey = await active.getAttribute('data-project');
              await controls.nth(1).click();
              const activeAfter = domain.locator('.domain-project-card-v2[data-wheel-offset="0"]');
              const afterKey = await activeAfter.getAttribute('data-project');
              assert(beforeKey !== afterKey, `Home ${width}: next control did not rotate wheel`);
              await activeAfter.focus();
              await page.keyboard.press('ArrowLeft');
              const keyboardKey = await domain.locator('.domain-project-card-v2[data-wheel-offset="0"]').getAttribute('data-project');
              assert(keyboardKey === beforeKey, `Home ${width}: keyboard did not rotate wheel back`);

              report.domain[width] = { layoutViewportWidth, wheelWidth: wheelBox.width, wheelX: wheelBox.x, metricLabels, ...domainState };
              await domain.screenshot({ path: path.join(out, `domain-${width}.png`) });
              const homeOverflow = await page.evaluate(() => document.documentElement.scrollWidth - document.documentElement.clientWidth);
              assert(homeOverflow <= 1, `Home ${width}: horizontal overflow ${homeOverflow}`);

              response = await page.goto(`${base}/site/work.html`, { waitUntil: 'networkidle' });
              assert(response?.ok(), `Work ${width}: HTTP ${response?.status()}`);
              await page.waitForSelector('.work-index', { timeout: 10000 });
              await page.waitForFunction(() => {
                const images = [...document.querySelectorAll('.work-index-card__visual img')];
                return images.length === 5 && images.every(img => img.complete && img.naturalWidth > 0);
              }, { timeout: 10000 });

              const work = page.locator('.work-index');
              const filters = (await work.locator('.work-index-filter').allTextContents()).map(clean);
              assert(JSON.stringify(filters) === JSON.stringify(['All','Transactions','Operations','Incentives','0→1','Connected journeys']), `Work ${width}: taxonomy mismatch ${JSON.stringify(filters)}`);
              const row1 = work.locator(':scope > .work-index__shell > .work-index__featured > .work-index-card');
              const row2 = work.locator('.work-index__featured-secondary-row > .work-index-card');
              assert(await row1.count() === 2, `Work ${width}: first row requires 2 cards`);
              assert(await row2.count() === 2, `Work ${width}: second row requires 2 cards`);

              const featured = work.locator('.work-index__featured .work-index-card');
              assert(await featured.count() === 4, `Work ${width}: featured requires 4 cards`);
              const expectedMetrics = [3,2,2,2];
              for (let i = 0; i < 4; i++) {
                const card = featured.nth(i);
                const buttonBox = await card.locator('.work-index-card__button').boundingBox();
                const cardBox = await card.boundingBox();
                assert(buttonBox && cardBox && Math.abs(buttonBox.width-cardBox.width) <= 2 && Math.abs(buttonBox.height-cardBox.height) <= 2, `Work ${width}: featured ${i+1} whole card must be target area`);
                assert(await card.locator('.work-index-card__metric').count() === expectedMetrics[i], `Work ${width}: featured ${i+1} metric count mismatch`);
                const labelTexts = (await card.locator('.work-index-card__metric-label').allTextContents()).map(clean);
                assert(labelTexts.every(label => label.split(/\s+/).filter(Boolean).length <= 2), `Work ${width}: featured ${i+1} labels too long`);
                const metricTops = await card.locator('.work-index-card__metric').evaluateAll(nodes => nodes.map(node => node.getBoundingClientRect().top));
                assert(Math.max(...metricTops) - Math.min(...metricTops) <= 2, `Work ${width}: featured ${i+1} metrics must be horizontal`);
                const typography = await card.evaluate(node => ({
                  contentBg: getComputedStyle(node.querySelector('.work-index-card__content')).backgroundColor,
                  valueSize: parseFloat(getComputedStyle(node.querySelector('.work-index-card__metric-value')).fontSize),
                  labelSize: parseFloat(getComputedStyle(node.querySelector('.work-index-card__metric-label')).fontSize)
                }));
                assert(!colorIsWhite(typography.contentBg), `Work ${width}: featured ${i+1} content tint missing`);
                assert(typography.valueSize > typography.labelSize, `Work ${width}: featured ${i+1} metric hierarchy invalid`);
              }

              const workHero = featured.nth(0);
              const beforeWorkHover = await workHero.evaluate(card => ({
                image: getComputedStyle(card.querySelector('.work-index-card__image')).transform,
                arrow: getComputedStyle(card.querySelector('.work-index-card__cta-arrow')).transform
              }));
              await workHero.hover();
              await page.waitForTimeout(320);
              const afterWorkHover = await workHero.evaluate(card => ({
                image: getComputedStyle(card.querySelector('.work-index-card__image')).transform,
                arrow: getComputedStyle(card.querySelector('.work-index-card__cta-arrow')).transform
              }));
              assert(beforeWorkHover.image !== afterWorkHover.image, `Work ${width}: image hover motion missing`);
              assert(beforeWorkHover.arrow !== afterWorkHover.arrow, `Work ${width}: arrow hover motion missing`);

              const moreCards = work.locator('.work-index__more-grid .work-index-card');
              assert(await moreCards.count() >= 1, `Work ${width}: More Work empty`);
              for (let i = 0; i < await moreCards.count(); i++) {
                assert(await moreCards.nth(i).locator('.work-index-card__metric').count() === 1, `Work ${width}: More Work metric count mismatch`);
              }

              if (width <= 1100) {
                for (let i = 0; i < 4; i++) {
                  const geometry = await featured.nth(i).evaluate(card => {
                    const content = card.querySelector('.work-index-card__content')?.getBoundingClientRect();
                    const visual = card.querySelector('.work-index-card__visual')?.getBoundingClientRect();
                    return { contentBottom: content?.bottom, visualTop: visual?.top };
                  });
                  assert(geometry.visualTop >= geometry.contentBottom - 2, `Work ${width}: featured ${i+1} content must stack above visual`);
                }
              }

              await work.locator('.work-index-filter[data-work-index-filter="operations"]').click();
              assert(await work.locator('.work-index-card[data-work-categories~="operations"]:not([hidden])').count() >= 1, `Work ${width}: Operations filter returned no work`);
              await work.locator('.work-index-filter[data-work-index-filter="all"]').click();
              const workOverflow = await page.evaluate(() => document.documentElement.scrollWidth - document.documentElement.clientWidth);
              assert(workOverflow <= 1, `Work ${width}: horizontal overflow ${workOverflow}`);
              report.work[width] = { filters, overflow: workOverflow };
              await work.screenshot({ path: path.join(out, `work-${width}.png`) });
              await context.close();
            }

            for (const [slug, titleNeedle] of [['payment','Payment'],['dbs','DBS']]) {
              const context = await browser.newContext({ viewport: { width: 1419, height: 1100 } });
              const page = await context.newPage();
              const route = `/site/work/${slug}.html`;
              const response = await page.goto(`${base}${route}`, { waitUntil: 'networkidle' });
              assert(response?.ok(), `${route}: HTTP ${response?.status()}`);
              const identity = await page.evaluate(() => ({ title: document.title, canonical: document.querySelector('link[rel="canonical"]')?.href || '' }));
              assert(identity.canonical.endsWith(`/work/${slug}`), `${route}: canonical identity mismatch ${identity.canonical}`);
              assert(identity.title.toLowerCase().includes(titleNeedle.toLowerCase()), `${route}: title identity mismatch ${identity.title}`);
              report.routes[slug] = { path: route, status: response.status(), ...identity };
              await context.close();
            }

            assert(report.consoleErrors.length === 0, `Console/page errors: ${JSON.stringify(report.consoleErrors)}`);
          } catch (error) {
            report.failure = { message: error.message, stack: error.stack };
            throw error;
          } finally {
            fs.writeFileSync(path.join(out, 'qa-report.json'), JSON.stringify(report, null, 2));
            await browser.close();
          }
          NODE

      - name: Upload Human review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: style-b-domain-work-human-contract
          path: artifacts/style-b-domain-work-human-contract
          retention-days: 3
