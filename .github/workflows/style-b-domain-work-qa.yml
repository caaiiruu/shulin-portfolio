name: Style B Domain Work Human Contract QA

on:
  push:
    branches: [migration/style-b-domain-work-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify isolated baseline and denylist
        run: |
          set -euo pipefail
          BASE=05291a4ba071d00d0098f227ea08069c774cb422
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --check "$BASE"...HEAD
          git diff --name-only "$BASE"...HEAD | tee /tmp/changed.txt
          ! grep -Fxq 'public/site/assets/js/app.js' /tmp/changed.txt
          ! grep -Fxq 'public/site/content/portfolio-content.json' /tmp/changed.txt
          ! grep -Fxq 'public/site/assets/css/components/project-card.css' /tmp/changed.txt
          ! grep -Fxq 'scripts/build-production-assets.mjs' /tmp/changed.txt
          ! grep -Fxq 'scripts/generate-project-pages.mjs' /tmp/changed.txt
          ! grep -E '^public/site/assets/projects/daily-hours/' /tmp/changed.txt
          ! grep -Fxq 'public/site/assets/css/components/project-detail-overview.css' /tmp/changed.txt
          git diff --quiet "$BASE"...HEAD -- public/site/assets/css/components/domain-selector.css
          ! grep -q 'related-project-card' public/site/assets/css/components/domain-experience.css

      - name: Install build and validate source
        run: |
          npm run install:ci
          npm run build
          npm test

      - name: Install browser QA dependencies
        working-directory: public/site/qa
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start static QA server
        run: |
          PORT=4173 node tests/portfolio-static-server.mjs >/tmp/style-b-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/site/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/style-b-server.log
          exit 1

      - name: Run Human contract browser QA
        working-directory: public/site/qa
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          import fs from 'node:fs';
          import path from 'node:path';

          const out=path.join(process.env.GITHUB_WORKSPACE,'artifacts/style-b-domain-work-human-contract');
          fs.mkdirSync(out,{recursive:true});
          const base='http://127.0.0.1:4173';
          const widths=[1419,871,430];
          const browser=await chromium.launch({headless:true});
          const report={domain:{},work:{},routes:{},consoleErrors:[]};
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          const clean=v=>String(v||'').replace(/\s+/g,' ').trim();
          const white=v=>/rgba?\(\s*255\s*,\s*255\s*,\s*255/i.test(v||'');

          try{
            for(const width of widths){
              const context=await browser.newContext({viewport:{width,height:1100},reducedMotion:'no-preference'});
              const page=await context.newPage();
              page.on('console',m=>{if(m.type()==='error')report.consoleErrors.push({width,url:page.url(),text:m.text()})});
              page.on('pageerror',e=>report.consoleErrors.push({width,url:page.url(),text:e.message}));

              let response=await page.goto(`${base}/site/index.html`,{waitUntil:'networkidle'});
              assert(response?.ok(),`Home ${width}: HTTP ${response?.status()}`);
              const domain=page.locator('#domains');
              await domain.scrollIntoViewIfNeeded();
              await page.waitForFunction(()=>document.querySelector('#domains')?.dataset.domainGoldenReferenceMounted==='true');
              await page.waitForSelector('#domains .domain-project-card-v2[data-wheel-offset="0"]');
              const tabs=domain.locator('.domain-tab');
              assert(await tabs.count()===6,`Home ${width}: expected 6 Domain tabs`);
              assert(await domain.locator('.domain-tab__icon svg').count()===6,`Home ${width}: all 6 Domain tabs require icons`);
              const tabLabels=(await domain.locator('.domain-tab__label').allTextContents()).map(clean);
              assert(tabLabels.length===6&&tabLabels.every(x=>x.length>2),`Home ${width}: Domain labels missing`);

              const layoutViewportWidth=await page.evaluate(()=>document.documentElement.clientWidth);
              const wheel=domain.locator('.domain-wheel-v2');
              const wheelBox=await wheel.boundingBox();
              assert(wheelBox&&Math.abs(wheelBox.width-layoutViewportWidth)<=2,`Home ${width}: wheel must span layout viewport (${wheelBox?.width} vs ${layoutViewportWidth})`);
              assert(Math.abs(wheelBox.x)<=2,`Home ${width}: wheel must start at viewport edge (${wheelBox?.x})`);
              const disclosures=domain.locator('details.domain-experience-disclosure');
              assert(await disclosures.count()===2,`Home ${width}: expected 2 disclosures`);
              for(const d of await disclosures.all())assert(!(await d.getAttribute('open')),`Home ${width}: disclosures default closed`);
              assert(await domain.locator('.domain-experience__project-heading:visible').count()===0,`Home ${width}: legacy Related Work heading visible`);

              const active=domain.locator('.domain-project-card-v2[data-wheel-offset="0"]');
              assert(await active.count()===1,`Home ${width}: exactly one active card`);
              assert(await domain.locator('.domain-project-card-v2[data-wheel-offset="-1"]').count()===1,`Home ${width}: previous side card missing`);
              assert(await domain.locator('.domain-project-card-v2[data-wheel-offset="1"]').count()===1,`Home ${width}: next side card missing`);
              assert(await active.getAttribute('role')==='link',`Home ${width}: active card must be one target`);
              assert(Number(await active.getAttribute('tabindex'))>=0,`Home ${width}: active card keyboard target missing`);
              assert(await active.locator('.domain-project-card-v2__support').count()===0,`Home ${width}: support copy must be removed`);
              const metrics=active.locator('.domain-project-card-v2__metric');
              const mc=await metrics.count();
              assert(mc>=1&&mc<=3,`Home ${width}: invalid metric count ${mc}`);
              const labels=(await active.locator('.domain-project-card-v2__metric-label').allTextContents()).map(clean);
              assert(labels.every(x=>x.split(/\s+/).filter(Boolean).length<=2),`Home ${width}: metric labels too long ${JSON.stringify(labels)}`);
              for(const g of await metrics.all())assert(await g.locator(':scope > dt').count()===1&&await g.locator(':scope > dd').count()===1,`Home ${width}: metric value/label pair invalid`);

              const ds=await active.evaluate(card=>{const c=card.querySelector('.domain-project-card-v2__content');const v=card.querySelector('.domain-project-card-v2__visual');const cr=c.getBoundingClientRect();const vr=v.getBoundingClientRect();return{bg:getComputedStyle(c).backgroundColor,value:parseFloat(getComputedStyle(card.querySelector('.domain-project-card-v2__metric-value')).fontSize),label:parseFloat(getComputedStyle(card.querySelector('.domain-project-card-v2__metric-label')).fontSize),contentRight:cr.right,contentBottom:cr.bottom,visualLeft:vr.left,visualTop:vr.top}});
              assert(!white(ds.bg),`Home ${width}: project tint missing`);
              assert(ds.value>ds.label,`Home ${width}: metric hierarchy invalid`);
              if(width===1419)assert(Math.abs(ds.visualLeft-ds.contentRight)<=2,`Home ${width}: Large card must stay horizontal`);
              else assert(ds.visualTop>=ds.contentBottom-2,`Home ${width}: narrow Large must use stacked Medium-like layout`);

              const controls=domain.locator('.domain-wheel-v2__control');
              const boxes=await controls.evaluateAll(ns=>ns.map(n=>{const r=n.getBoundingClientRect();return{w:r.width,h:r.height}}));
              assert(boxes.length===2&&boxes.every(b=>b.w>=44&&b.h>=44),`Home ${width}: controls below 44x44`);
              await page.mouse.move(1,1);
              await page.waitForTimeout(50);
              const before=await active.evaluate(card=>({image:getComputedStyle(card.querySelector('.domain-project-card-v2__image')).transform,arrow:getComputedStyle(card.querySelector('.domain-project-card-v2__cta-arrow')).transform}));
              await active.hover(); await page.waitForTimeout(320);
              const after=await active.evaluate(card=>({image:getComputedStyle(card.querySelector('.domain-project-card-v2__image')).transform,arrow:getComputedStyle(card.querySelector('.domain-project-card-v2__cta-arrow')).transform}));
              assert(before.image!==after.image,`Home ${width}: image hover motion missing`);
              assert(before.arrow!==after.arrow,`Home ${width}: arrow hover motion missing`);
              const beforeKey=await active.getAttribute('data-project');
              await controls.nth(1).click();
              const activeAfter=domain.locator('.domain-project-card-v2[data-wheel-offset="0"]');
              const afterKey=await activeAfter.getAttribute('data-project');
              assert(beforeKey!==afterKey,`Home ${width}: wheel next failed`);
              await activeAfter.focus(); await page.keyboard.press('ArrowLeft');
              assert(await domain.locator('.domain-project-card-v2[data-wheel-offset="0"]').getAttribute('data-project')===beforeKey,`Home ${width}: keyboard wheel failed`);
              assert(await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth)<=1,`Home ${width}: horizontal overflow`);
              report.domain[width]={layoutViewportWidth,wheelWidth:wheelBox.width,wheelX:wheelBox.x,labels,...ds};
              await domain.screenshot({path:path.join(out,`domain-${width}.png`)});

              response=await page.goto(`${base}/site/work.html`,{waitUntil:'networkidle'});
              assert(response?.ok(),`Work ${width}: HTTP ${response?.status()}`);
              await page.waitForSelector('.work-index',{timeout:10000});
              await page.waitForFunction(()=>{const imgs=[...document.querySelectorAll('.work-index-card__visual img')];return imgs.length===5&&imgs.every(i=>i.complete&&i.naturalWidth>0)},{timeout:10000});
              const work=page.locator('.work-index');
              const filters=(await work.locator('.work-index-filter').allTextContents()).map(clean);
              assert(JSON.stringify(filters)===JSON.stringify(['All','Transactions','Operations','Incentives','0→1','Connected journeys']),`Work ${width}: taxonomy mismatch ${JSON.stringify(filters)}`);
              assert(await work.locator(':scope > .work-index__shell > .work-index__featured > .work-index-card').count()===2,`Work ${width}: row1 requires 2 cards`);
              assert(await work.locator('.work-index__featured-secondary-row > .work-index-card').count()===2,`Work ${width}: row2 requires 2 cards`);
              const featured=work.locator('.work-index__featured .work-index-card');
              assert(await featured.count()===4,`Work ${width}: featured requires 4 cards`);
              const expected=[3,2,2,2];
              for(let i=0;i<4;i++){
                const card=featured.nth(i);const bb=await card.locator('.work-index-card__button').boundingBox();const cb=await card.boundingBox();
                assert(bb&&cb&&Math.abs(bb.width-cb.width)<=2&&Math.abs(bb.height-cb.height)<=2,`Work ${width}: featured ${i+1} whole-card target failed`);
                assert(await card.locator('.work-index-card__metric').count()===expected[i],`Work ${width}: featured ${i+1} metric count mismatch`);
                const ls=(await card.locator('.work-index-card__metric-label').allTextContents()).map(clean);
                assert(ls.every(x=>x.split(/\s+/).filter(Boolean).length<=2),`Work ${width}: featured ${i+1} metric labels too long`);
                const tops=await card.locator('.work-index-card__metric').evaluateAll(ns=>ns.map(n=>n.getBoundingClientRect().top));
                assert(Math.max(...tops)-Math.min(...tops)<=2,`Work ${width}: featured ${i+1} metrics must be horizontal`);
                const ts=await card.evaluate(n=>({bg:getComputedStyle(n.querySelector('.work-index-card__content')).backgroundColor,value:parseFloat(getComputedStyle(n.querySelector('.work-index-card__metric-value')).fontSize),label:parseFloat(getComputedStyle(n.querySelector('.work-index-card__metric-label')).fontSize)}));
                assert(!white(ts.bg),`Work ${width}: featured ${i+1} tint missing`);assert(ts.value>ts.label,`Work ${width}: featured ${i+1} metric hierarchy invalid`);
                if(width<=1100){const g=await card.evaluate(n=>{const c=n.querySelector('.work-index-card__content').getBoundingClientRect();const v=n.querySelector('.work-index-card__visual').getBoundingClientRect();return{cb:c.bottom,vt:v.top}});assert(g.vt>=g.cb-2,`Work ${width}: featured ${i+1} must stack content above visual`)}
              }
              await page.mouse.move(1,1); await page.waitForTimeout(50);
              const wh=featured.nth(0);
              const wb=await wh.evaluate(c=>({image:getComputedStyle(c.querySelector('.work-index-card__image')).transform,arrow:getComputedStyle(c.querySelector('.work-index-card__cta-arrow')).transform}));
              await wh.hover(); await page.waitForTimeout(320);
              const wa=await wh.evaluate(c=>({image:getComputedStyle(c.querySelector('.work-index-card__image')).transform,arrow:getComputedStyle(c.querySelector('.work-index-card__cta-arrow')).transform}));
              assert(wb.image!==wa.image,`Work ${width}: image hover motion missing`);assert(wb.arrow!==wa.arrow,`Work ${width}: arrow hover motion missing`);
              const more=work.locator('.work-index__more-grid .work-index-card');
              assert(await more.count()>=1,`Work ${width}: More Work empty`);
              for(let i=0;i<await more.count();i++)assert(await more.nth(i).locator('.work-index-card__metric').count()===1,`Work ${width}: More Work metric count mismatch`);
              await work.locator('.work-index-filter[data-work-index-filter="operations"]').click();
              assert(await work.locator('.work-index-card[data-work-categories~="operations"]:not([hidden])').count()>=1,`Work ${width}: Operations filter empty`);
              await work.locator('.work-index-filter[data-work-index-filter="all"]').click();
              assert(await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth)<=1,`Work ${width}: horizontal overflow`);
              report.work[width]={filters};
              await work.screenshot({path:path.join(out,`work-${width}.png`)});
              await context.close();
            }

            for(const [slug,needle] of [['daily-hours','Daily'],['payment','Payment'],['dbs','DBS']]){
              const context=await browser.newContext({viewport:{width:1419,height:1100}});const page=await context.newPage();const route=`/site/work/${slug}.html`;const r=await page.goto(`${base}${route}`,{waitUntil:'networkidle'});assert(r?.ok(),`${route}: HTTP ${r?.status()}`);const id=await page.evaluate(()=>({title:document.title,canonical:document.querySelector('link[rel="canonical"]')?.href||''}));assert(id.canonical.endsWith(`/work/${slug}`),`${route}: canonical mismatch`);assert(id.title.toLowerCase().includes(needle.toLowerCase()),`${route}: title mismatch ${id.title}`);report.routes[slug]={status:r.status(),...id};await context.close();
            }
            assert(report.consoleErrors.length===0,`Console/page errors: ${JSON.stringify(report.consoleErrors)}`);
          }catch(error){report.failure={message:error.message,stack:error.stack};throw error}finally{fs.writeFileSync(path.join(out,'qa-report.json'),JSON.stringify(report,null,2));await browser.close()}
          NODE

      - name: Upload Human review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: style-b-domain-work-human-contract
          path: artifacts/style-b-domain-work-human-contract
          retention-days: 3
