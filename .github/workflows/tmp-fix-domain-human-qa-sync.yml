name: Temp Stabilize Domain Category Render
on:
  push:
    branches:
      - migration/style-b-domain-work-v1
    paths:
      - .github/workflows/tmp-fix-domain-human-qa-sync.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/style-b-domain-work-v1
          fetch-depth: 0
      - name: Patch Domain render geometry
        env:
          OLD_B64: 
          NEW_B64: 
        run: >-
          python -c "from pathlib import Path; import os,base64; p=Path('public/site/assets/js/domain-experience.js'); s=p.read_text(); old=base64.b64decode(os.environ['OLD_B64']).decode(); new=base64.b64decode(os.environ['NEW_B64']).decode(); assert old in s, 'target block missing'; p.write_text(s.replace(old,new,1))"
      - name: Commit patch
        run: |
          git diff --check
          git config user.name caiiru
          git config user.email 63276875+caaiiruu@users.noreply.github.com
          git add public/site/assets/js/domain-experience.js
          git commit -m "Stabilize Domain category render geometry"
          git push origin HEAD:migration/style-b-domain-work-v1
