name: Temporary Cathay Visible Title Sync

on:
  push:
    branches: [migration/style-b-domain-work-v1]
    paths: [.github/workflows/tmp-cathay-visible-title-sync.yml]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/style-b-domain-work-v1
          fetch-depth: 0
      - name: Apply exact canonical-title consumer and test sync
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p=Path(path)
              text=p.read_text()
              actual=text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} matches, got {actual}: {old!r}')
              p.write_text(text.replace(old,new,count))

          # Work index: project cards must obey the same recruiter-first visible-title contract as detail Hero.
          path='public/site/assets/js/work.js'
          old="""  const firstText = (...values) => values.map(scalarText).find(Boolean) || '';

  const taxonomy = ["""
          new="""  const firstText = (...values) => values.map(scalarText).find(Boolean) || '';
  const visibleProjectTitle = (value) => {
    let text = String(value || '').trim();
    const prefixes = DATA.implementationContracts?.recruiterFirstPresentation?.hero?.forbiddenVisiblePrefixes;
    for (const prefix of Array.isArray(prefixes) ? prefixes : []) {
      if (prefix && text.startsWith(prefix)) { text = text.slice(prefix.length).trimStart(); break; }
    }
    return text;
  };

  const taxonomy = ["""
          replace_exact(path,old,new)
          old="""  const projectTitle = (raw, adapted, source) => firstText(
    language() === 'zh' ? raw?.transformation_zh : raw?.transformation,
    raw?.transformation,
    adapted?.transformation,
    raw?.title,
    adapted?.title,
    source.title?.textContent,
    source.projectId
  );"""
          new="""  const projectTitle = (raw, adapted, source) => visibleProjectTitle(firstText(
    language() === 'zh' ? raw?.transformation_zh : raw?.transformation,
    raw?.transformation,
    adapted?.transformation,
    raw?.title,
    adapted?.title,
    source.title?.textContent,
    source.projectId
  ));"""
          replace_exact(path,old,new)

          # Domain cards: same display-title normalization; no second short-title source.
          path='public/site/assets/js/domain-experience.js'
          old="""  const firstText = (...values) => values.map(scalarText).find(Boolean) || '';
  const asList = (value) => Array.isArray(value) ? value : value == null ? [] : [value];"""
          new="""  const firstText = (...values) => values.map(scalarText).find(Boolean) || '';
  const asList = (value) => Array.isArray(value) ? value : value == null ? [] : [value];
  const visibleProjectTitle = (value) => {
    let text = String(value || '').trim();
    const prefixes = DATA.implementationContracts?.recruiterFirstPresentation?.hero?.forbiddenVisiblePrefixes;
    for (const prefix of Array.isArray(prefixes) ? prefixes : []) {
      if (prefix && text.startsWith(prefix)) { text = text.slice(prefix.length).trimStart(); break; }
    }
    return text;
  };"""
          replace_exact(path,old,new)
          old="""    title.textContent = firstText(language() === 'zh' ? project?.transformation_zh : project?.transformation, project?.transformation, project?.title_pair, project?.title);"""
          new="""    title.textContent = visibleProjectTitle(firstText(language() === 'zh' ? project?.transformation_zh : project?.transformation, project?.transformation, project?.title_pair, project?.title));"""
          replace_exact(path,old,new)

          # Legacy certification must allow the current governed SSOT release identifier.
          path='tests/portfolio-r182-certification.test.mjs'
          old="""  assert.match(content.contentVersion,/r18(?:22|26|3|-non-asset-complete)/);"""
          new="""  assert.match(content.contentVersion,/^(?:r18(?:22|26|3|-non-asset-complete)|2026-09-11-style-b-cathay-canonical-naming)/);"""
          replace_exact(path,old,new)

          # Stale title/company expectations must follow the canonical SSOT names.
          path='tests/rendered-html.test.mjs'
          replace_exact(path,
              '  assert.equal(project.title.en,"Fragmented account-opening steps to a validated end-to-end flow");',
              '  assert.equal(project.title.en,"From fragmented steps to end-to-end account opening");')
          replace_exact(path,
              '  assert.equal(project.title.en,"Rigid tablet script to a flexible mortgage consultation system");',
              '  assert.equal(project.title.en,"From rigid scripts to flexible mortgage consultation");')
          replace_exact(path,
              '  assert.equal(project.company,"Cathay Life Insurance");',
              '  assert.equal(project.company,"Cathay");')
          replace_exact(path,
              '  assert.equal(project.heroMetadata.company,"Cathay Life Insurance");',
              '  assert.equal(project.heroMetadata.company,"Cathay");')
          replace_exact(path,
              '  assert.doesNotMatch(project.title.en,/^From\\s/);',
              '  assert.equal(project.title.en.startsWith("From "),true);')

          # Guard the canonical Cathay naming trio and shared visible-title rule prospectively.
          with Path('tests/rendered-html.test.mjs').open('a') as f:
              f.write(r'''

test("keeps Cathay canonical names concise while all visible surfaces share one title rule", () => {
  const ssot=JSON.parse(read("content/portfolio-content.json"));
  const work=read("assets/js/work.js");
  const domain=read("assets/js/domain-experience.js");
  const cathay={
    "cathay-mortgage-assistant":"From rigid scripts to flexible mortgage consultation",
    "cathay-sit-online-account-opening":"From fragmented steps to end-to-end account opening",
    "cathay-sit-review-remediation-operations":"From interface issues to prioritised remediation"
  };
  for(const [id,title] of Object.entries(cathay)){
    const project=ssot.projects[id];
    assert.equal(project.company,"Cathay",id);
    assert.equal(project.heroMetadata.company,"Cathay",id);
    assert.equal(project.title.en,title,id);
    assert.equal(project.transformation,title,id);
  }
  assert.match(work,/visibleProjectTitle/);
  assert.match(domain,/visibleProjectTitle/);
  assert.match(work,/forbiddenVisiblePrefixes/);
  assert.match(domain,/forbiddenVisiblePrefixes/);
});
''')
          PY
          git diff --check
          git diff -- public/site/assets/js/work.js public/site/assets/js/domain-experience.js tests/portfolio-r182-certification.test.mjs tests/rendered-html.test.mjs
      - name: Commit synchronized consumers and tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/site/assets/js/work.js public/site/assets/js/domain-experience.js tests/portfolio-r182-certification.test.mjs tests/rendered-html.test.mjs
          git commit -m "Align Cathay visible titles and canonical tests"
          git push origin HEAD:migration/style-b-domain-work-v1
