name: Style B Production Integration QA

on:
  push:
    branches: [integration/style-b-domain-work-prod-7b6c4f]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify certified Production ancestry and frozen CSV2 owners
        run: |
          set -euo pipefail
          BASE=7b6c4f47b6f1bba1e4d4048649305f22999b2976
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --check "$BASE"...HEAD
          git diff --name-only "$BASE"...HEAD | tee /tmp/changed.txt
          ! grep -Fxq 'public/site/assets/css/components/case-study-v2.css' /tmp/changed.txt
          ! grep -Fxq 'public/site/assets/js/case-study-v2.js' /tmp/changed.txt
          ! grep -E '^public/site/content/case-studies/daily-hours/' /tmp/changed.txt
          ! grep -E '^public/site/assets/projects/daily-hours/' /tmp/changed.txt
          ! grep -Fxq 'scripts/generate-project-pages.mjs' /tmp/changed.txt
          ! grep -Fxq 'scripts/build-production-assets.mjs' /tmp/changed.txt

      - name: Verify project and locale contracts
        run: |
          node <<'NODE'
          const fs=require('fs');
          const content=JSON.parse(fs.readFileSync('public/site/content/portfolio-content.json','utf8'));
          const registry=JSON.parse(fs.readFileSync('public/site/content/project-presentation-registry.json','utf8'));
          const ids=Object.keys(content.projects||{});
          if(ids.length!==13) throw new Error(`legacy project count ${ids.length}`);
          if(content.projects['daily-hours']) throw new Error('Daily Hours entered legacy projects');
          if(content.publicLocaleMode!=='EN_ONLY_TEMPORARY') throw new Error('public locale mode drift');
          const dh=registry.routes?.['/work/daily-hours'];
          if(!dh||dh.projectId!=='daily-hours'||dh.presentationContract!=='case-study-v2') throw new Error('Daily Hours registry drift');
          if(dh.publicDiscovery!==true||dh.previewOnly!==false) throw new Error('Daily Hours public discovery drift');
          if('domainIds' in (dh.workProjection||{})||'company' in (dh.workProjection||{})) throw new Error('Style B metadata leaked into frozen Daily Hours registry');
          NODE

      - name: Install build and run regression tests
        run: |
          npm run install:ci
          npm run build
          npm test

      - name: Install browser QA dependencies
        working-directory: public/site/qa
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start static QA server
        run: |
          PORT=4173 node tests/portfolio-static-server.mjs >/tmp/style-b-prod-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/site/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/style-b-prod-server.log
          exit 1

      - name: Run integration browser contract
        working-directory: public/site/qa
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          import fs from 'node:fs';
          import path from 'node:path';
          const browser=await chromium.launch({headless:true});
          const base='http://127.0.0.1:4173';
          const widths=[1419,871,430];
          const out=path.join(process.env.GITHUB_WORKSPACE,'artifacts/style-b-prod-integration');
          fs.mkdirSync(out,{recursive:true});
          const report={};
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          const routes=[
            ['home','/site/index.html'],
            ['work','/site/work.html'],
            ['daily-hours','/site/work/daily-hours.html'],
            ['payment','/site/work/payment.html'],
            ['voucher','/site/work/voucher.html'],
            ['dbs','/site/work/dbs.html'],
            ['booking','/site/work/booking.html'],
            ['profile','/site/profile.html']
          ];
          try{
            for(const width of widths){
              const context=await browser.newContext({viewport:{width,height:1100},hasTouch:width===430,isMobile:width===430});
              const page=await context.newPage();
              const errors=[];
              page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
              page.on('pageerror',e=>errors.push(e.message));
              for(const [name,route] of routes){
                const response=await page.goto(base+route,{waitUntil:'networkidle'});
                assert(response?.ok(),`${name} ${width}: HTTP ${response?.status()}`);
                assert(await page.locator('.site-header').count()===1,`${name} ${width}: shared Header count`);
                assert(await page.locator('.site-footer').count()===1,`${name} ${width}: shared Footer count`);
                assert(await page.locator('[data-lang-toggle]').count()===0,`${name} ${width}: locale control leaked`);
                assert(await page.evaluate(()=>document.documentElement.lang)==='en',`${name} ${width}: lang not EN`);
                assert(await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth)<=1,`${name} ${width}: horizontal overflow`);
                if(name==='daily-hours'){
                  assert(await page.locator('[data-case-study-v2-root] .csv2-main, .csv2-main').count()>=1||await page.locator('[data-case-study-v2-root]').getAttribute('data-csv2-mounted')==='true',`Daily Hours ${width}: CSV2 not mounted`);
                  assert(await page.locator('.csv2-cta').count()===1,`Daily Hours ${width}: Request Demo CTA missing`);
                  if(width===1419) assert(await page.locator('.csv2-evidence-index').count()===1,`Daily Hours 1419: indexed evidence missing`);
                  if(width<=871) assert(await page.locator('.csv2-accordion').count()===1,`Daily Hours ${width}: accordion missing`);
                }
              }

              await page.goto(base+'/site/index.html',{waitUntil:'networkidle'});
              const domain=page.locator('#domains');
              await domain.scrollIntoViewIfNeeded();
              await page.waitForFunction(()=>document.querySelector('#domains')?.dataset.domainGoldenReferenceMounted==='true');
              const tabs=domain.locator('.domain-tab');
              assert(await tabs.count()===6,`Domain ${width}: tab count`);
              const operations=domain.locator('.domain-tab').filter({hasText:/Operational|Operations/i}).first();
              assert(await operations.count()===1,`Domain ${width}: Operations tab missing`);
              await operations.click();
              await page.waitForTimeout(160);
              assert(await domain.locator('.domain-project-card-v2[data-project="daily-hours"]').count()===1,`Domain ${width}: Daily Hours missing from Operations`);
              assert(await domain.locator('.domain-project-card-v2[data-project="daily-hours"] .domain-project-card-v2__cta').getAttribute('href')==='/work/daily-hours',`Domain ${width}: Daily Hours route`);
              if(width<=900) assert(await domain.locator('.domain-wheel-v2__control:visible').count()===0,`Domain ${width}: controls visible`);
              await domain.screenshot({path:path.join(out,`domain-${width}.png`)});

              await page.goto(base+'/site/work.html',{waitUntil:'networkidle'});
              await page.waitForSelector('.work-index[data-style-b-integrated="true"]',{timeout:10000});
              const work=page.locator('.work-index');
              assert(await work.locator('.work-card-v32[data-project-card-variant]').count()>=6,`Work ${width}: insufficient shared ProjectCards`);
              const dh=work.locator('.work-card-v32[data-work-index-project="daily-hours"]');
              assert(await dh.count()===1,`Work ${width}: Daily Hours card missing`);
              assert(await dh.locator('.work-card-v32__button').count()===1,`Work ${width}: Daily Hours not using shared ProjectCard control`);
              assert(await dh.locator('.project-card__meta').count()===1,`Work ${width}: Daily Hours shared card projection missing`);
              assert((await dh.getAttribute('data-work-categories'))?.split(/\s+/).includes('operations'),`Work ${width}: Daily Hours missing Operations taxonomy`);
              const allCards=work.locator('.work-card-v32[data-project-card-variant]');
              for(let i=0;i<await allCards.count();i++){
                const card=allCards.nth(i);
                assert(await card.locator('.project-card__meta').count()===1,`Work ${width}: card ${i+1} meta contract`);
                assert(await card.locator('.project-card__title').count()===1,`Work ${width}: card ${i+1} title contract`);
                assert(await card.locator('.work-card-v32__action').count()===1,`Work ${width}: card ${i+1} CTA contract`);
              }
              if(width===1419){
                const lead=work.locator('.work-index__featured > .work-card-v32');
                assert(await lead.count()===2,'Work 1419: lead pair');
                const [a,b]=await Promise.all([lead.nth(0).boundingBox(),lead.nth(1).boundingBox()]);
                assert(a&&b&&a.width>b.width*1.6,`Work 1419: hierarchy ${a?.width}/${b?.width}`);
              }
              await work.screenshot({path:path.join(out,`work-${width}.png`)});
              assert(errors.length===0,`Console errors ${width}: ${JSON.stringify(errors)}`);
              report[width]={cards:await allCards.count(),dailyHours:true};
              await context.close();
            }
          } finally {
            fs.writeFileSync(path.join(out,'report.json'),JSON.stringify(report,null,2));
            await browser.close();
          }
          NODE

      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: style-b-prod-integration
          path: artifacts/style-b-prod-integration
          retention-days: 3
