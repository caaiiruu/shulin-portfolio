name: Style B Motion and Responsive Contract

on:
  push:
    branches: [migration/style-b-domain-work-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  motion-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify scope and build
        run: |
          set -euo pipefail
          BASE=05291a4ba071d00d0098f227ea08069c774cb422
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --check "$BASE"...HEAD
          ! git diff --name-only "$BASE"...HEAD | grep -Fxq 'public/site/assets/js/app.js'
          test -f public/site/content/portfolio-content.json
          test -f public/site/content/portfolio-asset-manifest.json
          ! git diff --name-only "$BASE"...HEAD | grep -Fxq 'public/site/assets/css/components/project-card.css'
          npm run install:ci
          npm run build
          npm test

      - name: Install browser QA dependencies
        working-directory: public/site/qa
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start static QA server
        run: |
          PORT=4174 node tests/portfolio-static-server.mjs >/tmp/style-b-motion-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4174/site/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/style-b-motion-server.log
          exit 1

      - name: Verify Domain and Work motion contract
        working-directory: public/site/qa
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          const base='http://127.0.0.1:4174';
          const browser=await chromium.launch({headless:true});
          const assert=(value,message)=>{if(!value)throw new Error(message)};
          const overlap=(r,w)=>Math.max(0,Math.min(r.right,w)-Math.max(r.left,0));
          try{
            for(const width of [1419,871,430]){
              const context=await browser.newContext({viewport:{width,height:1100},reducedMotion:'no-preference'});
              const page=await context.newPage();
              const errors=[];
              page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
              page.on('pageerror',e=>errors.push(e.message));
              let response=await page.goto(`${base}/site/index.html`,{waitUntil:'networkidle'});
              assert(response?.ok(),`Domain ${width}: HTTP ${response?.status()}`);
              await page.waitForFunction(()=>document.querySelector('#domains')?.dataset.domainGoldenReferenceMounted==='true');
              const domain=page.locator('#domains');
              await domain.scrollIntoViewIfNeeded();
              await page.waitForSelector('#domains .domain-project-card-v2[data-wheel-offset="0"]');
              const active=domain.locator('.domain-project-card-v2[data-wheel-offset="0"]');
              const disclosures=domain.locator('details.domain-experience-disclosure');
              assert(await disclosures.count()===2,`Domain ${width}: disclosure count`);

              const borders=await disclosures.evaluateAll(nodes=>nodes.map(n=>parseFloat(getComputedStyle(n).borderTopWidth)||0));
              if(width>900) assert(borders.every(v=>v===0),`Domain ${width}: desktop disclosure divider returned ${borders}`);
              if(width===430) assert(borders[0]===0&&borders[1]>0,`Domain 430: stacked disclosure separator incorrect ${borders}`);

              const firstSummary=disclosures.nth(0).locator('summary');
              const summaryBefore=await firstSummary.evaluate(n=>({transform:getComputedStyle(n).transform,bg:getComputedStyle(n).backgroundColor}));
              await firstSummary.hover();await page.waitForTimeout(220);
              const summaryAfter=await firstSummary.evaluate(n=>({transform:getComputedStyle(n).transform,bg:getComputedStyle(n).backgroundColor}));
              assert(summaryBefore.transform!==summaryAfter.transform||summaryBefore.bg!==summaryAfter.bg,`Domain ${width}: disclosure hover motion missing`);
              await firstSummary.click();
              assert(await disclosures.nth(0).getAttribute('open')!==null,`Domain ${width}: disclosure did not open`);
              const reveal=await disclosures.nth(0).locator('ul').evaluate(n=>{const s=getComputedStyle(n);return{name:s.animationName,duration:s.animationDuration,opacity:s.opacity,transform:s.transform}});
              assert(reveal.name.includes('domain-disclosure-reveal')&&!/^0(?:s|ms)$/.test(reveal.duration),`Domain ${width}: disclosure reveal animation missing ${JSON.stringify(reveal)}`);
              await page.waitForTimeout(360);

              if(width===430){
                const mobile=await active.evaluate(card=>{
                  const type=card.querySelector('.domain-project-card-v2__type').getBoundingClientRect();
                  const identity=card.querySelector('.domain-project-card-v2__identity').getBoundingClientRect();
                  const title=card.querySelector('.domain-project-card-v2__title');
                  return{type:{top:type.top,bottom:type.bottom,left:type.left},identity:{top:identity.top,bottom:identity.bottom,left:identity.left},titleSize:parseFloat(getComputedStyle(title).fontSize)};
                });
                assert(mobile.identity.top>=mobile.type.bottom-1,`Domain 430: eyebrow is not two rows ${JSON.stringify(mobile)}`);
                assert(Math.abs(mobile.identity.left-mobile.type.left)<=2,`Domain 430: eyebrow rows not left aligned`);
                assert(mobile.titleSize>=31&&mobile.titleSize<=33,`Domain 430: title size ${mobile.titleSize}`);

                const adjacent=domain.locator('.domain-project-card-v2[data-wheel-offset="1"]');
                const prev=domain.locator('.domain-project-card-v2[data-wheel-offset="-1"]');
                const [nr,pr]=await Promise.all([adjacent.boundingBox(),prev.boundingBox()]);
                assert(nr&&pr,`Domain 430: adjacent cards missing`);
                const nextOverlap=overlap({left:nr.x,right:nr.x+nr.width},width);
                const prevOverlap=overlap({left:pr.x,right:pr.x+pr.width},width);
                assert(nextOverlap>=28&&prevOverlap>=28,`Domain 430: side cards do not peek ${prevOverlap}/${nextOverlap}`);
                const depth=await adjacent.evaluate(n=>{const s=getComputedStyle(n);const m=new DOMMatrix(s.transform);return{opacity:Number(s.opacity),scale:Math.hypot(m.a,m.b),rotation:Math.atan2(m.b,m.a)*180/Math.PI,duration:s.transitionDuration}});
                assert(depth.opacity>=.5&&depth.scale<.98&&Math.abs(depth.rotation)>=1,`Domain 430: wheel depth motion missing ${JSON.stringify(depth)}`);
                assert(depth.duration.split(',').some(v=>parseFloat(v)>=.35),`Domain 430: wheel transition too short ${depth.duration}`);

                const targetDomain=await domain.locator('.domain-tab').nth(0).getAttribute('data-domain');
                assert(targetDomain,'Domain 430: first tab missing data-domain');
                await domain.locator('.domain-tab').nth(0).click();
                await page.waitForFunction(expected=>{
                  const root=document.querySelector('#domains');
                  const selected=root?.querySelector('.domain-tab[aria-selected="true"]');
                  const activeCards=root?.querySelectorAll('.domain-project-card-v2[data-wheel-offset="0"]');
                  const visual=activeCards?.length===1?activeCards[0].querySelector('.domain-project-card-v2__visual'):null;
                  return selected?.getAttribute('data-domain')===expected&&activeCards?.length===1&&Boolean(visual?.isConnected);
                },targetDomain);
                await page.evaluate(()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve))));
                const stableActive=domain.locator('.domain-project-card-v2[data-wheel-offset="0"]');
                const first=await stableActive.getAttribute('data-project');
                const visual=stableActive.locator('.domain-project-card-v2__visual');
                await visual.evaluate(node=>node.scrollIntoView({block:'center',inline:'nearest'}));
                await page.waitForTimeout(60);
                const vb=await visual.boundingBox();
                assert(vb,'Domain 430: active visual missing');
                const cy=vb.y+vb.height*.5,sx=vb.x+vb.width*.68,ex=vb.x+vb.width*.32;
                const hit=await page.evaluate(({x,y})=>{
                  const node=document.elementFromPoint(x,y);
                  return{project:node?.closest('.domain-project-card-v2')?.getAttribute('data-project')||'',visual:Boolean(node?.closest('.domain-project-card-v2__visual'))};
                },{x:sx,y:cy});
                assert(hit.project===first&&hit.visual,`Domain 430: swipe start misses active visual ${JSON.stringify(hit)}`);
                await page.mouse.move(sx,cy);await page.mouse.down();await page.mouse.move(ex,cy,{steps:8});await page.mouse.up();
                await page.waitForTimeout(80);
                assert(await domain.locator('.domain-project-card-v2[data-wheel-offset="0"]').getAttribute('data-project')!==first,'Domain 430: swipe did not rotate wheel');
              }
              assert(errors.length===0,`Domain ${width}: console errors ${JSON.stringify(errors)}`);

              response=await page.goto(`${base}/site/work.html`,{waitUntil:'networkidle'});
              assert(response?.ok(),`Work ${width}: HTTP ${response?.status()}`);
              await page.waitForSelector('.work-index');
              await page.waitForFunction(()=>[...document.querySelectorAll('.work-index-card__image')].every(i=>i.complete&&i.naturalWidth>0));
              const hero=page.locator('.work-index-card--hero');
              if(width===430){
                const m=await hero.evaluate(card=>{
                  const type=card.querySelector('.work-index-card__type').getBoundingClientRect();
                  const identity=card.querySelector('.work-index-card__identity').getBoundingClientRect();
                  const title=card.querySelector('.work-index-card__title');
                  const metrics=card.querySelector('.work-index-card__metrics');
                  return{type:{top:type.top,bottom:type.bottom,left:type.left},identity:{top:identity.top,left:identity.left},titleSize:parseFloat(getComputedStyle(title).fontSize),metricBorder:parseFloat(getComputedStyle(metrics).borderTopWidth)||0};
                });
                assert(m.identity.top>=m.type.bottom-1,`Work 430: eyebrow is not two rows ${JSON.stringify(m)}`);
                assert(Math.abs(m.identity.left-m.type.left)<=2,'Work 430: eyebrow rows not left aligned');
                assert(m.titleSize>=34&&m.titleSize<=38,`Work 430: hero title size ${m.titleSize}`);
                assert(m.metricBorder===0,`Work 430: metrics top divider returned ${m.metricBorder}`);
              }
              await page.mouse.move(1,1);await page.waitForTimeout(60);
              const before=await hero.evaluate(card=>({card:getComputedStyle(card).transform,shadow:getComputedStyle(card).boxShadow,image:getComputedStyle(card.querySelector('.work-index-card__image')).transform,arrow:getComputedStyle(card.querySelector('.work-index-card__cta-arrow')).transform}));
              await hero.hover();await page.waitForTimeout(420);
              const after=await hero.evaluate(card=>({card:getComputedStyle(card).transform,shadow:getComputedStyle(card).boxShadow,image:getComputedStyle(card.querySelector('.work-index-card__image')).transform,arrow:getComputedStyle(card.querySelector('.work-index-card__cta-arrow')).transform}));
              assert(before.card!==after.card&&before.shadow!==after.shadow&&before.image!==after.image&&before.arrow!==after.arrow,`Work ${width}: coordinated hover motion missing`);
              await context.close();
            }

            const reduced=await browser.newContext({viewport:{width:430,height:900},reducedMotion:'reduce'});
            const reducedPage=await reduced.newPage();
            await reducedPage.goto(`${base}/site/index.html`,{waitUntil:'networkidle'});
            await reducedPage.waitForFunction(()=>document.querySelector('#domains')?.dataset.domainGoldenReferenceMounted==='true');
            const reducedState=await reducedPage.locator('#domains').evaluate(root=>({card:getComputedStyle(root.querySelector('.domain-project-card-v2')).transitionDuration,summary:getComputedStyle(root.querySelector('.domain-experience-disclosure__summary')).transitionDuration}));
            const effectivelyZero=value=>value.split(',').every(v=>parseFloat(v)<=.00002);
            assert(effectivelyZero(reducedState.card)&&effectivelyZero(reducedState.summary),`Reduced motion contract failed ${JSON.stringify(reducedState)}`);
            await reduced.close();
          } finally { await browser.close(); }
          NODE