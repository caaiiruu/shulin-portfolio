        run: |
          set -euo pipefail
          cd "$EXACT_WORKTREE"
          node <<'NODE' 2>&1 | tee "$EVIDENCE_DIR/runtime-assertions.log"
          const fs=require('fs'),assert=require('assert/strict'),crypto=require('crypto');
          const data=JSON.parse(fs.readFileSync(process.env.CONTENT_PATH,'utf8'));
          const app=fs.readFileSync('public/site/assets/js/app.js','utf8');
          const home = fs.readFileSync(
            'public/site/assets/js/home.js',
            'utf8'
          );
          const projectDetailCss=fs.readFileSync(
            'public/site/assets/css/components/project-detail-overview.css',
            'utf8'
          );
          assert.equal(data.contentVersion,'2026-08-06-r146');
          const projectEntries=Object.entries(data.projects);
          assert.equal(projectEntries.length,13);
          const projectIds=projectEntries.map(([id])=>id);
          assert.equal(new Set(projectIds).size,13);
          const recordsWithLegacyId=[];
          const recordsWithoutLegacyId=[];
          let runtimeProjectionMatches=0;
          for(const [id,p] of projectEntries){
            assert.equal(typeof id,'string');
            assert.ok(id.length>0,`${id} canonical project key`);
            assert.ok(p&&typeof p==='object',`${id} project record`);
            assert.ok(p.searchIndexV2&&typeof p.searchIndexV2==='object',`${id} search projection`);
            const sourceProjectionId=p.searchIndexV2.canonicalId??p.searchIndexV2.canonicalProjectId;
            assert.equal(sourceProjectionId,id,`${id} projection source identity`);
            runtimeProjectionMatches+=1;
            if(Object.hasOwn(p,'id')){
              assert.equal(p.id,id,`${id} optional legacy identity must match canonical key`);
              recordsWithLegacyId.push(id);
            }else{
              recordsWithoutLegacyId.push(id);
            }
          }
          assert.deepEqual(recordsWithoutLegacyId.sort(),['booking','dbs','voucher','voucher-center']);
          assert.equal(recordsWithLegacyId.length,9);
          const appCompact=app.replace(/\s+/g,'');
          assert.ok(
            appCompact.includes('Object.fromEntries(Object.entries(raw.projects||{}).map(([id,p])=>'),
            'adaptContent must preserve Object.entries project keys'
          );
          assert.ok(
            appCompact.includes('searchIndexV2={...searchIndex,canonicalId:id,'),
            'Runtime canonicalId must come from the entry key'
          );
          assert.ok(
            appCompact.includes('Object.entries(DATA.projects).map(([key,item])=>')&&
            appCompact.includes('DATA.projects[key]'),
            'search projection must resolve canonical project keys'
          );
          assert.ok(
            appCompact.includes("openDetail('project',key)")&&
            appCompact.includes('source=DATA.projects[key]'),
            'detail route lookup must resolve canonical project keys'
          );
          assert.ok(
            appCompact.includes('DATA.projects[alias.canonicalProjectId]'),
            'route aliases must resolve to canonical project keys'
          );
          assert.equal(runtimeProjectionMatches,13);
          assert.ok(data.projects['booking-taxi-pickup-service-strategy']);
          assert.equal(data.projectAliasRegistry['online-auction-payment-platform'].canonicalProjectId,'taishin-p2p-marketplace-platform');
          assert.equal(data.projectAliasRegistry['online-auction-payment-platform'].routePolicy,'permanent-redirect');
          const projected=Object.entries(data.projects).filter(([,p])=>p.searchIndexV2).map(([id])=>id);
          assert.equal(projected.length,13);assert.equal(new Set(projected).size,13);
          assert.ok(data.sourceArchives&&!projected.some(id=>Object.hasOwn(data.sourceArchives,id)));
          assert.ok(!app.includes("contentVersion === '2026-08-03-r108'")&&!app.includes('contentVersion === "2026-08-03-r108"'));
          assert.ok(app.includes('localize(project.company)'));
          assert.ok(app.includes('localize(project.domain_label)'));
          assert.ok(home.includes('localize(project?.company)'));
          assert.ok(home.includes('localize(project?.domain_label)'));
          assert.ok(projectDetailCss.includes('.voucher-composition-v119__placeholder strong{max-width:var(--dimension-32ch);color:var(--color-text-muted);font-size:var(--text-xs)}'));
          assert.ok(!projectDetailCss.includes('overflow-wrap:anywhere'));
          assert.ok(!projectDetailCss.includes('word-break:break-all'));
          assert.equal(crypto.createHash('sha256').update(fs.readFileSync(process.env.CONTENT_PATH)).digest('hex'),process.env.EXPECTED_CONTENT_SHA256);
          const manifestBytes=fs.readFileSync(process.env.MANIFEST_PATH);
          const manifest=JSON.parse(manifestBytes);
          const assetIds=Object.keys(manifest.items||{});
          assert.equal(manifest.packageVersion,'r42');
          assert.equal(manifest.contentVersion,'2026-07-31-r83');
          assert.equal(assetIds.length,250);
          assert.equal(new Set(assetIds).size,250);
          assert.equal(assetIds.length-new Set(assetIds).size,0);
          assert.equal(crypto.createHash('sha256').update(manifestBytes).digest('hex'),process.env.APPROVED_R42_SHA256);
          for(const id of ['voucher-center-framework-wallet-checkout-task-model-public-v1','voucher-center-evidence-phase1-research-to-shipped-public-v1']) assert.ok(!Object.hasOwn(manifest.items,id),id);
          console.log(JSON.stringify({result:'PASS',contentVersion:data.contentVersion,projectCount:13,canonicalProjectsResolved:13,bookingTaxiRoute:true,onlineAuctionRedirect:'taishin-p2p-marketplace-platform',searchProjection:'13/13',sourceArchivesPublicSearch:false,r108OnlyGuard:false,r146Guard:true,assetManifest:{packageVersion:manifest.packageVersion,contentVersion:manifest.contentVersion,items:assetIds.length,uniqueIds:new Set(assetIds).size,duplicateIds:0,sha256:process.env.APPROVED_R42_SHA256,deferredIdsAbsent:true}},null,2));
          NODE
          test "$(sha256sum public/site/assets/js/app.js | cut -d' ' -f1)" = 7dfbf56f5f61a3ba175d9568501c4586af4bc647e0dff0ae7fdbc60b16e60693
          test "$(sha256sum public/site/assets/js/home.js | cut -d' ' -f1)" = 6b68abb20c7c0750126e9bf4f85ba71239be330474a9106c653d639fd3cbfbaa
          test "$(sha256sum "$MANIFEST_PATH" | cut -d' ' -f1)" = "$APPROVED_R42_SHA256"
          test "$(sha256sum public/site/assets/css/components/project-detail-overview.css | cut -d' ' -f1)" = "$CSS_COMPATIBILITY_FILE_SHA256"
          test -z "$(git diff --name-only "$BASE_SHA"..HEAD -- package.json package-lock.json)"

      - name: Run production build
        shell: bash
        run: |
          set -euo pipefail
          cd "$EXACT_WORKTREE"
          npm run build 2>&1 | tee "$EVIDENCE_DIR/build.log"
          git diff --binary > "$EVIDENCE_DIR/build-first.diff"
          npm run build 2>&1 | tee -a "$EVIDENCE_DIR/build.log"
          git diff --binary > "$EVIDENCE_DIR/build-second.diff"
          cmp "$EVIDENCE_DIR/build-first.diff" "$EVIDENCE_DIR/build-second.diff"

      - name: Verify clean tracked worktree
        shell: bash
        run: |
          set -euo pipefail
          cd "$EXACT_WORKTREE"
          git diff --check
          git status --porcelain --untracked-files=all | tee "$EVIDENCE_DIR/tracked-status.log"
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          evidence=Path(os.environ['EVIDENCE_DIR'])
          status=(evidence/'tracked-status.log').read_text().splitlines()
          paths=sorted({line[3:] for line in status if line and ' -> ' not in line[3:]})
          (evidence/'generated-paths.txt').write_text(''.join(p+'\n' for p in paths))
          allowed=[]; unexpected=[]
          for p in paths:
              if re.fullmatch(r'public/site/assets/(js|css)/production\.[0-9a-f]+\.(js|css)',p) or (p.startswith('public/site/') and p.endswith('.html')):
                  allowed.append(p)
              else: unexpected.append(p)
          report={'result':'PASS' if not unexpected else 'BLOCKED — UNEXPECTED BUILD TRACKED DIFF','owner':'scripts/build-production-assets.mjs','generatedPaths':allowed,'unexpectedSourceChanges':unexpected,'deterministic':True}
          (evidence/'generated-output-audit.json').write_text(json.dumps(report,indent=2)+'\n')
          if unexpected: raise SystemExit('BLOCKED — UNEXPECTED BUILD TRACKED DIFF: '+', '.join(unexpected))
          PY
          if test -s "$EVIDENCE_DIR/generated-paths.txt"; then
            xargs -d '\n' git add -A -- < "$EVIDENCE_DIR/generated-paths.txt"
            git diff --cached --name-only | sort | diff -u "$EVIDENCE_DIR/generated-paths.txt" -
            git commit -m 'build: regenerate production assets after recovery compatibility'
            generated_sha="$(git rev-parse HEAD)"
            printf 'GENERATED_SHA=%s\n' "$generated_sha" >> "$GITHUB_ENV"
            test "$(git rev-parse HEAD^)" = "$CSS_COMPATIBILITY_SHA"
          else
            printf 'GENERATED_SHA=\n' >> "$GITHUB_ENV"
          fi
          test -z "$(git status --porcelain --untracked-files=no)"
          test "$(git rev-list --count "$BASE_SHA"..HEAD)" -ge 5
          test "$(git rev-list --count "$BASE_SHA"..HEAD)" -le 6
          test "$(git rev-parse "$EXACT_CONTENT_SHA^")" = "$BASE_SHA"
          test "$(git rev-parse "$CANONICAL_MANIFEST_SHA^")" = "$EXACT_CONTENT_SHA"
          test "$(git rev-parse "$EXACT_RUNTIME_SHA^")" = "$CANONICAL_MANIFEST_SHA"
          test "$(git rev-parse "$COMPATIBILITY_SHA^")" = "$EXACT_RUNTIME_SHA"
          test "$(git rev-parse "$CSS_COMPATIBILITY_SHA^")" = "$COMPATIBILITY_SHA"
          {
            printf '%s  %s\n' "$EXPECTED_CONTENT_SHA256" "$CONTENT_PATH"
            printf '%s  %s\n' "$APPROVED_R42_SHA256" "$MANIFEST_PATH"
            grep -v 'public/site/assets/js/app.js\|public/site/assets/js/home.js' "$EVIDENCE_DIR/runtime-expected-sha256.txt"
            printf '%s  %s\n' 7dfbf56f5f61a3ba175d9568501c4586af4bc647e0dff0ae7fdbc60b16e60693 public/site/assets/js/app.js
            printf '%s  %s\n' 6b68abb20c7c0750126e9bf4f85ba71239be330474a9106c653d639fd3cbfbaa public/site/assets/js/home.js
            printf '%s  %s\n' "$CSS_COMPATIBILITY_FILE_SHA256" public/site/assets/css/components/project-detail-overview.css
          } > "$EVIDENCE_DIR/exact-file-hashes.txt"
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          fs.writeFileSync(path.join(process.env.EVIDENCE_DIR,'exact-verification-report.json'),JSON.stringify({result:'PASS',baseSha:process.env.BASE_SHA,contentCommitSha:process.env.EXACT_CONTENT_SHA,canonicalManifestCommitSha:process.env.CANONICAL_MANIFEST_SHA,runtimeCommitSha:process.env.EXACT_RUNTIME_SHA,compatibilityCommitSha:process.env.COMPATIBILITY_SHA,cssCompatibilityCommitSha:process.env.CSS_COMPATIBILITY_SHA,generatedCommitSha:process.env.GENERATED_SHA||null,finalHead:require('child_process').execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),contentVersion:'2026-08-06-r146',projectCount:13,tests:'PASS',runtimeAssertions:'PASS',build:'PASS',assetManifestVersion:'r42',assetManifestContentVersion:'2026-07-31-r83',assetManifestItems:250,assetManifestUniqueIds:250,assetManifestSha256:process.env.APPROVED_R42_SHA256,cssForcedWrapAbsent:true,dependenciesChanged:false},null,2)+'\n');
          NODE
          cp "$EVIDENCE_DIR/exact-verification-report.json" "$EVIDENCE_DIR/final-verification-report.json"

      - name: Push exact staging branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$EXACT_WORKTREE"
          if git ls-remote --exit-code --heads origin "refs/heads/$EXACT_BRANCH"; then
            printf '%s\n' 'Exact staging branch appeared before push' >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/$EXACT_BRANCH" 2>&1 | tee "$EVIDENCE_DIR/push.log"

      - name: Create and verify Git bundle
        shell: bash
        run: |
          set -euo pipefail
          cd "$EXACT_WORKTREE"
          git bundle create "$EVIDENCE_DIR/recovery-r146-exact-2026-08-06.bundle" "refs/heads/$EXACT_BRANCH"
          git bundle verify "$EVIDENCE_DIR/recovery-r146-exact-2026-08-06.bundle" 2>&1 | tee "$EVIDENCE_DIR/bundle-verification.log"

      - name: Upload success recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: r146-exact-recovery-bridge
          path: |
            ${{ runner.temp }}/r146-exact-bootstrap-evidence/recovery-r146-exact-2026-08-06.bundle
            ${{ runner.temp }}/r146-exact-bootstrap-evidence/exact-verification-report.json
            ${{ runner.temp }}/r146-exact-bootstrap-evidence/final-verification-report.json
            ${{ runner.temp }}/r146-exact-bootstrap-evidence/exact-content-commit-audit.json
            ${{ runner.temp }}/r146-exact-bootstrap-evidence/canonical-manifest-commit-audit.json
            ${{ runner.temp }}/r146-exact-bootstrap-evidence/exact-runtime-commit-audit.json
            ${{ runner.temp }}/r146-exact-bootstrap-evidence/project-card-compatibility-commit-audit.json
            ${{ runner.temp }}/r146-exact-bootstrap-evidence/css-compatibility-commit-audit.json
            ${{ runner.temp }}/r146-exact-bootstrap-evidence/generated-output-audit.json
            ${{ runner.temp }}/r146-exact-bootstrap-evidence/exact-file-hashes.txt
            ${{ runner.temp }}/r146-exact-bootstrap-evidence/tests.log
            ${{ runner.temp }}/r146-exact-bootstrap-evidence/runtime-assertions.log
            ${{ runner.temp }}/r146-exact-bootstrap-evidence/build.log
            ${{ runner.temp }}/r146-exact-bootstrap-evidence/push.log
            ${{ runner.temp }}/r146-exact-bootstrap-evidence/bundle-verification.log
          retention-days: 7
          if-no-files-found: error

      - name: Upload diagnostics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r146-exact-bootstrap-diagnostics
          path: ${{ runner.temp }}/r146-exact-bootstrap-evidence
          retention-days: 7
          if-no-files-found: warn
