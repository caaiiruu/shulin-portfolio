name: Bootstrap exact r146 recovery

on:
  push:
    branches:
      - recovery/bootstrap-r146-exact-2026-08-06
    paths:
      - .github/workflows/bootstrap-r146-exact.yml

permissions:
  contents: write

concurrency:
  group: r146-exact-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap-exact-recovery:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: 6fb96ba299789374ad5356d109e10c2d496d8041
      BOOTSTRAP_BRANCH: recovery/bootstrap-r146-exact-2026-08-06
      EXACT_BRANCH: recovery/staging-r146-exact-2026-08-06
      CONTENT_PATH: public/site/content/portfolio-content.json
      EXPECTED_CONTENT_SHA256: fe072e4fbccb99dea80085e29dc29c5001f447ea636684477b3dee7f29c28bd6
      APPROVED_R42_SHA256: f49a12cdab29400d8f8458e6f8a7b1d9631bd329b04e99358f371ea57f69e500
      BASE_R42_SHA256: 25030d5d512107d29c58ea79d04f2d26ee34e85157bf4d5551a7eac22e439487
      MANIFEST_PATH: public/site/content/portfolio-asset-manifest.json
    steps:
      - name: Checkout bootstrap repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node 22.13.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Initialize external directories
        shell: bash
        run: |
          set -euo pipefail
          printf 'EVIDENCE_DIR=%s\n' \
            "$RUNNER_TEMP/r146-exact-bootstrap-evidence" \
            >> "$GITHUB_ENV"
          printf 'PAYLOAD_DIR=%s\n' \
            "$RUNNER_TEMP/r146-exact-payload" \
            >> "$GITHUB_ENV"
          printf 'EXACT_WORKTREE=%s\n' \
            "$RUNNER_TEMP/r146-exact-worktree" \
            >> "$GITHUB_ENV"

      - name: Verify bootstrap source state
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$EVIDENCE_DIR" "$PAYLOAD_DIR" "$EXACT_WORKTREE"
          mkdir -p "$EVIDENCE_DIR" "$PAYLOAD_DIR"
          test "$(git branch --show-current)" = "$BOOTSTRAP_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse --verify "$BASE_SHA^{commit}" > /dev/null
          git fsck --full 2>&1 | tee "$EVIDENCE_DIR/git-fsck.log"
          test -d .recovery/r146-exact-payload
          python3 - <<'PY'
          from pathlib import Path
          root = Path('.recovery/r146-exact-payload')
          expected = [root / f'chunk-{i:04d}.b64' for i in range(12)]
          missing = [str(p) for p in expected if not p.is_file()]
          if missing:
              raise SystemExit(f'missing chunks: {missing}')
          if not (root / 'payload-manifest.json').is_file():
              raise SystemExit('payload-manifest.json is missing')
          actual = sorted(root.glob('chunk-*.b64'))
          if len(actual) != 12:
              raise SystemExit(f'chunk count is {len(actual)}, expected 12')
          PY
          test -z "$(git status --porcelain --untracked-files=no)"
          if git ls-remote --exit-code --heads origin "refs/heads/$EXACT_BRANCH"; then
            printf '%s\n' 'Exact staging branch already exists' >&2
            exit 1
          fi

      - name: Reconstruct and verify payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, shutil, zipfile
          from pathlib import Path, PurePosixPath

          source = Path('.recovery/r146-exact-payload')
          payload = Path(os.environ['PAYLOAD_DIR'])
          evidence = Path(os.environ['EVIDENCE_DIR'])
          manifest = json.loads((source / 'payload-manifest.json').read_text('utf-8'))
          expected_names = [f'chunk-{i:04d}.b64' for i in range(12)]
          chunks = manifest['chunks']
          names = [item['filename'] for item in chunks]
          if names != expected_names or manifest['chunkCount'] != 12:
              raise SystemExit('manifest chunk ordering/count mismatch')
          checks = []
          encoded_parts = []
          for item in chunks:
              path = source / item['filename']
              raw = path.read_bytes()
              raw.decode('ascii')
              digest = hashlib.sha256(raw).hexdigest()
              if digest != item['sha256'] or len(raw) != item['characterCount']:
                  raise SystemExit(f'chunk verification failed: {path.name}')
              checks.append({'filename': path.name, 'characterCount': len(raw), 'sha256': digest})
              encoded_parts.append(raw)
          encoded = b''.join(encoded_parts)
          if len(encoded) != manifest['base64CharacterCount'] or len(encoded) != 1046048:
              raise SystemExit('base64 character count mismatch')
          archive = base64.b64decode(encoded, validate=True)
          archive_sha = hashlib.sha256(archive).hexdigest()
          if len(archive) != manifest['archiveByteSize']:
              raise SystemExit('archive byte size mismatch')
          if archive_sha != manifest['archiveSha256'] or archive_sha != 'b18b728a3f707b9e014022ec1334d592f22b85d5e423017e3fdb4ba3b62ebbab':
              raise SystemExit('archive SHA-256 mismatch')
          archive_path = Path(os.environ['RUNNER_TEMP']) / manifest['archiveFilename']
          archive_path.write_bytes(archive)
          if not zipfile.is_zipfile(archive_path):
              raise SystemExit('reconstructed archive is not a ZIP')
          with zipfile.ZipFile(archive_path) as zf:
              for info in zf.infolist():
                  pure = PurePosixPath(info.filename)
                  if pure.is_absolute() or '..' in pure.parts:
                      raise SystemExit(f'unsafe ZIP path: {info.filename}')
                  target = (payload / pure).resolve()
                  if payload.resolve() not in target.parents and target != payload.resolve():
                      raise SystemExit(f'ZIP traversal: {info.filename}')
              zf.extractall(payload)
          extracted = []
          for item in manifest['files']:
              path = payload / item['path']
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest != item['sha256']:
                  raise SystemExit(f'extracted hash mismatch: {item["path"]}')
              extracted.append((digest, item['path']))
          if len(extracted) != 8:
              raise SystemExit('extracted file count mismatch')
          content = json.loads((payload / 'public/site/content/portfolio-content.json').read_text('utf-8'))
          if content.get('contentVersion') != '2026-08-06-r146' or len(content.get('projects', {})) != 13:
              raise SystemExit('content semantic verification failed')
          (evidence / 'chunk-verification.json').write_text(json.dumps({'result':'PASS','chunks':checks}, indent=2)+'\n')
          (evidence / 'archive-verification.json').write_text(json.dumps({'result':'PASS','byteSize':len(archive),'sha256':archive_sha}, indent=2)+'\n')
          (evidence / 'extracted-file-hashes.txt').write_text(''.join(f'{h}  {p}\n' for h,p in extracted))
          (evidence / 'payload-reconstruction-report.json').write_text(json.dumps({'result':'PASS','contentVersion':content['contentVersion'],'projectCount':13,'filesVerified':'8/8'}, indent=2)+'\n')
          PY

      - name: Create clean exact worktree from base
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$EXACT_WORKTREE" "$BASE_SHA"
          cd "$EXACT_WORKTREE"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test -z "$(git status --porcelain)"
          git switch -c "$EXACT_BRANCH"
          test "$(node -p "JSON.parse(require('fs').readFileSync('public/site/content/portfolio-asset-manifest.json')).packageVersion")" = r42
          git show "$BASE_SHA:package.json" | cmp - package.json
          git show "$BASE_SHA:package-lock.json" | cmp - package-lock.json
          git config user.name "r146 Recovery Bootstrap"
          git config user.email "63276875+caaiiruu@users.noreply.github.com"

      - name: Create exact Content commit
        shell: bash
        run: |
          set -euo pipefail
          cd "$EXACT_WORKTREE"
          install -D -m 0644 "$PAYLOAD_DIR/$CONTENT_PATH" "$CONTENT_PATH"
          test "$(sha256sum "$CONTENT_PATH" | cut -d' ' -f1)" = "$EXPECTED_CONTENT_SHA256"
          git add -- "$CONTENT_PATH"
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          test "$(git diff --cached --name-only)" = "$CONTENT_PATH"
          git commit -m 'content: preserve exact r146 canonical SSOT'
          exact_content_sha="$(git rev-parse HEAD)"
          printf 'EXACT_CONTENT_SHA=%s\n' "$exact_content_sha" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | wc -l)" -eq 1
          git cat-file blob "$exact_content_sha:$CONTENT_PATH" | sha256sum | cut -d' ' -f1 | grep -Fx "$EXPECTED_CONTENT_SHA256"
          node - <<'NODE'
          const fs=require('fs'),path=require('path'),cp=require('child_process');
          const out=process.env.EVIDENCE_DIR;
          fs.writeFileSync(path.join(out,'exact-content-commit-audit.json'),JSON.stringify({result:'PASS',commit:cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),parent:process.env.BASE_SHA,changedFiles:[process.env.CONTENT_PATH],sha256:process.env.EXPECTED_CONTENT_SHA256},null,2)+'\n');
          NODE


      - name: Create canonical r42 Asset Manifest commit
        shell: bash
        run: |
          set -euo pipefail
          cd "$EXACT_WORKTREE"
          test "$(git rev-parse HEAD)" = "$EXACT_CONTENT_SHA"
          test -z "$(git status --porcelain)"
          test "$(sha256sum "$MANIFEST_PATH" | cut -d' ' -f1)" = "$BASE_R42_SHA256"
          node - <<'NODE'
          const fs=require('fs'),assert=require('assert/strict');
          const manifest=JSON.parse(fs.readFileSync(process.env.MANIFEST_PATH,'utf8'));
          const ids=Object.keys(manifest.items||{});
          assert.equal(manifest.packageVersion,'r42');
          assert.equal(manifest.contentVersion,'2026-07-31-r83');
          assert.equal(ids.length,252);
          assert.equal(new Set(ids).size,252);
          NODE
