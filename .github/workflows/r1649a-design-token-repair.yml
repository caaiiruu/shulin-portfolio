name: R164.9A Design token repair
on:
  pull_request:
    branches:
      - qa/r146-r43-preview-2026-08-06
permissions:
  contents: write
jobs:
  repair:
    if: github.head_ref == 'repair/r164-payment-final'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Replace local Payment typography and spacing with shared tokens
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const p='public/site/assets/css/components/project-detail-overview.css';
          let s=fs.readFileSync(p,'utf8');
          const old='.voucher-r149-foundation--raw .voucher-r149-foundation__media img{display:block;width:100%;height:auto;object-fit:contain}.structured-evidence-quotes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;margin-top:32px}.structured-evidence-quote{margin:0;padding:28px;border-left:4px solid var(--color-ink,#202420);background:var(--color-surface-soft,#f7f6f2)}.structured-evidence-quote blockquote{margin:0 0 20px;font-size:clamp(1.125rem,1.7vw,1.375rem);line-height:1.45;color:var(--color-ink,#202420)}.outcome-metric--featured{grid-column:span 2;padding-block:36px}.outcome-metric--featured .outcome-metric__value{font-size:clamp(4rem,8vw,7rem)}.outcome-metric--subordinate{background:transparent;border-style:dashed}.outcome-metric--subordinate .outcome-metric__value{font-size:clamp(2rem,4vw,3rem)}.outcome-recognition-proof--direct,.outcome-recognition-proof--direct .outcome-recognition-proof__link{padding:0;background:transparent;border:0;box-shadow:none}.outcome-recognition-proof--direct .outcome-recognition-proof__media{border-radius:var(--radius-lg,24px);overflow:hidden}@media(max-width:560px){.structured-evidence-quotes{grid-template-columns:1fr;gap:16px}.structured-evidence-quote{padding:22px}.outcome-metric--featured{grid-column:1}.outcome-metric--featured .outcome-metric__value{font-size:clamp(3.5rem,18vw,5rem)}}';
          const next='.voucher-r149-foundation--raw .voucher-r149-foundation__media img{display:block;width:100%;height:auto;object-fit:contain}.structured-evidence-quotes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-5);margin-top:var(--space-6)}.structured-evidence-quote{margin:0;padding:var(--space-5);border-left:var(--dimension-4px) solid var(--color-text-primary);background:var(--color-surface-soft)}.structured-evidence-quote blockquote{margin:0 0 var(--space-4);font-size:var(--cmp-popup-card-title-size);line-height:var(--leading-body);color:var(--color-text-primary)}.outcome-metric--featured{grid-column:span 2;padding-block:var(--space-6)}.outcome-metric--featured .outcome-metric__value,.outcome-metric--subordinate .outcome-metric__value{font-size:var(--cmp-popup-outcome-metric-size)}.outcome-metric--subordinate{background:transparent;border-style:dashed}.outcome-recognition-proof--direct,.outcome-recognition-proof--direct .outcome-recognition-proof__link{padding:0;background:transparent;border:0;box-shadow:none}.outcome-recognition-proof--direct .outcome-recognition-proof__media{border-radius:var(--radius-lg);overflow:hidden}@media(max-width:560px){.structured-evidence-quotes{grid-template-columns:1fr;gap:var(--space-4)}.structured-evidence-quote{padding:var(--space-5)}.outcome-metric--featured{grid-column:1}}';
          if(!s.includes(old)) throw new Error('Expected R164.9 CSS block not found exactly');
          s=s.replace(old,next);
          fs.writeFileSync(p,s);
          NODE
          rm .github/workflows/r1649a-design-token-repair.yml
          node public/site/qa/design-system-lint.mjs
          node public/site/qa/token-governance.mjs
          git diff --check
      - name: Commit proven design-token repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Portfolio R164.9 Integration'
          git config user.email 'actions@users.noreply.github.com'
          git add -A -- public/site/assets/css/components/project-detail-overview.css .github/workflows/r1649a-design-token-repair.yml
          git commit -m 'R164.9A align Payment evidence variants to shared tokens'
          echo "REPAIR_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:repair/r164-payment-final
