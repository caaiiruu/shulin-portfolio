name: Style B Cathay QA Contract Repair

on:
  push:
    branches:
      - migration/style-b-domain-work-v1

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Repair Style B Cathay QA contracts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: migration/style-b-domain-work-v1

      - name: Repair exact QA contracts for approved SSOT change
        run: |
          node <<'NODE'
          const fs=require('fs');

          const patch=(path,from,to)=>{
            const source=fs.readFileSync(path,'utf8');
            if(!source.includes(from)) throw new Error(`Expected contract fragment missing in ${path}: ${from}`);
            fs.writeFileSync(path,source.replace(from,to));
          };

          patch(
            '.github/workflows/style-b-domain-work-qa.yml',
            "          ! grep -Fxq 'public/site/content/portfolio-content.json' /tmp/changed.txt\n",
            "          test -f public/site/content/portfolio-content.json\n          test -f public/site/content/portfolio-asset-manifest.json\n"
          );

          patch(
            '.github/workflows/style-b-motion-contract.yml',
            "          ! git diff --name-only \"$BASE\"...HEAD | grep -Fxq 'public/site/content/portfolio-content.json'\n",
            "          test -f public/site/content/portfolio-content.json\n          test -f public/site/content/portfolio-asset-manifest.json\n"
          );

          patch(
            '.github/workflows/style-b-motion-contract.yml',
            "                assert(mobile.titleSize>=34&&mobile.titleSize<=38,`Domain 430: title size ${mobile.titleSize}`);",
            "                assert(mobile.titleSize>=31&&mobile.titleSize<=33,`Domain 430: title size ${mobile.titleSize}`);"
          );

          patch(
            '.github/workflows/style-b-mobile-card-overflow.yml',
            "                metricsBox:{top:mr?.top||0,bottom:mr?.bottom||0,height:mr?.height||0},",
            "                hasMetrics:Boolean(metrics),\n                metricsBox:{top:mr?.top||0,bottom:mr?.bottom||0,height:mr?.height||0},"
          );

          patch(
            '.github/workflows/style-b-mobile-card-overflow.yml',
            "            assert(state.titleBox.bottom<=state.metricsBox.top+1,`${label}: title overlaps metrics ${JSON.stringify(state)}`);\n            assert(state.metricsBox.bottom<=state.ctaBox.top+1,`${label}: metrics overlap CTA ${JSON.stringify(state)}`);",
            "            if(state.hasMetrics){\n              assert(state.titleBox.bottom<=state.metricsBox.top+1,`${label}: title overlaps metrics ${JSON.stringify(state)}`);\n              assert(state.metricsBox.bottom<=state.ctaBox.top+1,`${label}: metrics overlap CTA ${JSON.stringify(state)}`);\n            }else{\n              assert(state.titleBox.bottom<=state.ctaBox.top+1,`${label}: title overlaps CTA ${JSON.stringify(state)}`);\n            }"
          );

          // Add explicit recruiter-facing naming consistency to the 430 all-card gate.
          patch(
            '.github/workflows/style-b-mobile-card-overflow.yml',
            "          const assert=(value,message)=>{if(!value)throw new Error(message)};\n",
            "          const assert=(value,message)=>{if(!value)throw new Error(message)};\n          const cathayExpected={\n            'cathay-mortgage-assistant':'From rigid scripts to flexible mortgage consultation',\n            'cathay-sit-review-remediation-operations':'From interface issues to prioritised remediation',\n            'cathay-sit-online-account-opening':'From fragmented steps to end-to-end account opening'\n          };\n"
          );

          patch(
            '.github/workflows/style-b-mobile-card-overflow.yml',
            "            assert(state.companyBox.height<=40,`${label}: company eyebrow too tall ${JSON.stringify(state)}`);",
            "            assert(state.companyBox.height<=40,`${label}: company eyebrow too tall ${JSON.stringify(state)}`);\n            if(cathayExpected[state.project]){\n              assert(state.company==='Cathay',`${label}: Cathay company label drifted: ${state.company}`);\n              assert(state.title===cathayExpected[state.project],`${label}: canonical card title drifted: ${state.title}`);\n            }"
          );

          // Add an SSOT identity check to the Human Contract gate so content and asset
          // manifest remain atomic and the three approved names stay canonical.
          patch(
            '.github/workflows/style-b-domain-work-qa.yml',
            "      - name: Install build and validate source\n",
            "      - name: Verify approved Cathay canonical SSOT\n        run: |\n          node <<'NODE'\n          const fs=require('fs');\n          const data=JSON.parse(fs.readFileSync('public/site/content/portfolio-content.json','utf8'));\n          const manifest=JSON.parse(fs.readFileSync('public/site/content/portfolio-asset-manifest.json','utf8'));\n          if(data.contentVersion!==manifest.contentVersion) throw new Error('Content/asset manifest version drift');\n          const expected={\n            'cathay-mortgage-assistant':'From rigid scripts to flexible mortgage consultation',\n            'cathay-sit-review-remediation-operations':'From interface issues to prioritised remediation',\n            'cathay-sit-online-account-opening':'From fragmented steps to end-to-end account opening'\n          };\n          for(const [id,title] of Object.entries(expected)){\n            const p=data.projects?.[id];\n            if(!p) throw new Error(`Missing ${id}`);\n            if(p.company!=='Cathay'||p.heroMetadata?.company!=='Cathay') throw new Error(`${id}: company not canonical Cathay`);\n            if(p.title?.en!==title||p.transformation!==title) throw new Error(`${id}: title/transformation drift`);\n          }\n          NODE\n\n      - name: Install build and validate source\n"
          );
          NODE

      - name: Commit repaired QA contracts
        run: |
          git config user.name 'caiiru'
          git config user.email '63276875+caaiiruu@users.noreply.github.com'
          git add .github/workflows/style-b-domain-work-qa.yml .github/workflows/style-b-motion-contract.yml .github/workflows/style-b-mobile-card-overflow.yml
          git diff --cached --check
          git commit -m 'Align Style B QA with canonical Cathay naming'
          git push origin HEAD:migration/style-b-domain-work-v1
