name: Deploy Vercel preview

on:
  push:
    branches:
      - deploy/vercel-preview-2026-08-05
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_nD9NNfDwlkTJJ2wtplVSaxHO
      VERCEL_PROJECT_ID: prj_XJxTzDxihUexNiSzUmFHNzXBBwUk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify complete static artifact
        run: |
          test -f vercel.json
          test -f public/site/index.html
          test -f public/site/work.html
          test -f public/site/profile.html
          test -f public/site/content/portfolio-content.json

      - name: Install Vercel CLI
        run: npm install --global vercel@58.1.0

      - name: Link project
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Validate token against linked project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"

          RAW_LENGTH=$(printf '%s' "$VERCEL_TOKEN" | wc -c | tr -d ' ')
          TRIMMED_TOKEN=$(printf '%s' "$VERCEL_TOKEN" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          TRIMMED_LENGTH=$(printf '%s' "$TRIMMED_TOKEN" | wc -c | tr -d ' ')

          echo "Token length: $RAW_LENGTH"
          echo "Trimmed token length: $TRIMMED_LENGTH"

          if [ "$RAW_LENGTH" != "$TRIMMED_LENGTH" ]; then
            echo "::error::VERCEL_TOKEN contains leading or trailing whitespace/newline."
            exit 1
          fi

          HTTP_STATUS=$(curl --silent --show-error \
            --output /tmp/vercel-project.json \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")

          echo "Vercel project API HTTP status: $HTTP_STATUS"

          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/vercel-project.json').read_text())
          if isinstance(payload, dict) and payload.get('id'):
              print('Authenticated project:', payload.get('name'))
              print('Authenticated project id:', payload.get('id'))
          elif isinstance(payload, dict):
              error = payload.get('error')
              if isinstance(error, dict):
                  print('Vercel API error code:', error.get('code'))
                  print('Vercel API error message:', error.get('message'))
              else:
                  print('Vercel API response keys:', ', '.join(sorted(payload.keys())))
          PY

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Token cannot access the linked Vercel project."
            exit 1
          fi

      - name: Deploy preview
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          DEPLOYMENT_URL=$(vercel deploy --yes --token="$VERCEL_TOKEN")
          printf '%s\n' "$DEPLOYMENT_URL" | tee deployment-url.txt
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Verify preview routes through Vercel auth
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail

          verify_route() {
            route="$1"
            expected="$2"
            output_file="$3"

            vercel curl "$route" --deployment "$DEPLOYMENT_URL" --token="$VERCEL_TOKEN" > "$output_file"
            grep -Fq "$expected" "$output_file"
            echo "Verified $route"
          }

          verify_route "/" "Shulin Chou" /tmp/home.html
          verify_route "/site/work" "Work" /tmp/work.html
          verify_route "/site/work/voucher-center" "voucher" /tmp/voucher.html
          verify_route "/site/profile" "Shulin Chou" /tmp/profile.html

      - name: Upload deployment URL
        uses: actions/upload-artifact@v4
        with:
          name: vercel-preview-url
          path: deployment-url.txt
          retention-days: 1
