name: Style B Daily Hours Lead Sync

on:
  push:
    branches:
      - integration/style-b-project-card-webp-v1
    paths:
      - '.github/workflows/style-b-daily-hours-lead-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/style-b-project-card-webp-v1
          fetch-depth: 0
      - name: Install image dependency
        run: python3 -m pip install --quiet Pillow
      - name: Materialize latest approved Daily Hours contextual lead visual
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from io import BytesIO
          from PIL import Image

          source=Path('public/site/assets/style-b/daily-hours-lead-visual.svg')
          root=ET.parse(source).getroot()
          image_node=next((node for node in root.iter() if node.tag.endswith('image')),None)
          if image_node is None:
              raise SystemExit('Daily Hours lead SVG has no image node')
          href=image_node.attrib.get('href') or image_node.attrib.get('{http://www.w3.org/1999/xlink}href') or ''
          prefix='data:image/webp;base64,'
          if not href.startswith(prefix):
              raise SystemExit('Daily Hours lead SVG does not contain WebP data URI')
          payload=base64.b64decode(''.join(href[len(prefix):].split()),validate=False)
          if payload[:4] != b'RIFF' or payload[8:12] != b'WEBP':
              raise SystemExit('Daily Hours embedded payload is not WebP')
          with Image.open(BytesIO(payload)) as raw:
              image=raw.convert('RGB')
              target_ratio=16/9
              w,h=image.size
              if abs(w/h-target_ratio)>1e-6:
                  if w/h>target_ratio:
                      cw=round(h*target_ratio); left=(w-cw)//2; image=image.crop((left,0,left+cw,h))
                  else:
                      ch=round(w/target_ratio); top=(h-ch)//2; image=image.crop((0,top,w,top+ch))
              out=Path('public/site/assets/style-b/lead-visuals-webp')
              out.mkdir(parents=True,exist_ok=True)
              for width in (800,1200,1600):
                  height=width*9//16
                  target=out/f'daily-hours-{width}.webp'
                  image.resize((width,height),Image.Resampling.LANCZOS).save(target,'WEBP',quality=90,method=6)
                  print(target,target.stat().st_size)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/site/assets/style-b/lead-visuals-webp/daily-hours-800.webp public/site/assets/style-b/lead-visuals-webp/daily-hours-1200.webp public/site/assets/style-b/lead-visuals-webp/daily-hours-1600.webp
          git diff --cached --quiet && exit 0
          git commit -m 'Sync latest Daily Hours contextual lead visual WebP'
          git push origin HEAD:integration/style-b-project-card-webp-v1
