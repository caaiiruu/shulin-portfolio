name: Style B Canonical Lead Activation

on:
  push:
    branches:
      - integration/style-b-project-card-webp-v1
    paths:
      - '.github/workflows/style-b-canonical-lead-activation.yml'

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/style-b-project-card-webp-v1
          fetch-depth: 0
      - name: Activate existing approved JPG masters and latest Daily Hours listing visual
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p public/site/assets/project-card-leads
          convert public/site/assets/style-b/lead-visuals-webp/daily-hours-1600.webp -sampling-factor 4:4:4 -quality 95 -strip public/site/assets/project-card-leads/daily-hours.jpg

          node <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const manifestPath='public/site/content/portfolio-asset-manifest.json';
          const manifest=JSON.parse(fs.readFileSync(manifestPath,'utf8'));
          const pc=manifest.projectCardLeadVisuals;
          if(!pc) throw new Error('projectCardLeadVisuals missing');

          const assetIds={
            payment:'payment-hero-unified-checkout-public-v1',
            voucher:'voucher-hero-incentive-journey-public-v1',
            'voucher-center':'voucher-center-hero-centralised-discovery-public-v1',
            'game-center':'gamecenter-hero-shipped-before-after-public-v1',
            dbs:'dbs-project-card-primary-01',
            booking:'booking-hero-connected-booking-public-v1',
            'cathay-mortgage-assistant':'cathay-mortgage-hero-consultation-public-v1',
            'cathay-sit-online-account-opening':'cathay-sit-hero-final-flow-public-v1',
            'cathay-sit-review-remediation-operations':'cathay-review-research-operating-baseline-public-v1',
            'ctbc-mortgage-self-service-app':'ctbc-mortgage-hero-final-flow-public-v1'
          };

          for(const [id,assetId] of Object.entries(assetIds)){
            const asset=manifest.items?.[assetId];
            const entry=pc.projects?.[id];
            if(!asset||!entry) throw new Error(`${id}: missing manifest source`);
            if(asset.type!=='image/jpeg'||asset.width!==2048||asset.height!==1152||asset.aspectRatio!=='16:9') throw new Error(`${id}: source is not approved 2048x1152 JPG`);
            if(asset.assetStatus!=='production'||asset.implementationStatus!=='real-active'||asset.replacementRequired!==false) throw new Error(`${id}: source not production-approved`);
            const disk='public'+asset.publicPath.replace(/^\/site/,'/site');
            if(!fs.existsSync(disk)) throw new Error(`${id}: missing ${disk}`);
            const bytes=fs.readFileSync(disk);
            const sha=crypto.createHash('sha256').update(bytes).digest('hex');
            if(asset.sha256&&asset.sha256!==sha) throw new Error(`${id}: manifest SHA mismatch`);
            Object.assign(entry,{
              canonicalAssetId:assetId,
              canonicalMaster:asset.publicPath,
              pendingCanonicalPath:asset.publicPath,
              expectedCanonicalSha256:sha,
              expectedDimensions:[asset.width,asset.height],
              expectedBytes:bytes.length,
              sourceStatus:'active-approved-canonical',
              deliverySources:[{path:asset.publicPath,width:asset.width,height:asset.height,type:'image/jpeg'}]
            });
          }

          const daily=pc.projects?.['daily-hours'];
          const dailyPath='/site/assets/project-card-leads/daily-hours.jpg';
          const dailyDisk='public'+dailyPath;
          const dailyBytes=fs.readFileSync(dailyDisk);
          const dailySha=crypto.createHash('sha256').update(dailyBytes).digest('hex');
          const jpegSize=(buf)=>{
            let i=2;
            while(i<buf.length){
              if(buf[i]!==0xFF){i++;continue;}
              const marker=buf[i+1];
              const len=buf.readUInt16BE(i+2);
              if([0xC0,0xC1,0xC2,0xC3,0xC5,0xC6,0xC7,0xC9,0xCA,0xCB,0xCD,0xCE,0xCF].includes(marker)) return [buf.readUInt16BE(i+7),buf.readUInt16BE(i+5)];
              i+=2+len;
            }
            throw new Error('Could not parse Daily Hours JPEG dimensions');
          };
          const [dw,dh]=jpegSize(dailyBytes);
          Object.assign(daily,{
            canonicalAssetId:'daily-hours-project-card-lead-v1',
            canonicalMaster:dailyPath,
            pendingCanonicalPath:dailyPath,
            expectedCanonicalSha256:dailySha,
            expectedDimensions:[dw,dh],
            expectedBytes:dailyBytes.length,
            sourceStatus:'active-approved-canonical',
            sourceLineage:'Latest Human-selected Daily Hours contextual Lead Visual, listing-only JPG derivative from the synced 1600px source; no upscale.',
            deliverySources:[{path:dailyPath,width:dw,height:dh,type:'image/jpeg'}]
          });
          manifest.items['daily-hours-project-card-lead-v1']={
            id:'daily-hours-project-card-lead-v1',projectId:'daily-hours',type:'image/jpeg',publicPath:dailyPath,
            aspectRatio:`${dw}:${dh}`,assetStatus:'production',implementationStatus:'real-active',placeholderFallbackAssetId:null,
            replacementRequired:false,publicBuild:true,width:dw,height:dh,sha256:dailySha,
            alt:'Daily Hours project economics and capacity workspace shown on a laptop.',
            sourceLineage:daily.sourceLineage,finalUseRole:'Daily Hours ProjectCard Lead Visual'
          };
          pc.canonicalFormat='jpg';
          pc.assetOwnerDirectory='existing approved project lead assets; Daily Hours listing derivative lives under /site/assets/project-card-leads/';
          fs.writeFileSync(manifestPath,JSON.stringify(manifest,null,2)+'\n');
          NODE

          node <<'NODE'
          const fs=require('fs');
          const p='public/site/assets/js/project-card-media.js';
          let s=fs.readFileSync(p,'utf8');
          s=s.replace("const REGISTRY_URL = '/site/content/project-card-registry.json';", "const REGISTRY_URL = '/site/content/portfolio-asset-manifest.json';");
          s=s.replace("registry = await response.json();\n    window.PROJECT_CARD_REGISTRY = Object.freeze(registry);", "const manifest = await response.json();\n    registry = manifest.projectCardLeadVisuals;\n    if (!registry) throw new Error('ProjectCard Lead Visual registry missing from asset manifest');\n    window.PROJECT_CARD_REGISTRY = Object.freeze(registry);");
          fs.writeFileSync(p,s);
          NODE

          rm -rf public/site/assets/style-b/lead-visuals-webp
          rm -rf public/site/assets/style-b/lead-visuals
          rm -f public/site/assets/style-b/daily-hours-lead-visual.svg
          rm -f .github/workflows/style-b-canonical-lead-activation.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --check --cached
          git commit -m 'Activate approved JPG ProjectCard lead visuals'
          git push origin HEAD:integration/style-b-project-card-webp-v1
