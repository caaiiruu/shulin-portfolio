name: R164.9A Manifest runtime cleanup
on:
  pull_request:
    branches:
      - qa/r146-r43-preview-2026-08-06
permissions:
  contents: read
jobs:
  cleanup:
    if: github.head_ref == 'repair/r164-payment-final'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Diagnose Manifest runtime set difference
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const content=JSON.parse(fs.readFileSync('public/site/content/portfolio-content.json','utf8'));
          const manifest=JSON.parse(fs.readFileSync('public/site/content/portfolio-asset-manifest.json','utf8'));
          const placeholders=new Set([
            'project-visual-placeholder-wide-v1',
            'project-visual-placeholder-portrait-v1',
            'project-visual-placeholder-square-v1',
            'project-video-placeholder-wide-v1',
          ]);
          const slots=[];
          function walk(value,projectId,location=[]){
            if(Array.isArray(value)) return value.forEach((entry,index)=>walk(entry,projectId,[...location,index]));
            if(!value||typeof value!=='object') return;
            for(const [key,child] of Object.entries(value)){
              const next=[...location,key];
              if(['assetId','publicAssetId','beforeAssetId','shippedAssetId'].includes(key)&&typeof child==='string') slots.push({projectId,slotId:next.join('.'),assetId:child});
              else if(key!=='sourceArchives') walk(child,projectId,next);
            }
          }
          for(const [projectId,project] of Object.entries(content.projects||{})) walk(project,projectId);
          const runtime=new Set(slots.map(x=>x.assetId));
          const manifestIds=new Set(Object.keys(manifest.items||{}));
          const extras=[...manifestIds].filter(id=>!runtime.has(id)&&!placeholders.has(id)).sort();
          const missing=[...runtime].filter(id=>!manifestIds.has(id)).sort();
          console.log('RUNTIME_UNIQUE='+runtime.size);
          console.log('MANIFEST_ITEMS='+manifestIds.size);
          console.log('EXTRA='+JSON.stringify(extras));
          console.log('MISSING='+JSON.stringify(missing));
          if(missing.length) process.exitCode=2;
          NODE
