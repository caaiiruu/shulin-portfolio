name: R164.9A Manifest runtime cleanup
on:
  pull_request:
    branches:
      - qa/r146-r43-preview-2026-08-06
permissions:
  contents: write
jobs:
  cleanup:
    if: github.head_ref == 'repair/r164-payment-final'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Remove superseded non-runtime Manifest record
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const p='public/site/content/portfolio-asset-manifest.json';
          const m=JSON.parse(fs.readFileSync(p,'utf8'));
          if(m.contentVersion!=='2026-08-20-r164.9') throw new Error(`Unexpected manifest version ${m.contentVersion}`);
          const id='payment-system-transaction-map-public-v1';
          if(!m.items[id]) throw new Error(`Expected superseded runtime record missing: ${id}`);
          delete m.items[id];
          fs.writeFileSync(p,JSON.stringify(m,null,2)+'\n');
          NODE
          rm .github/workflows/r1649a-manifest-runtime-cleanup.yml
          node public/site/qa/asset-governance.mjs
          git diff --check
      - name: Commit narrow manifest repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Portfolio R164.9 Integration'
          git config user.email 'actions@users.noreply.github.com'
          git add -A -- public/site/content/portfolio-asset-manifest.json .github/workflows/r1649a-manifest-runtime-cleanup.yml
          git commit -m 'R164.9A remove superseded non-runtime Core asset record'
          echo "REPAIR_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:repair/r164-payment-final
